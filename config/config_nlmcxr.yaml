# config_nlmcxr.yaml — Data-Juicer NLMCXR 胸片报告冲突检测管道
# 运行方式 (CLI): python -m data_juicer --config config_nlmcxr.yaml
# 测试方式 (直接调用算子): /Users/gexuancheng/Desktop/research2/data-juicer/.venv/bin/python3 run_nlmcxr_dj.py

# ---------- 全局配置 ----------
dataset_path: data/nlmcxr/nlmcxr_dj.jsonl
work_dir: data/nlmcxr/output_dj
np: 1  # CPU运行, 单进程 (TorchXRayVision模型在Filter中加载)

# 自定义算子注册 (import 时触发 @OPERATORS.register_module)
custom_operator_paths:
  - src/operators/nlmcxr_operators.py

# 全局统计报告导出
stats_export_path: data/nlmcxr/output_dj/global_report.json

# ---------- 算子管道 (Mapper 丰富特征 -> Filter 消费特征) ----------
process:
  # 步骤1 (Mapper): 解析 text/images, 存入 meta.report / meta.image_path
  - nlmcxr_data_mapper:

  # 步骤2 (Filter): TorchXRayVision DenseNet121 X光片疾病推理 (6种疾病)
  - xray_image_analysis_filter:
      weights: densenet121-res224-mimic_ch
      stats_export_path: data/nlmcxr/output_dj/xray_analysis_stats.json

  # 步骤3 (Filter): 报告文本NER (正则+否定/不确定检测, 三态标注)
  - report_ner_filter:
      window: 30
      stats_export_path: data/nlmcxr/output_dj/report_ner_stats.json

  # 步骤4 (Filter): 图片-报告三态冲突矩阵
  - image_report_conflict_filter:
      stats_export_path: data/nlmcxr/output_dj/conflict_stats.json
