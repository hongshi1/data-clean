# config_medical.yaml — Data-Juicer 医疗多模态数据冲突检测管道
# 运行方式 (CLI): python -m data_juicer --config config_medical.yaml
# 测试方式 (直接调用算子): /Users/gexuancheng/Desktop/research2/data-juicer/.venv/bin/python3 run_medical_dj.py

# ---------- 全局配置 ----------
dataset_path: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/medtvt_dj.jsonl
work_dir: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/output_dj
np: 4  # 进程数 (Data-Juicer 多进程并行)

# 自定义算子注册 (import 时触发 @OPERATORS.register_module)
custom_operator_paths:
  - /Users/gexuancheng/Desktop/research2/data_clean/src/operators/medical_operators.py

# 全局统计报告导出
stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/output_dj/global_report.json

# ---------- 算子管道 (Mapper 丰富特征 -> Filter 消费特征) ----------
process:
  # 步骤1 (Mapper): 解析 meta 中的 labs/diagnosis, 增补结构化特征
  - medtvt_data_mapper:
      key_lab_itemids: ["50893", "51237", "50931", "50971", "50820"]

  # 步骤2 (Filter): L1 单指标正常范围检测
  - medical_lab_range_filter:
      knowledge_base_path: /Users/gexuancheng/Desktop/research2/data_clean/knowledge/medical_kb.json
      stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/output_dj/lab_range_stats.json

  # 步骤3 (Filter): L2 血检异常 vs 诊断标签冲突 (与1444结果对齐)
  - lab_diagnosis_conflict_filter:
      knowledge_base_path: /Users/gexuancheng/Desktop/research2/data_clean/knowledge/medical_kb.json
      stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/output_dj/lab_diag_conflict_stats.json

  # 步骤4 (Filter): L3 多指标协同一致性
  - cross_lab_consistency_filter:
      knowledge_base_path: /Users/gexuancheng/Desktop/research2/data_clean/knowledge/medical_kb.json
      stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/output_dj/cross_lab_stats.json

  # 步骤5 (Filter): 诊断标签间一致性
  - diagnosis_consistency_filter:
      stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/data/medical_data/medtvt/output_dj/diag_consistency_stats.json
