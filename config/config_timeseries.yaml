# Data-Juicer 时序数据处理配置
# 输入: h4r_welding.jsonl (4条焊接多模态样本: text+images+meta{csv_path,defect_label})
# 算子: TimeSeriesStatsMapper -> TimeSeriesAnomalyFilter -> CrossModalConflictFilter
dataset_path: /Users/gexuancheng/Desktop/research2/data_clean/h4r_welding.jsonl
work_dir: /Users/gexuancheng/Desktop/research2/data_clean/output_ts
np: 1

custom_operator_paths:
  - /Users/gexuancheng/Desktop/research2/data_clean/timeseries_operators.py

# 统计报告导出路径
stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/output_ts/ts_stats_report.json

process:
  # 步骤1 (Mapper): 提取焊接段(current>10A)统计特征, 写入meta.ts_stats
  - time_series_stats_mapper:
      current_threshold: 10.0

  # 步骤2 (Filter): IsolationForest时序异常检测, 保留异常比例<0.5的样本
  - time_series_anomaly_filter:
      threshold: 0.5
      contamination: 0.1
      stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/output_ts/anomaly_stats.json

  # 步骤3 (Filter): 图像(CLIP)+时序+标签 跨模态冲突检测, 丢弃冲突样本
  - cross_modal_conflict_filter:
      hf_clip: openai/clip-vit-base-patch32
      clip_score_threshold: 0.2
      ts_anomaly_threshold: 0.3
      contamination: 0.1
      stats_export_path: /Users/gexuancheng/Desktop/research2/data_clean/output_ts/conflict_stats.json
