<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微调数据集构建平台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --primary:#2f7ef4; --primary-dark:#1c62d0; --primary-light:#e8f1ff;
  --bg:#f4f6fa; --card:#fff; --line:#e6eaf0; --line2:#eef1f6;
  --txt:#1f2733; --txt2:#5a6473; --txt3:#98a1b0;
  --green:#12b76a; --green-bg:#e7f8f0; --orange:#f79009; --orange-bg:#fff5e6;
  --red:#f04438; --red-bg:#fdecec; --blue-bg:#eaf2ff; --purple:#7a5af8; --purple-bg:#f1eeff;
  --radius:6px; --shadow:0 1px 3px rgba(20,35,70,.06),0 6px 18px rgba(20,35,70,.04);
}
body{ font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--txt); font-size:13px; line-height:1.6; }
a{ color:var(--primary); text-decoration:none; }
/* ---------- 顶部导航 ---------- */
/* 导航栏强制单行：logo 左对齐并压缩两侧留白，菜单项不换行、不收缩 */
.topbar{ height:64px; background:#fff; border-bottom:1px solid var(--line);
  display:flex; align-items:center; padding:0 14px; position:sticky; top:0; z-index:60; }
.logo{ width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700;
  flex:0 0 auto; }
.logo-txt{ margin-left:8px; font-size:16px; font-weight:700; letter-spacing:0; white-space:nowrap; }
.logo-sub{ font-size:11px; color:var(--txt3); font-weight:400; letter-spacing:0; }
.nav{ flex:1; display:flex; justify-content:flex-start; gap:0; position:relative;
  margin-left:18px; flex-wrap:nowrap; }
.nav-item{ padding:0 11px; height:63px; display:flex; align-items:center; gap:5px; cursor:pointer;
  color:var(--txt); border-bottom:2px solid transparent; white-space:nowrap; font-size:14px; position:relative;
  flex:0 0 auto; }
.nav-item:hover{ color:var(--primary); background:var(--bg); }
.nav-item.on{ color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.nav-item .ic{ font-size:15px; display:inline-flex; align-items:center; }
/* 下拉指示三角：仅含多个二级菜单的一级菜单显示 */
.nav-caret{ font-size:10px; line-height:1; color:var(--txt3); margin-left:1px;
  transition:transform .15s ease; }
.nav-item:hover .nav-caret, .nav-item.on .nav-caret{ color:var(--primary); }
.nav-item:hover .nav-caret{ transform:rotate(180deg); }
/* 窄屏保底：不改字号，仅依次收紧间距、隐藏平台名称与菜单图标，保证导航始终单行 */
@media (max-width:1280px){
  .topbar{ padding:0 10px; }
  .nav{ margin-left:10px; }
  .nav-item{ padding:0 9px; }
}
@media (max-width:1180px){
  .logo-txt{ display:none; }
  .nav{ margin-left:8px; }
}
@media (max-width:1000px){
  .nav-item{ padding:0 7px; gap:3px; }
  .nav-item .ic{ display:none; }
}
.nav-dropdown{ position:absolute; top:63px; left:0; background:#fff; border:1px solid var(--line);
  border-radius:0 0 6px 6px; box-shadow:var(--shadow); min-width:180px; display:none; z-index:70; }
.nav-item:hover .nav-dropdown{ display:block; }
.nav-dropdown-item{ padding:10px 16px; cursor:pointer; color:var(--txt2); display:flex; align-items:center;
  gap:8px; font-size:13px; border-bottom:1px solid var(--line2); }
.nav-dropdown-item:last-child{ border-bottom:none; }
.nav-dropdown-item:hover{ background:var(--primary-light); color:var(--primary); }
.nav-dropdown-item.on{ background:var(--primary-light); color:var(--primary); font-weight:600; }
.user{ display:flex; align-items:center; gap:8px; color:var(--txt2); cursor:pointer;
  flex:0 0 auto; white-space:nowrap; margin-left:12px; position:relative;
  padding:5px 10px; border-radius:16px; }
.user:hover{ background:var(--primary-light); }
.avatar{ width:26px; height:26px; border-radius:50%; background:var(--primary-light); color:var(--primary);
  display:flex; align-items:center; justify-content:center; font-size:12px; }
.user-caret{ font-size:9px; color:var(--txt3); margin-left:2px; }
/* admin 下拉菜单 */
.user-dd{ position:absolute; right:0; top:calc(100% + 6px); min-width:132px; background:#fff;
  border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(20,35,70,.14);
  overflow:hidden; z-index:200; }
.user-dd-i{ padding:10px 14px; font-size:13px; color:var(--txt); display:flex; align-items:center; gap:8px; }
.user-dd-i:hover{ background:var(--bg); color:var(--primary); }
/* ---------- 分类树 ---------- */
.tree-i{ padding:8px 12px; border-radius:var(--radius); cursor:pointer; display:flex; align-items:center;
  justify-content:space-between; margin-bottom:2px; color:var(--txt2); font-size:13px; }
.tree-i:hover{ background:var(--bg); color:var(--txt); }
.tree-i.on{ background:var(--primary-light); color:var(--primary); font-weight:600; }
.tree-i .n{ font-size:12px; color:var(--txt3); padding:2px 6px; background:var(--bg); border-radius:10px; }
.tree-i.on .n{ background:#fff; color:var(--primary); }
.tree-i .ops{ position:relative; visibility:hidden; flex:0 0 auto; }
.tree-i:hover .ops, .tree-i .ops.open{ visibility:visible; }
.tree-i .op-more{ padding:1px 5px; font-size:14px; line-height:1; color:var(--txt3);
  border-radius:4px; cursor:pointer; }
.tree-i .op-more:hover{ background:var(--line2); color:var(--primary); }
.cat-menu{ position:absolute; right:0; top:20px; min-width:118px; background:#fff;
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 6px 20px rgba(20,35,70,.14);
  z-index:40; padding:3px; }
.cat-menu div{ padding:6px 10px; border-radius:4px; font-size:12.5px; color:var(--txt2);
  display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer; font-weight:normal; }
.cat-menu div:hover{ background:var(--primary-light); color:var(--primary); }
.cat-menu div.red:hover{ background:var(--red-bg); color:var(--red); }
.tree-lvl2{ padding-left:24px; }
.tree-lvl3{ padding-left:48px; }
.tree-toggle{ font-size:10px; color:var(--txt3); margin-right:4px; cursor:pointer; user-select:none; }
/* ---------- 布局 ---------- */
.wrap{ display:flex; align-items:flex-start; }
.main{ flex:1; min-width:0; padding:16px 24px 40px; width:100%; }
.crumb{ color:var(--txt3); margin-bottom:14px; font-size:12px;
  display:flex; align-items:center; gap:14px; }
.crumb b{ color:var(--txt2); font-weight:400; }
.crumb .cb-p{ flex:0 0 auto; }
/* 提示语靠右，与内容区右边缘对齐 */
.crumb .mtip{ margin-left:auto; }
/* ---------- 卡片 / 面板 ---------- */
.card{ background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:var(--shadow);
  margin-bottom:14px; }
.card-hd{ padding:12px 16px; border-bottom:1px solid var(--line2); display:flex; align-items:center;
  justify-content:space-between; gap:12px; flex-wrap:wrap; }
.card-hd h3{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px; }
.card-hd h3::before{ content:''; width:3px; height:13px; background:var(--primary); border-radius:2px; }
.card-bd{ padding:14px 16px; }
.card-bd.np{ padding:0; }
.tip{ background:var(--blue-bg); border:1px solid #cfe1ff; color:#2b5fbd; padding:9px 12px;
  border-radius:var(--radius); margin-bottom:12px; display:flex; gap:8px; align-items:flex-start; font-size:12px; }
.tip.warn{ background:var(--orange-bg); border-color:#ffe0b2; color:#a35c00; }
/* ---------- 按钮 ---------- */
.btn{ display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 13px; border-radius:var(--radius);
  border:1px solid var(--line); background:#fff; color:var(--txt2); cursor:pointer; font-size:12.5px;
  font-family:inherit; white-space:nowrap; transition:.15s; }
.btn:hover{ border-color:var(--primary); color:var(--primary); }
.btn.pri{ background:var(--primary); border-color:var(--primary); color:#fff; }
.btn.pri:hover{ background:var(--primary-dark); border-color:var(--primary-dark); color:#fff; }
.btn.dgr{ color:var(--red); border-color:#f6c7c3; }
.btn.dgr:hover{ background:var(--red-bg); border-color:var(--red); color:var(--red); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--primary); padding:0 6px; }
.btn.ghost:hover{ background:var(--primary-light); }
.btn.sm{ height:26px; padding:0 9px; font-size:12px; }
.btn.lg{ height:34px; padding:0 18px; font-size:13px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-grp{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
/* ---------- 表单 ---------- */
.inp,.sel,.ta{ height:30px; border:1px solid var(--line); border-radius:var(--radius); padding:0 10px;
  font-size:12.5px; color:var(--txt); background:#fff; font-family:inherit; outline:none; width:100%; }
.inp:focus,.sel:focus,.ta:focus{ border-color:var(--primary); box-shadow:0 0 0 2px rgba(47,126,244,.12); }
.ta{ height:auto; padding:7px 10px; line-height:1.6; resize:vertical; }
.sel{ cursor:pointer; }
/* 多选下拉：沿用单选样式，仅放开高度以展示多行选项 */
.sel.multi{ height:auto; min-height:96px; padding:5px 6px; }
.sel.multi optgroup{ font-size:12px; color:var(--txt2); }
.sel.multi option{ padding:3px 6px; border-radius:3px; }
.fbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
/* 单行查询条件：允许换行，标签与输入框同行 */
.fbar.one{ flex-wrap:wrap; align-items:center; gap:14px; padding-bottom:2px; }
.fbar.one>.fitem{ flex:0 0 auto; flex-direction:row; align-items:center; gap:8px; }
/* 强制单行：条件较多时由 .grow 项吸收压缩，其余项保持原宽 */
.fbar.one.nowrap{ flex-wrap:nowrap; gap:10px; }
.fbar.one.nowrap>.fitem{ min-width:0; }
.fbar.one.nowrap>.fitem.grow{ flex:1 1 auto; }
.fbar.one.nowrap>.fitem.grow>.inp{ width:100%; min-width:80px; max-width:220px; }
.fbar.one.nowrap .dinp{ width:112px; }
.fitem{ display:flex; flex-direction:column; gap:4px; }
.fitem>label{ font-size:12px; color:var(--txt2); white-space:nowrap; }
.fitem.w160{ width:160px; } .fitem.w200{ width:200px; } .fitem.w120{ width:120px; }
/* 日期区间：两个日期框以横线连接 */
.drange{ display:flex; align-items:center; gap:6px; }
.drange .dinp{ width:118px; }
.dsep{ color:var(--txt3); flex:0 0 auto; user-select:none; }
/* 日期区间（单框）：起止日期合并在一个输入框内，右侧提供清除按钮 */
.dbox{ display:inline-flex; align-items:center; gap:4px; height:30px; padding:0 6px 0 8px;
  border:1px solid var(--line); border-radius:var(--radius); background:#fff; cursor:pointer;
  transition:border-color .15s; }
.dbox:hover{ border-color:var(--primary); }
.dbox.on{ border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-light); }
.dbox .di{ border:0; outline:0; padding:0; font-size:12.5px; color:var(--txt); background:transparent;
  width:96px; font-family:inherit; cursor:pointer; }
.dbox .di::-webkit-calendar-picker-indicator{ opacity:.45; cursor:pointer; }
.dbox .di:hover::-webkit-calendar-picker-indicator{ opacity:.8; }
.dbox .dsep{ font-size:12px; }
/* 清除按钮：仅在已选日期时出现，避免空态多一个无效图标 */
.dbox .dclr{ flex:0 0 auto; width:16px; height:16px; border-radius:50%; border:0; padding:0;
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px;
  line-height:1; color:var(--txt3); background:var(--line2); }
.dbox .dclr:hover{ background:var(--red-bg); color:var(--red); }
.frow{ display:flex; gap:14px; flex-wrap:wrap; }
.fg{ margin-bottom:13px; }
.fg>label{ display:block; font-size:12.5px; color:var(--txt2); margin-bottom:5px; }
.fg>label .req{ color:var(--red); margin-right:3px; }
.chk{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:12.5px; color:var(--txt2); }
.chk input{ width:14px; height:14px; accent-color:var(--primary); cursor:pointer; }
.chk-list{ display:flex; flex-wrap:wrap; gap:10px 18px; }
.hint{ font-size:11.5px; color:var(--txt3); margin-top:4px; }
/* ---------- 表格 ---------- */
.tbwrap{ overflow-x:auto; }
table.tb{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.tb th{ background:#f7f9fc; color:var(--txt2); font-weight:600; text-align:left; padding:9px 10px;
  border-bottom:1px solid var(--line); white-space:nowrap; }
table.tb td{ padding:9px 10px; border-bottom:1px solid var(--line2); color:var(--txt); vertical-align:middle; }
table.tb tbody tr:hover{ background:#fafcff; }
table.tb td.ops{ white-space:nowrap; }
table.tb td.ops > span{ margin-right:8px; }
table.tb td.ops > span:last-child{ margin-right:0; }
table.tb .lnk{ color:var(--primary); cursor:pointer; margin-right:9px; }
table.tb .lnk:hover{ text-decoration:underline; }
table.tb .lnk.disabled{ color:#ccc; cursor:not-allowed; pointer-events:none; }
table.tb .lnk.red{ color:var(--red); }
table.tb .ell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
table.tb td.ell{ max-width:0; }
.empty{ padding:44px; text-align:center; color:var(--txt3); }
.empty .big{ font-size:34px; opacity:.35; display:block; margin-bottom:8px; }
/* ---------- 标签 ---------- */
.tag{ display:inline-flex; align-items:center; gap:3px; height:21px; padding:0 8px; border-radius:11px;
  font-size:11.5px; background:var(--bg); color:var(--txt2); border:1px solid var(--line); white-space:nowrap; }
.tag.ok{ background:var(--green-bg); color:#087443; border-color:#b9ecd2; }
.tag.wait{ background:var(--orange-bg); color:#a35c00; border-color:#ffddb0; }
.tag.err{ background:var(--red-bg); color:#b42318; border-color:#f8cfcb; }
.tag.info{ background:var(--blue-bg); color:#2b5fbd; border-color:#cfe1ff; }
.tag.pur{ background:var(--purple-bg); color:#5b3fd6; border-color:#ddd5ff; }
.tag.sq{ border-radius:4px; }
.dot{ width:6px; height:6px; border-radius:50%; background:currentColor; display:inline-block; }
/* ---------- 分页 ---------- */
.pager{ display:flex; align-items:center; justify-content:space-between; padding:11px 16px;
  border-top:1px solid var(--line2); color:var(--txt2); font-size:12px; flex-wrap:wrap; gap:10px; }
.pgs{ display:flex; gap:5px; align-items:center; }
.pg{ min-width:27px; height:27px; padding:0 7px; border:1px solid var(--line); border-radius:4px; background:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--txt2); }
.pg:hover{ border-color:var(--primary); color:var(--primary); }
.pg.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
.sel.psize{ width:auto; height:26px; padding:0 4px; display:inline-block; }
/* ---------- Tabs / 胶囊 ---------- */
.tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap; }
.tab{ padding:9px 18px; cursor:pointer; color:var(--txt2); border-bottom:2px solid transparent; font-size:13px; }
.tab:hover{ color:var(--primary); }
.tab.on{ color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
/* 窄栏内的选项卡：强制单行，等分宽度不换行 */
.tabs.tight{ flex-wrap:nowrap; margin-bottom:0; }
.tabs.tight .tab{ flex:1; min-width:0; padding:9px 4px; text-align:center; font-size:12.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pills{ display:flex; gap:0; margin-bottom:14px; border:1px solid var(--line); border-radius:var(--radius);
  overflow:hidden; width:fit-content; background:#fff; flex-wrap:wrap; }
.pill{ padding:8px 20px; cursor:pointer; color:var(--txt2); background:#fff; border-right:1px solid var(--line);
  font-size:13px; }
.pill:last-child{ border-right:none; }
.pill.on{ background:var(--primary); color:#fff; font-weight:600; }
/* 下拉菜单项 */
.menu-item{ padding:8px 14px; cursor:pointer; font-size:13px; color:var(--txt); white-space:nowrap; }
.menu-item:hover{ background:var(--bg); color:var(--primary); }
/* ===== 模块提示语：面包屑行右侧，蓝色背景徽标 ===== */
.mtip{ display:inline-flex; align-items:flex-start; gap:6px; padding:6px 13px;
  background:linear-gradient(100deg,#eaf2ff,#f2f0ff); border:1px solid #d7e4fb;
  border-left:3px solid var(--primary); border-radius:6px;
  font-size:12px; font-weight:normal; line-height:1.6; color:#2c4d86; white-space:normal; }
.mtip .i{ flex:0 0 auto; color:var(--primary); }
/* ===== 登录页 ===== */
.lg-wrap{ display:flex; min-height:100vh; align-items:center; gap:36px; padding:0 34px;
  background:
    radial-gradient(1100px 520px at 8% 12%, #dfeaff 0%, rgba(223,234,255,0) 62%),
    radial-gradient(900px 520px at 92% 88%, #e9e4ff 0%, rgba(233,228,255,0) 60%),
    linear-gradient(135deg,#f2f6fe 0%,#f7f9fc 52%,#f0f3ff 100%); }
/* 左侧：无卡片，直接落在渐变背景上；宽度收窄以让出右侧流程图空间 */
.lg-left{ width:372px; flex:0 0 372px; }
.lg-brand{ display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.lg-logo{ width:46px; height:46px; border-radius:12px;
  background:linear-gradient(135deg,#2f7ef4,#6f4ff2); box-shadow:0 8px 20px rgba(47,126,244,.28);
  display:flex; align-items:center; justify-content:center; font-size:24px; }
.lg-tt{ font-size:27px; font-weight:800; color:#1a2540; letter-spacing:.6px; }
/* 主标语：渐变蓝 + 加粗高亮（字号较标题小两号） */
.lg-slogan{ font-size:17px; font-weight:800; line-height:1.8; margin-bottom:32px; letter-spacing:.3px;
  background:linear-gradient(100deg,#1c62d0 0%,#2f7ef4 38%,#6f4ff2 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#2f7ef4; }
/* 输入项：下划线式，不用卡片边框 */
.lg-fg{ margin-bottom:20px; }
.lg-fg label{ display:block; font-size:12.5px; color:var(--txt2); margin-bottom:7px; letter-spacing:.3px; }
.lg-inp{ width:100%; height:44px; border:0; border-bottom:1.5px solid #cfdaee; border-radius:0;
  padding:0 2px; font-size:14.5px; color:var(--txt); outline:none; background:transparent; transition:.18s; }
.lg-inp::placeholder{ color:#a9b4c6; }
.lg-inp:focus{ border-bottom-color:var(--primary); box-shadow:0 1px 0 0 var(--primary); }
.lg-btn{ width:100%; height:46px; margin-top:12px; border:0; border-radius:24px; cursor:pointer;
  background:linear-gradient(100deg,#2f7ef4,#6f4ff2); color:#fff; font-size:15.5px; font-weight:700;
  letter-spacing:3px; box-shadow:0 10px 24px rgba(47,126,244,.3); transition:.18s; }
.lg-btn:hover{ transform:translateY(-1px); box-shadow:0 14px 30px rgba(47,126,244,.38); }
.lg-err{ margin-top:10px; font-size:12.5px; color:var(--red); min-height:17px; }
/* ===== 右侧：微调数据集构建九步骤 ===== */
.lg-right{ flex:1; min-width:0; background:rgba(255,255,255,.62); border:1px solid #e4ebfa;
  border-radius:18px; padding:28px 30px 32px; backdrop-filter:blur(6px);
  box-shadow:0 18px 50px rgba(20,35,70,.09); }
/* 标题：两侧装饰线 */
.lg-rt-h{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:26px; }
.lg-rt-h .t{ font-size:23px; font-weight:800; color:#1a2540; letter-spacing:1px; white-space:nowrap; }
.lg-rt-h .t b{ background:linear-gradient(100deg,#2f7ef4,#6f4ff2);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#2f7ef4; }
.lg-rt-h .ln{ flex:1; height:1px; max-width:170px;
  background:linear-gradient(90deg,rgba(47,126,244,0),#9dc0f8); }
.lg-rt-h .ln.r{ background:linear-gradient(90deg,#9dc0f8,rgba(47,126,244,0)); }
.lg-rt-h .dot{ color:#5b93f0; font-size:12px; flex:0 0 auto; }
/* 流程行：每行 3 步，步间箭头 */
.flow-row{ display:flex; align-items:stretch; gap:0; margin-bottom:8px; }
.flow-n{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
/* 步骤胶囊头：编号 + 名称 */
.flow-cap{ display:flex; align-items:center; gap:10px; padding:10px 17px; margin-bottom:10px;
  background:linear-gradient(180deg,#fff,#f7faff); border:1px solid #d4e2fa; border-radius:24px;
  box-shadow:0 4px 12px rgba(47,126,244,.1); }
.flow-cap .no{ font-size:16px; font-weight:800; font-style:italic; letter-spacing:.5px;
  background:linear-gradient(100deg,#2f7ef4,#6f4ff2);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:#2f7ef4; }
.flow-cap .nm{ font-size:14.5px; font-weight:700; color:#12305f; white-space:nowrap; }
/* 步骤说明卡：白色背景高亮 + 深蓝字体 + 顶部渐变高亮条 */
.flow-bd{ flex:1; position:relative; overflow:hidden;
  background:#ffffff;
  border:1px solid #c8daf7; border-radius:12px;
  padding:14px 15px 15px; font-size:12.5px; color:#1e4278; line-height:1.85;
  box-shadow:0 5px 18px rgba(47,126,244,.14); transition:.2s; }
.flow-bd::before{ content:''; position:absolute; left:0; right:0; top:0; height:3px;
  background:linear-gradient(90deg,#2f7ef4,#6f4ff2); }
.flow-n:hover .flow-bd{ transform:translateY(-2px);
  border-color:#b9d3f8; box-shadow:0 10px 24px rgba(47,126,244,.18); }
.flow-bd .ic{ float:right; font-size:26px; margin:0 0 4px 10px;
  filter:drop-shadow(0 2px 4px rgba(47,126,244,.25)); }
/* 步骤间箭头 */
.flow-ar{ flex:0 0 18px; display:flex; align-items:flex-start; justify-content:center;
  padding-top:17px; color:#0f3d7a; font-size:12px; letter-spacing:-1px; }
/* 行间「蛇形」连接：右折 / 左折 */
.flow-turn{ display:flex; align-items:center; margin:2px 0 8px; color:#0f3d7a; font-size:13px; }
.flow-turn .seg{ flex:1; height:1px; background:linear-gradient(90deg,rgba(15,61,122,.12),#5b8fd6); }
.flow-turn .seg.l{ background:linear-gradient(90deg,#5b8fd6,rgba(15,61,122,.12)); }
.flow-turn .ar{ padding:0 6px; }
.subtabs{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.subtab{ padding:6px 14px; border:1px solid var(--line); border-radius:16px; background:#fff; cursor:pointer;
  color:var(--txt2); font-size:12.5px; }
.subtab.on{ background:var(--primary-light); border-color:var(--primary); color:var(--primary-dark); font-weight:600; }
/* ---------- 弹窗 ---------- */
.mask{ position:fixed; inset:0; background:rgba(15,25,45,.45); z-index:100; display:flex;
  align-items:flex-start; justify-content:center; padding:50px 16px; overflow:auto; }
.modal{ background:#fff; border-radius:8px; width:640px; max-width:100%; box-shadow:0 12px 44px rgba(10,20,40,.24);
  animation:up .18s ease; }
.modal.w480{ width:480px; } .modal.w800{ width:800px; } .modal.w1000{ width:1000px; } .modal.w1150{ width:1150px; }
.modal.w1400{ width:1400px; } .modal.w1500{ width:1500px; } .modal.w1600{ width:1600px; }
@keyframes up{ from{ transform:translateY(14px); opacity:0; } to{ transform:none; opacity:1; } }
.m-hd{ padding:13px 18px; border-bottom:1px solid var(--line2); display:flex; align-items:center;
  justify-content:space-between; }
.m-hd h3{ font-size:14.5px; font-weight:600; }
.m-x{ cursor:pointer; color:var(--txt3); font-size:18px; line-height:1; padding:2px 6px; border-radius:4px; }
.m-x:hover{ background:var(--bg); color:var(--txt); }
.m-bd{ padding:16px 18px; max-height:calc(100vh - 220px); overflow:auto; }
/* 文件查看弹窗：滚动条只作用于「原始文件预览」内容区，弹窗本身不滚动 */
.m-bd.nosc{ overflow:hidden; display:flex; flex-direction:column; }
.m-bd.nosc>.box{ flex:1; min-height:0; display:flex; flex-direction:column; }
.m-bd.nosc>.box>.box-c{ flex:1; min-height:0; overflow:auto; }
/* 预检结果弹窗：正文（pre / split / tip+pre 组合）自身滚动，弹窗不滚动 */
.m-bd.nosc>.pre{ flex:1; min-height:0; overflow:auto; max-height:none; }
.m-bd.nosc>.split{ flex:1; min-height:0; }
.m-bd.nosc>.split>div{ display:flex; flex-direction:column; }
.m-bd.nosc>.split .split-c{ flex:1; min-height:0; max-height:none; overflow:auto; }
.m-bd.nosc .split-c .pre{ max-height:none; overflow:visible; }  /* split-c 内的 pre 不独立滚动 */
.m-bd.nosc>.tip{ flex:0 0 auto; }
/* 预览内部容器不再自带滚动条，保证整个预览区只有一个滚动条 */
.m-bd.nosc .tbwrap{ max-height:none; overflow:visible; }
.m-bd.nosc .box-c>.pre{ max-height:none; overflow:visible; }  /* box-c 内的 pre 不独立滚动 */
/* 人工编辑内容区：可编辑，异常文本仅用红色字体标识（不加底色） */
.ed-doc{ padding:12px 14px; font-family:Consolas,"Courier New",monospace; font-size:12.5px;
  line-height:1.8; white-space:pre-wrap; word-break:break-all; color:#33405a; outline:none;
  background:#fbfcfe; min-height:100%; }
.ed-doc:focus{ background:#fff; }
.ed-abn{ color:var(--red); font-weight:600; }
/* 表格人工编辑：异常单元格输入框用红色字体标识（与查看页高亮位置一致） */
input.tbl-cell.cell-abn,
input.inp.cell-abn{ color:var(--red); font-weight:600; border-color:var(--red); }
/* PDF 提取文本中的图片占位块 */
.img-ph{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  border:1px dashed var(--line); border-radius:6px; background:#f7f9fc; color:var(--txt2);
  padding:18px 12px; margin:8px 0;
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif; }
.img-ph .ic{ font-size:30px; opacity:.55; }
.img-ph .cap{ font-size:12.5px; font-weight:600; color:var(--txt); }
.img-ph .note{ font-size:11.5px; color:var(--txt3); }
.m-bd.nosc .pre{ max-height:none; overflow:visible; }
.m-bd.nosc .doc{ border:0; }
.m-ft{ padding:11px 18px; border-top:1px solid var(--line2); display:flex; justify-content:flex-end; gap:9px; }
/* ---------- 提示条 ---------- */
/* 单独的入场动画：必须保留 translateX(-50%) 水平居中，否则动画期间会先偏右再跳回中间 */
@keyframes toast-up{ from{ transform:translateX(-50%) translateY(14px); opacity:0; }
  to{ transform:translateX(-50%) translateY(0); opacity:1; } }
.toast{ position:fixed; top:78px; left:50%; transform:translateX(-50%); z-index:300; background:#1f2733;
  color:#fff; padding:9px 18px; border-radius:20px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.2);
  animation:toast-up .2s ease; white-space:nowrap; max-width:90vw; }
.toast.ok{ background:#0e9f5f; } .toast.err{ background:#e0342b; } .toast.warn{ background:#f59e0b; }
/* ---------- 统计卡 ---------- */
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
.stat{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:13px 15px; box-shadow:var(--shadow); }
.stat .k{ font-size:12px; color:var(--txt2); display:flex; align-items:center; gap:6px; }
.stat .v{ font-size:23px; font-weight:700; margin-top:5px; letter-spacing:.5px; }
.stat .v small{ font-size:12px; font-weight:400; color:var(--txt3); margin-left:3px; }
.stat.b .v{ color:var(--primary); } .stat.g .v{ color:var(--green); }
.stat.o .v{ color:var(--orange); } .stat.r .v{ color:var(--red); } .stat.p .v{ color:var(--purple); }
/* ---------- 分类卡（参考截图） ---------- */
.cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(258px,1fr)); gap:14px; }
.cat{ border:1px solid var(--line); border-radius:8px; background:#fff; overflow:hidden; cursor:pointer;
  transition:.16s; box-shadow:var(--shadow); }
.cat:hover{ border-color:var(--primary); transform:translateY(-2px); box-shadow:0 8px 22px rgba(30,80,190,.12); }
.cat.on{ border-color:var(--primary); }
.cat-h{ background:#f6f9ff; padding:11px 14px; border-bottom:1px solid var(--line2); font-weight:600;
  display:flex; align-items:center; gap:7px; font-size:13.5px; }
.cat-b{ padding:12px 14px; }
.cat-b .desc{ color:var(--txt2); font-size:12px; min-height:36px; }
.cat-kv{ display:flex; justify-content:space-between; color:var(--txt2); font-size:12px; padding:3px 0; }
.cat-kv span:first-child{ color:var(--txt3); }
.cat-f{ display:flex; border-top:1px solid var(--line2); }
.cat-f div{ flex:1; text-align:center; padding:8px 0; color:var(--txt2); font-size:12px; cursor:pointer;
  border-right:1px solid var(--line2); }
.cat-f div:last-child{ border-right:none; }
.cat-f div:hover{ background:var(--primary-light); color:var(--primary); }
/* ---------- 其他 ---------- */
.grp{ display:flex; gap:14px; align-items:flex-start; }
.grp>.col{ flex:1; min-width:0; }
.box{ border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.box-h{ background:#f7f9fc; padding:8px 12px; font-size:12.5px; font-weight:600; color:var(--txt2);
  border-bottom:1px solid var(--line2); display:flex; justify-content:space-between; align-items:center; }
.box-c{ padding:11px 12px; font-size:12.5px; }
/* Sheet 标签页：多 sheet 工作簿查看页面切换 */
.sheet-tabs{ display:flex; gap:2px; padding:6px 10px 0; background:#f7f9fc;
  border-bottom:1px solid var(--line2); }
.sheet-tab{ padding:5px 14px; font-size:12.5px; color:var(--txt2); cursor:pointer;
  border:1px solid transparent; border-bottom:0; border-radius:5px 5px 0 0; }
.sheet-tab:hover{ color:var(--primary); }
.sheet-tab.on{ background:#fff; border-color:var(--line); color:var(--primary); font-weight:600; }
.pre{ background:#fbfcfe; border:1px solid var(--line2); border-radius:var(--radius); padding:11px;
  font-family:Consolas,"Courier New",monospace; font-size:12px; line-height:1.75; white-space:pre-wrap;
  word-break:break-all; max-height:340px; overflow:auto; color:#33405a; }
/* 原始文件预览：不自带滚动条，滚动统一交给弹窗 .m-bd */
.pre.flow{ max-height:none; overflow:visible; }
/* 异常标记 */
mark.abn{ background:#fff3cd; border-bottom:2px solid #ffc107; padding:1px 3px; border-radius:2px; cursor:help;
  font-style:normal; font-weight:600; font-size:11.5px; white-space:nowrap; }
mark.abn.dup{ background:#ffe5e5; border-bottom-color:#f44336; }
mark.abn.fmt{ background:#e3f2fd; border-bottom-color:#2196f3; }
/* 数据缺失：空缺占位 */
.miss-slot{ display:inline-block; min-width:82px; padding:0 6px; background:#fff8e1;
  border:1px dashed #ffc107; border-radius:3px; color:#a35c00; font-size:11.5px; cursor:help; }
/* 预检异常数量：纯文字，无背景色 */
.plain-abn{ color:var(--red); font-weight:600; font-size:12.5px; margin-right:4px; }
/* 数据格式异常：乱码高亮 */
.mess-hl{ background:#e3f2fd; border-bottom:2px solid #2196f3; padding:1px 3px; border-radius:2px;
  cursor:help; font-family:Consolas,"Courier New",monospace; color:#0d5aa7; }
/* 重复数据：成对高亮 */
.dup-hl{ background:#ffe5e5; border-bottom:2px solid #f44336; padding:1px 3px; border-radius:2px; cursor:help; }
.dup-hl.first{ background:#fff0f0; border-bottom-style:dashed; }
.dup-tag{ display:inline-block; margin-left:4px; padding:0 5px; background:#f5f6f8; border:1px solid var(--line);
  border-radius:9px; color:var(--txt3); font-size:10.5px; vertical-align:1px; }
tr.dup-row{ background:#fff6f6; }
.pre .add{ background:#dcfae7; } .pre .del{ background:#ffe1de; text-decoration:line-through; color:#b42318; }
.pre .mk{ background:#fff0c9; color:#a35c00; }
.bar{ height:7px; background:var(--line2); border-radius:4px; overflow:hidden; }
.bar>i{ display:block; height:100%; background:var(--primary); border-radius:4px; }
.bar>i.g{ background:var(--green); } .bar>i.o{ background:var(--orange); } .bar>i.r{ background:var(--red); }
.score{ font-weight:700; }
.score.h{ color:var(--green); } .score.m{ color:var(--orange); } .score.l{ color:var(--red); }
.doc{ background:#fff; border:1px solid var(--line); padding:26px 34px; font-size:13px; line-height:1.9; overflow:visible; }
.doc h1{ font-size:19px; text-align:center; margin-bottom:6px; }
.doc .meta{ text-align:center; color:var(--txt3); font-size:12px; margin-bottom:18px; }
.doc h2{ font-size:14.5px; margin:16px 0 8px; padding-left:8px; }
.doc table{ width:100%; border-collapse:collapse; font-size:12px; margin:8px 0; }
.doc table th,.doc table td{ border:1px solid #d6dce6; padding:6px 9px; text-align:left; }
.doc table th{ background:#f2f5fa; }
.doc ul{ padding-left:22px; } .doc ol{ padding-left:22px; }
.split{ display:flex; gap:0; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
.split>div{ flex:1; min-width:0; }
.split>div+div{ border-left:1px solid var(--line); }
.split-h{ background:#f7f9fc; padding:7px 11px; font-size:12px; font-weight:600; color:var(--txt2);
  border-bottom:1px solid var(--line2); }
.split-c{ padding:11px; max-height:400px; overflow:auto; font-size:12.5px; line-height:1.85; }
.side-panel{ width:230px; flex:0 0 230px; }
.tree-i{ padding:7px 10px; border-radius:var(--radius); cursor:pointer; color:var(--txt2);
  display:flex; justify-content:space-between; align-items:center; gap:6px; font-size:12.5px; }
.tree-i:hover{ background:var(--bg); }
.tree-i.on{ background:var(--primary-light); color:var(--primary-dark); font-weight:600; }
.tree-i .n{ font-size:11px; color:var(--txt3); }
.tree-i.on .n{ color:var(--primary); }
.ph{ padding:60px 20px; text-align:center; color:var(--txt3); }
.ph .ico{ font-size:46px; opacity:.3; }
.ph h3{ font-size:16px; color:var(--txt2); margin:12px 0 6px; }
.flex{ display:flex; align-items:center; gap:8px; }
.flex.wrap{ flex-wrap:wrap; } .flex.between{ justify-content:space-between; }
.mt8{ margin-top:8px; } .mt14{ margin-top:14px; } .mb8{ margin-bottom:8px; } .mb14{ margin-bottom:14px; }
.muted{ color:var(--txt3); } .small{ font-size:11.5px; }
.nowrap{ white-space:nowrap; }
.rule-card{ border:1px solid var(--line); border-radius:var(--radius); padding:11px 13px; margin-bottom:9px; }
.rule-card.on{ border-color:var(--primary); background:#fbfdff; }
.rule-card .rt{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.rule-card .rd{ color:var(--txt2); font-size:12px; margin-top:6px; padding-left:20px; }
.rule-card .thr{ margin-top:8px; padding-left:20px; display:flex; align-items:center; gap:6px; }
.cat-dropdown{ position:relative; }
.cat-sel-box{ border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#fff; }
.cat-sel-box:hover{ border-color:var(--primary); }
.cat-sel-text{ color:var(--txt); }
.cat-arrow{ color:var(--txt3); font-size:10px; }
.cat-options{ position:absolute; top:100%; left:0; right:0; margin-top:4px; background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 2px 8px rgba(0,0,0,0.08); max-height:320px; overflow-y:auto; z-index:100; }
.cat-all-row{ padding:8px 12px; border-bottom:1px solid var(--line); background:#fafbfc; }
.cat-grp-label{ padding:8px 12px; background:var(--bg); font-size:12px; font-weight:600; color:var(--txt2); }
.cat-opt{ display:block; padding:8px 12px; cursor:pointer; }
.cat-opt:hover{ background:#f5f7fa; }
.cat-opt input{ margin-right:6px; }
.cat-tree-item{ display:flex; align-items:center; gap:4px; }
.tree-toggle-simple{ display:inline-block; width:12px; font-size:10px; color:var(--txt3); cursor:pointer; user-select:none; }
.desens-example{ display:flex; gap:8px; margin-top:8px; padding-left:20px; font-size:12px; }
.desens-example>div{ flex:1; padding:6px 9px; border-radius:4px; background:var(--bg); }
.desens-example .lbl{ color:var(--txt3); font-size:11px; margin-bottom:3px; }
.desens-example .val{ color:var(--txt); font-family:Consolas,monospace; }
.desens-example .val.aft{ color:var(--primary); font-weight:600; }
.thr{ display:flex; align-items:center; gap:6px; margin-top:7px; padding-left:20px; }
.thr .inp{ width:76px; height:26px; }
.step{ display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.step .s{ display:flex; align-items:center; gap:7px; color:var(--txt3); font-size:12.5px; }
.step .s .no{ width:21px; height:21px; border-radius:50%; background:var(--line2); color:var(--txt2);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; }
.step .s.on{ color:var(--primary); font-weight:600; }
.step .s.on .no{ background:var(--primary); color:#fff; }

.step .ln{ width:34px; height:1px; background:var(--line); }
@media (max-width:1100px){ .main{ padding:14px; } }

/* ============ 规则配置树(Ant风格) ============ */
.sw{display:inline-block;vertical-align:middle;width:36px;height:20px;border-radius:10px;background:#cbd5e1;position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--primary)}
.sw.on::after{left:18px}
.sw.off-row{opacity:.45}

.cfg-rid{font-size:10.5px;background:var(--blue-bg,#eef5ff);color:var(--primary);border-radius:4px;padding:2px 6px;font-family:Consolas,monospace;flex:0 0 auto}

.cfg-caret{font-size:10px;color:var(--txt3);transition:transform .15s;width:12px;flex:0 0 auto}
.cfg-caret.open{transform:rotate(90deg)}

/* ============ 场景卡片选择器 ============ */
.cfg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:16px}
.cfg-scard{border:1px solid var(--line2);border-radius:10px;padding:16px 18px;cursor:pointer;transition:all .15s;background:#fff;position:relative;overflow:hidden}
.cfg-scard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--primary);opacity:0;transition:opacity .15s}
.cfg-scard:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(37,99,235,.1);transform:translateY(-1px)}
.cfg-scard.on::before{opacity:1}
.cfg-scard.off{opacity:.55;cursor:not-allowed;background:#fafbfc}
.cfg-scard.off:hover{border-color:var(--line2);box-shadow:none;transform:none}
.cfg-scard-ic{font-size:26px;margin-bottom:8px}
.cfg-scard-name{font-size:14.5px;font-weight:650;color:var(--txt);margin-bottom:4px}
.cfg-scard-desc{font-size:11.5px;color:var(--txt3);margin-bottom:10px}
.cfg-scard-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt2)}
</style>

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let _uid = 1000; const uid = p => (p||'id') + (++_uid);
const now = () => { const d = new Date(); const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };
const today = () => now().slice(0,10);
let _toastTimer = null;
function toast(msg, type){
  // 移除所有现有的toast
  document.querySelectorAll('.toast').forEach(el => el.remove());
  if (_toastTimer) clearTimeout(_toastTimer);

  const el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  document.body.appendChild(el);
  _toastTimer = setTimeout(()=>el.remove(), 2200);
}
function download(name, html){
  const blob = new Blob(['﻿<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body>'+html+'</body></html>'],
    {type:'application/msword'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); toast('已开始下载：'+name,'ok');
}
function downloadTxt(name, text, mime){
  const blob = new Blob([text], {type: mime||'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); toast('已开始下载：'+name,'ok');
}
const val = id => { const e = $(id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : ''; };
const pick = (arr,i) => arr[i % arr.length];

  xml:'📜',jpg:'🖼️',png:'🖼️'}[t] || '📄');
const ext = n => (n.split('.').pop()||'').toLowerCase();
const baseName = n => n.replace(/\.[^.]+$/, '');
/* 日期输入框：空值时以 text 显示中文占位提示，聚焦/有值时切为 date 以调出日历 */
function dateInp(id, v, ph){
  v = v || '';
  return '<input class="inp dinp" id="' + id + '" value="' + esc(v) + '"'
    + ' type="' + (v ? 'date' : 'text') + '" placeholder="' + esc(ph) + '"'
    + ' onfocus="this.type=\'date\'"'
    + ' onblur="if(!this.value){this.type=\'text\'}">';
}
/* 日期区间选择框（单框）：起止日期同处一个边框内，已选日期时右侧出现清除按钮。
   id 为前缀，实际生成 <id>1 / <id>2 两个 date 输入；onChange 为变更后回调名 */
function dateRangeBox(id, v1, v2, onChange){
  v1 = v1 || ''; v2 = v2 || '';
  const cb = onChange + '()';
  const one = (sfx, v) => '<input class="di" type="date" id="' + id + sfx + '" value="' + esc(v) + '"'
    + ' onchange="' + cb + '" onfocus="this.closest(\'.dbox\').classList.add(\'on\')"'
    + ' onblur="this.closest(\'.dbox\').classList.remove(\'on\')">';
  return '<div class="dbox">' + one('1', v1) + '<span class="dsep">—</span>' + one('2', v2)
    + ((v1 || v2)
      ? '<button class="dclr" type="button" title="清除日期" onclick="clearDateRange(\'' + id + '\',\'' + onChange + '\')">✕</button>'
      : '<span style="width:16px;flex:0 0 auto"></span>')
    + '</div>';
}
/* 清除日期区间并立即重新查询 */
function clearDateRange(id, onChange){
  const a = $(id + '1'), b = $(id + '2');
  if (a) a.value = ''; if (b) b.value = '';
  const fn = window[onChange];
  if (typeof fn === 'function') fn();
}
function kind(t){ if(['csv','xls','xlsx'].includes(t)) return 'table'; if(['json','jsonl'].includes(t)) return 'json';

function mkAbn(kd, n){
  const pool = ABN_POOL[kd] || []; const out = [];
  if (Array.isArray(n)){
    // 显式指定异常类型时，该类型下的每个检查项各计 1 条，与查看页面实际标记的位置数一致
    n.forEach(g => {
      pool.filter(x => x.g === g).forEach(a => out.push({ g:a.g, it:a.it, t:a.t, loc:a.loc, adv:a.adv, cnt: 1 }));
    });
    return out;
  }
  // 顺序取不重复的检查项，避免同一检查项被计数两次
  for (let i = 0; i < Math.min(n, pool.length); i++){ const a = pool[i];
    out.push({ g:a.g, it:a.it, t:a.t, loc:a.loc, adv:a.adv, cnt: 1 }); }
  return out;
}

/* ---- 末级数据分类（无子分类的分类）：数据源接入处只允许挂到末级分类 ---- */
/* 末级分类列表，按分类树的层级顺序返回，保证「第一个末级分类」稳定可预期 */
function leafCats(){
  const out = [];
  (function walk(pid){
    DB.localCats.filter(c => c.pid === pid).forEach(c => {
      const kids = DB.localCats.filter(x => x.pid === c.id);
      if (kids.length) walk(c.id); else out.push(c);
    });
  })(null);
  return out;
}
/* 末级分类下拉选项；sel 为当前选中值，为空时默认选中第一个末级分类 */
/* 选项文本带上父级路径，避免同名末级分类无法区分 */
function leafCatOptions(sel){
  const leaves = leafCats();
  const def = leaves.length ? leaves[0].id : '';
  const cur = sel || def;
  return leaves.map(c => {
    const path = [];
    let p = c.pid;
    while (p){ const parent = DB.localCats.find(x => x.id === p); if (!parent) break; path.unshift(parent.n); p = parent.pid; }
    const label = path.length ? path.join(' / ') + ' / ' + c.n : c.n;
    return '<option value="' + c.id + '"' + (c.id === cur ? ' selected' : '') + '>' + esc(label) + '</option>';
  }).join('');
}

  });

      + '<div class="flow-cap"><span class="no">' + String(s.no).padStart(2, '0') + '</span>'

      + '<div class="flow-bd"><span class="ic">' + s.ic + '</span>' + esc(s.d) + '</div>'

/* ============ 通用分页 ============ */
function paginate(arr, st){
  const total = arr.length, size = st.size;
  const pages = Math.max(1, Math.ceil(total / size));
  if (st.page > pages) st.page = pages;
  return { rows: arr.slice((st.page - 1) * size, st.page * size), total, pages };
}
/* pager(p, fn, sizeFn, size)：传入 sizeFn 时显示每页条数选择器 */
function pager(p, fn, sizeFn, size){
  const btns = []; const cur = p.cur;
  for (let i = 1; i <= p.pages; i++){
    if (p.pages > 8 && i !== 1 && i !== p.pages && Math.abs(i - cur) > 2){
      if (btns[btns.length-1] !== '…') btns.push('…'); continue; }
    btns.push(i);
  }
  const sizeSel = sizeFn ? '　每页 <select class="sel psize" onchange="' + sizeFn + '(this.value)">'
      + [10, 20].map(n => '<option value="' + n + '"' + (n === size ? ' selected' : '') + '>' + n + '</option>').join('')
      + '</select> 条' : '';
  return '<div class="pager"><div>共 <b>' + p.total + '</b> 条，第 ' + cur + ' / ' + p.pages + ' 页' + sizeSel + '</div>'
    + '<div class="pgs">'
    + '<div class="pg" onclick="' + fn + '(' + Math.max(1, cur - 1) + ')">‹</div>'
    + btns.map(b => b === '…' ? '<div class="pg" style="border:none;background:none">…</div>'
      : '<div class="pg' + (b === cur ? ' on' : '') + '" onclick="' + fn + '(' + b + ')">' + b + '</div>').join('')
    + '<div class="pg" onclick="' + fn + '(' + Math.min(p.pages, cur + 1) + ')">›</div>'
    + '</div></div>';
}

/* 取分类自身及其所有下级分类 id（非末级分类展示全部下级数据） */
function catScope(id){
  const out = [id];
  const walk = pid => DB.localCats.filter(c => c.pid === pid).forEach(c => { out.push(c.id); walk(c.id); });
  walk(id);
  return out;
}
function localFiles(){
  const st = S.local;
  const scope = st.cat === 'all' ? null : catScope(st.cat);
  return DB.files.filter(f => {
    if (scope && !scope.includes(f.cat)) return false;
    if (st.kw && f.name.toLowerCase().indexOf(st.kw.toLowerCase()) < 0) return false;
    if (st.ty && f.type.toLowerCase() !== st.ty) return false;
    // 上传时间形如 2026-07-08 09:20:00，按日期部分与区间比较
    const d = String(f.time || '').slice(0, 10);
    if (st.d1 && d && d < st.d1) return false;
    if (st.d2 && d && d > st.d2) return false;
    return true;
  }).sort((a, b) => String(b.time).localeCompare(String(a.time))); // 按上传时间降序
}

function localTypeOpts(){
  const st = S.local;
  const scope = st.cat === 'all' ? null : catScope(st.cat);
  const set = DB.files.filter(f => {
    if (scope && !scope.includes(f.cat)) return false;
    if (st.kw && f.name.toLowerCase().indexOf(st.kw.toLowerCase()) < 0) return false;
    const d = String(f.time || '').slice(0, 10);
    if (st.d1 && d && d < st.d1) return false;
    if (st.d2 && d && d > st.d2) return false;
    return true;
  }).map(f => f.type.toLowerCase());

function renderCatTree(){
  const st = S.local;
  const renderNode = (cat, isRoot) => {
    const children = getCatChildren(cat.id);
    const hasChildren = children.length > 0;
    const expanded = st.expandedCats.includes(cat.id);
    const icon = cat.level === 1 ? '📁' : (cat.level === 2 ? '🗂️' : '📂');
    const indent = (cat.level - 1) * 20;

    let html = '<div class="tree-i' + (st.cat === cat.id ? ' on' : '') + '" style="padding-left:' + (12 + indent) + 'px">'
      + '<div class="flex" style="align-items:center;gap:4px;flex:1;min-width:0" onclick="localOpen(\'' + cat.id + '\')">';

    if (hasChildren) {
      html += '<span class="tree-toggle" onclick="event.stopPropagation();toggleCat(\'' + cat.id + '\')">' + (expanded ? '▼' : '▶') + '</span>';
    } else {
      html += '<span style="width:14px;flex:0 0 14px"></span>';
    }

    html += '<span class="ell">' + icon + ' ' + esc(cat.n) + '</span></div>'
      + '<span class="n">' + localCatCount(cat.id) + '</span></div>';

    if (hasChildren && expanded) {
      children.forEach(child => {
        html += renderNode(child, false);
      });
    }

    return html;
  };

  const roots = DB.localCats.filter(c => c.pid === null);
  return roots.map(r => renderNode(r, true)).join('');
}

function onPickFiles(el){
  UPQ = Array.from(el.files || []).map(f => {
    const sizeMB = (f.size / 1048576).toFixed(2);
    // 校验文件损坏/为空（原型中模拟：名称含 corrupt/broken 视为损坏，size=0 视为空）
    const isEmpty = f.size === 0;
    const isCorrupt = /corrupt|broken|损坏/i.test(f.name);
    return { name: f.name, size: sizeMB + ' MB', rawSize: f.size, isEmpty, isCorrupt };
  });
  if (!UPQ.length) UPQ = [];
  renderUpList();
}
function renderUpList(){
  const box = $('upList'); if (!box) return;
  if (!UPQ.length){ box.innerHTML = '<div class="tip">提示：尚未选择文件。可点击上方按钮选择本地文件，也可直接使用示例文件演示上传。'
    + '<span class="lnk" style="color:var(--primary);cursor:pointer" onclick="demoFiles()">载入示例文件</span></div>'; return; }
  box.innerHTML = '<div class="box"><div class="box-h"><span>待上传文件（' + UPQ.length + '）</span>'
    + '<span class="lnk" style="color:var(--primary);cursor:pointer" onclick="UPQ=[];renderUpList()">清空</span></div>'
    + '<div class="box-c" style="padding:0"><table class="tb"><thead><tr><th>文件名</th><th>类型</th><th>大小</th><th>校验</th></tr></thead><tbody>'
    + UPQ.map(f => {
        const t = ext(f.name);
        const fmtOk = LOCAL_TYPES.map(x => x.toLowerCase()).includes(t);
        let tag = '';
        if (f.isEmpty) tag = '<span class="tag err">✗ 文件为空</span>';
        else if (f.isCorrupt) tag = '<span class="tag err">✗ 文件损坏</span>';
        else if (!fmtOk) tag = '<span class="tag err">✗ 格式不支持</span>';
        else tag = '<span class="tag ok">✓ 格式支持</span>';
        return '<tr><td>' + fileIcon(t) + ' ' + esc(f.name) + '</td><td>' + t.toUpperCase() + '</td><td>' + f.size + '</td>'
          + '<td>' + tag + '</td></tr>';
      }).join('')
    + '</tbody></table></div></div>';
}

function doUpload(){
  if (!UPQ.length) return toast('请先选择本地文件','err');
  // 过滤掉空文件、损坏文件、格式不支持的文件
  const valid = UPQ.filter(f => {
    const t = ext(f.name);
    const fmtOk = LOCAL_TYPES.map(x => x.toLowerCase()).includes(t);
    return !f.isEmpty && !f.isCorrupt && fmtOk;
  });
  const bad = UPQ.length - valid.length;
  if (bad === UPQ.length) return toast('所有文件校验失败，无文件可上传','err');

  // auto 须在 closeModal 前读取：弹窗关闭后控件已销毁
  const cat = UP_CAT, auto = !!val('upAuto');
  valid.forEach((f, i) => {
    const t = ext(f.name), kd = kind(t);
    const hasAbn = auto && (i % 2 === 0);
    DB.files.unshift({ id: uid('f'), name:f.name, type:t, kd, cat, size:f.size,
      rows: kd === 'table' ? 88 + i * 41 : (kd === 'json' ? 40 + i * 9 : 0),
      up:'done', pre: auto ? (hasAbn ? 'abn' : 'pass') : 'wait',
      abns: hasAbn ? mkAbn(kd, 2) : [], time: now(), user:'系统管理员', fixed:false,
      toDb: kd === 'table', cleaned:false, slices: kd === 'text' ? 6 + i : 0 });
  });
  UPQ = [];
  S.local.cat = cat; S.local.page = 1;
  closeModal();

  // 统一提示信息：启用自动预检时附带预检结论
  const abnN = auto ? valid.filter((f, i) => i % 2 === 0).length : 0;
  const msg = valid.length + ' 个文件上传成功'
    + (bad > 0 ? '；已自动过滤 ' + bad + ' 个无效文件（为空/损坏/格式不支持）' : '')
    + (auto ? '；已自动完成预检，' + (abnN ? abnN + ' 个文件存在异常' : '未发现异常') : '');
  toast(msg, 'ok');
}

/* ---- 跨文件重复 ----

function dupFileName(f){
  if (f.dupWith) return f.dupWith;
  const same = DB.files.find(x => x.id !== f.id && x.cat === f.cat && x.type === f.type)
    || DB.files.find(x => x.id !== f.id && x.kd === f.kd);
  return same ? same.name : '同分类下的其他文件';
}

function switchSheet(n, rows1, rows2){

function tableRows(f){
  // 跨文件重复为文件级异常，不在行内标记（悬浮「重复数据」徽标查看）
  const cntOf = g => (f.abns || []).filter(a => a.g === g && a.t !== '跨文件重复')
    .reduce((s, a) => s + a.cnt, 0);
  const missN = cntOf('miss'), fmtN = cntOf('fmt'), dupN = cntOf('dup');
  const items = ['滑油金属屑','排气温度','振动值','点火功能','燃油密封','转速N1','转速N2','滑油压力',
    '起动时间','喘振裕度','推力偏差','燃油流量'];
  const engT = ['WS-XXA','WS-XXA','WS-XXB','WS-XXB','WZ-XXC'];
  const meas = ['8ppm','612℃','2.1mm/s','3/3','0.01MPa','98.2%','101.5%','0.42MPa','24s','16%','1.2%','1860kg/h'];
  const std  = ['≤15ppm','≤620℃','≤2.5mm/s','3/3','≤0.02MPa','≤100%','≤103%','≥0.35MPa','≤30s','≥12%','≤2%','≤1900kg/h'];
  const base = Math.max(6, missN + fmtN + 2);
  const rows = [];
  for (let i = 0; i < base; i++){
    rows.push({ c:[String(i+1), 'E' + (30137 + i * 137), engT[i % engT.length], items[i % items.length],
      meas[i % meas.length], std[i % std.length], '合格', i % 4 === 0 ? '' : '按手册复查'], ab:null });
  }
  // 数据缺失：逐行将「发动机编号」置空（每处计 1）
  let ri = 1;
  for (let k = 0; k < missN; k++, ri += 2){
    const r = rows[ri % base]; r.c[1] = ''; r.ab = 'miss'; r.missCol = 1;
  }
  // 数据格式异常：实测值含特殊字符（每处计 1）
  let fi = 2;
  for (let k = 0; k < fmtN; k++, fi += 2){
    const r = rows[fi % base];
    if (r.ab) { fi += 1; }
    const t = rows[fi % base];
    t.c[4] = t.c[4] + '★'; t.ab = 'fmt'; t.fmtCol = 4;
  }
  // 重复数据（文件内完全重复记录）：成对追加，仅重复行计 1
  for (let k = 0; k < dupN; k++){
    const src = rows[k % base];
    const cells = src.c.slice(); cells[1] = 'E' + (40255 + k * 91); cells[0] = String(base + k + 1);
    rows.push({ c:cells.slice(), ab:'dupFirst' });
    rows.push({ c:cells.slice(), ab:'dup' });
  }
  return rows;
}

/* 文档正文中按预检结果插入统一异常标记（占位符 §MISS§ / §FMT§ / §DUP§ 由 docBody 埋入） */
function markAbn(html, f){
  if (f.kd === 'image') return html; // 仅图片不标记
  const has = g => (f.abns || []).some(a => a.g === g);

  /* §MISS:原值§ —— 命中数据缺失时该处内容置空并标识；未命中则还原原值
     §DUP1:文本§ / §DUP2:文本§ —— 重复数据的首次与重复出现，成对高亮
     §FMT§ —— 数据格式异常标识 */
  html = html.replace(/§MISS:([^§]*)§/g, (m, orig) => has('miss') ? missMark() : orig)
             .replace(/§MESS:([^§]*)§/g, (m, orig) => has('fmt') ? messMark() : orig)
             .replace(/§DUP1:([^§]*)§/g, (m, txt) => has('dup') ? dupPair(txt) : txt)
             .replace(/§DUP2:([^§]*)§/g, (m, txt) => has('dup') ? dupRepeat(txt) : txt)
             .replace(/§FMT§/g, has('fmt') ? abnMark('fmt') : '');
  // 未命中重复数据时，移除成对出现的第二行（避免出现无标识的重复内容）
  if (!has('dup')) html = html.replace(/<tr class="dup-row">[\s\S]*?<\/tr>/g, '');
  // 文档类的重复数据为跨文件重复：不在正文追加提示条，改为悬浮「重复数据」徽标查看（见 abnSummary）
  return html;
}

/* 原始文件预览：按文件格式还原上传时的原始样貌，不含预检异常标记。

    + (sub ? '<span class="small muted">' + sub + '</span>' : '') + '</div>'
    + '<div class="box-c"' + (flush ? ' style="padding:0"' : '') + '>' + inner + '</div></div>';

  if (f.kd === 'image'){
    return box('2048 × 1536 · ' + f.size,
      '<div style="background:linear-gradient(135deg,#e8eef8,#cfd9ea);height:360px;border-radius:6px;'

      + '<div style="font-size:56px">🖼️</div><div class="mt8">' + esc(f.name) + '</div></div>');
  }
  if (f.kd === 'table'){
    // 原始表格：只渲染数据本身，不加异常列与高亮
    const rows = tableRows(f);
    const tb = (cols, body) => '<div class="tbwrap"><table class="tb">'
      + '<thead style="position:sticky;top:0;background:#fff;z-index:1"><tr>'
      + cols.map(c => '<th class="nowrap">' + c + '</th>').join('')
      + '</tr></thead><tbody>' + body + '</tbody></table></div>';
    const row = cs => '<tr>' + cs.map(c => '<td>'
      + (c === '' ? '<span class="muted">—</span>' : esc(c)) + '</td>').join('') + '</tr>';
    const s1 = tb(TBL_COLS, rows.map(r => row(r.c)).join(''));
    // 多 sheet 工作簿：以标签页切换查看各 sheet 数据（标签固定在滚动区之外）
    const s2 = SHEET2[f.name];
    if (s2){
      const tab = (n, id, label) => '<span class="sheet-tab' + (n === 1 ? ' on' : '') + '" id="' + id + '"'
        + ' onclick="switchSheet(' + n + ',\'' + esc(f.rows) + '\',' + s2.rows.length + ')">' + label + '</span>';
      return '<div class="box"><div class="box-h"><span>原始文件预览</span>'
        + '<span class="small muted" id="shMeta">Sheet1 · 共 ' + f.rows + ' 条记录</span></div>'
        + '<div class="sheet-tabs">' + tab(1, 'shT1', 'Sheet1') + tab(2, 'shT2', esc(s2.name)) + '</div>'
        + '<div class="box-c" style="padding:0">'
        + '<div id="shP1">' + s1 + '</div>'
        + '<div id="shP2" style="display:none">' + tb(s2.cols, s2.rows.map(row).join('')) + '</div>'
        + '</div></div>';
    }
    return box('Sheet1 · 共 ' + f.rows + ' 条记录', s1, true);
  }
  if (f.type === 'pdf'){
    // 原始文件预览：展示带版面元素（页眉/分隔线/页码）的原始内容
    return box('PDF 文档', '<div class="pre flow">' + esc(rawPdfBody(f)) + '</div>');
  }
  if (f.kd === 'json'){
    return box(f.type.toUpperCase() + ' 文档', '<div class="pre flow">'
      + esc('{"instruction":"发动机排气温度超限如何处置","input":"某型发动机飞行后检查发现排气温度超出限制35℃","output":"经孔探确认热端部件积碳，清洗热端部件后复查参数恢复正常。"}\n'
        + '{"instruction":"滑油压力偏低报警的常见原因","input":"","output":"滑油泵磨损导致输出压力下降。"}\n'
        + '{"instruction":"点火系统检查方法","input":"三次点火试验","output":"连续三次点火成功即判定合格。"}\n'
        + '{"instruction":"燃油系统密封性检查","input":"","output":"保压 5 分钟压降不大于 0.02MPa。"}')
      + '</div>');
  }
  if (f.type === 'doc' || f.type === 'docx'){
    // 文档原貌：去掉正文里为预检埋入的占位符，还原原始内容
    const body = docBody(f)
      .replace(/§MISS:([^§]*)§/g, '$1').replace(/§MESS:([^§]*)§/g, '$1')
      .replace(/§DUP1:([^§]*)§/g, '$1').replace(/§DUP2:([^§]*)§/g, '$1')
      .replace(/§FMT§/g, '').replace(/<tr class="dup-row">[\s\S]*?<\/tr>/g, '');

    return box(f.type.toUpperCase() + ' 文档',
      '<div class="doc" style="border:0">' + body + '</div>', true);
  }
  // XML 用结构化正文，其余文档类沿用 PDF 提取文本
  return box(f.type.toUpperCase() + ' 文档',
    '<div class="pre flow">' + esc(f.type === 'xml' ? xmlBody(f) : pdfBody(f)) + '</div>');
}

/* ---- 预检执行 ---- */
function activeRule(kd){ return (DB.ruleCfg[kd] || []).find(r => r.on); }
/* 预检：只取当前启用规则已勾选的检查项，命中项按 ABN_POOL 中该格式支持的检查项生成异常。
   同一文件重复预检结果稳定（按文件名散列决定命中哪些检查项）。 */
function runPre(f){
  const r = activeRule(f.kd);
  const pool = ABN_POOL[f.kd] || [];
  // 启用规则未勾选的检查项不参与预检；无规则时按该格式全部检查项预检
  const enabled = r ? pool.filter(a => r.items.includes(a.it)) : pool.slice();
  // 按文件名散列稳定地决定命中数量（0 表示预检通过）
  let hash = 0;
  for (let i = 0; i < f.name.length; i++) hash = (hash * 31 + f.name.charCodeAt(i)) % 997;
  const hitN = enabled.length ? hash % (enabled.length + 1) : 0;
  if (!hitN){ f.pre = 'pass'; f.abns = []; }
  else {
    f.abns = enabled.slice(0, hitN).map(a => ({ g:a.g, it:a.it, t:a.t, loc:a.loc, adv:a.adv, cnt:1 }));
    f.pre = 'abn';
  }
  f.preTime = now(); f.preRule = r ? r.n : '默认规则';
}
/* 单文件预检：状态先置「预检中」，预检结束后直接在列表更新为预检通过 / 预检异常，不弹提示语 */
function preOne(id){
  const f = DB.files.find(x => x.id === id); if (!f) return;
  f.pre = 'running'; render();
  setTimeout(() => { runPre(f); render(); }, 700);
}
/* 批量预检：与单文件一致，逐个置「预检中」，完成后在列表更新最终状态，不弹提示语与结果窗口。
   入口已迁移至数据转换·数据预处理（见 preBatchPre） */
function runPreBatch(files){
  files = (files || []).filter(Boolean);
  if (!files.length) return toast('当前无可预检的文件','err');
  // 支持重新预检：不过滤已预检文件，允许对所有文件执行预检
  toast('预检任务已发起', 'ok');
  files.forEach(f => { f.pre = 'running'; });
  render();
  files.forEach((f, i) => setTimeout(() => { runPre(f); render(); }, 400 + i * 220));
}

/* HTML 实体还原，供编辑框取纯文本 */
function unesc(s){
  return String(s).replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
}
/* 取文件的可编辑纯文本：保留异常现状（空值留空、乱码保留、重复两份都在），便于人工修正 */
function fileText(f){
  if (f.editedText != null) return f.editedText;
  const has = g => (f.abns || []).some(a => a.g === g);
  const hasItem = t => (f.abns || []).some(a => a.t === t);
  if (f.kd === 'table'){
    // 表头缺失、完全重复记录、特殊字符、空值：与查看页面保持一致
    const head = '序号,发动机编号,发动机型号,检查项目,实测值,标准值,结论,备注';
    const rows = [
      '1,E30137,WS-XXA,滑油金属屑,8ppm,≤15ppm,合格,',
      '2,E30274,WS-XXA,排气温度,' + (has('fmt') ? '635℃★※' : '635℃') + ',≤620℃,不合格,需地面检查',
      '3,E30411,WS-XXB,振动值,2.1mm/s,≤2.5mm/s,合格,',
      '4,' + (hasItem('关键字段存在空值') ? '' : 'E30552') + ',WS-XXB,点火功能,3/3,3/3,合格,',
      '5,E30685,WZ-XXC,燃油密封,0.01MPa,≤0.02MPa,合格,'
    ];
    if (hasItem('存在完全重复记录')) rows.push('5,E30685,WZ-XXC,燃油密封,0.01MPa,≤0.02MPa,合格,');
    return head + '\n' + rows.join('\n');
  }
  if (f.kd === 'json'){
    // 语法错误、乱码、空对象、空数组：与查看页面保持一致（跨文件重复不体现在单文件文本中）
    const out = ['{"instruction":"发动机排气温度超限如何处置","input":"某型发动机飞行后检查发现排气温度超出限制35℃","output":"经孔探确认热端部件积碳，清洗热端部件后复查参数恢复正常。"}',
      '{"instruction":"滑油压力偏低报警的常见原因","input":"","output":"滑油泵磨损导致输出压力下降。"}'];
    if (hasItem('JSON 语法错误')) out.push('{"instruction":"点火系统检查方法","input":"三次点火试验""output":"连续三次点火成功即判定合格。"}');
    if (hasItem('文本存在乱码')) out.push('{"instruction":"燃油系统密封性检查","input":"","output":"保压 5 分钟锟斤拷压降ï¿½å¤§äº 0.02MPa"}');
    if (hasItem('存在空对象')) out.push('{}');
    if (hasItem('存在空数组')) out.push('{"messages":[]}');
    out.push('{"instruction":"发动机定检周期是多少","input":"","output":"发动机定检周期为 300 飞行小时。"}');
    return out.join('\n');
  }
  if (f.type === 'doc' || f.type === 'docx'){
    // docBody 为 HTML，先按原样解析占位符再转纯文本
    let h = docBody(f)
      .replace(/§MISS:([^§]*)§/g, has('miss') ? '' : '$1')
      .replace(/§MESS:([^§]*)§/g, has('fmt') ? '锟斤拷锟斤拷ï¿½å¯¼å‡ºæ ¼å¼' : '$1')
      .replace(/§DUP1:([^§]*)§/g, '$1')
      .replace(/§DUP2:([^§]*)§/g, has('dup') ? '$1' : '')
      .replace(/§FMT§/g, '');
    h = h.replace(/<\/(h1|h2|h3|p|li|tr)>/g, '\n').replace(/<\/td>/g, '\t').replace(/<[^>]+>/g, '');
    return unesc(h).split('\n').map(l => l.replace(/\t+$/,'').trim()).filter(l => l !== '').join('\n');
  }
  if (f.type === 'xml'){
    // XML：结构化正文，异常按节点内容注入
    let x = xmlBody(f);
    if (has('miss')) x = x.replace('<cycle unit="飞行小时" value="300" tolerance="±15"/>',
      '<cycle unit="飞行小时" value="" tolerance="±15"/>');
    if (has('fmt')) x = x.replace('检查压气机一至三级叶片、涡轮一级导向器有无裂纹、掉块',
      '锟斤拷锟斤拷ï¿½å¯¼å‘导向器有无裂纹、掉块');
    // XML 的重复数据检查项为「跨文件重复」，正文内不注入重复节点
    return x;
  }
  // pdf 等：提取后的文本
  let t = EXT_PDF;
  if (has('miss')) t = t.replace('维护周期为 300 飞行小时，允许偏差 ±15 飞行小时。', '维护周期为 ，允许偏差 ±15 飞行小时。');
  if (has('fmt')) t = t.replace('滑油金属屑含量超过 15ppm', '锟斤拷锟斤拷ï¿½ 15ppm');
  if (has('dup')){
    const line = '2. 孔探检查：检查压气机一至三级叶片、涡轮一级导向器有无裂纹、掉块；';
    t = t.replace(line, line + '\n' + line);
  }
  return t;
}
/* 人工编辑内容区：异常文本用红色字体高亮（仅字体色，不加底色） */
function editHtmlWithAbn(text, f){
  let h = esc(text);
  const has = g => (f.abns || []).some(a => a.g === g);
  const red = s => '<span class="ed-abn">' + s + '</span>';
  // 数据格式异常：乱码片段标红
  if (has('fmt')){
    h = h.replace(/[锟斤拷ï¿½]+[^\s，。；]*/g, m => red(m));
    // 特殊字符（★ ↓）标红
    h = h.replace(/[★↓]+/g, m => red(m));
  }
  // 数据格式异常（JSON）：语法错误——相邻字符串之间缺少逗号分隔符
  if (has('fmt') && f.kd === 'json'){
    h = h.replace(/(&quot;)(&quot;output&quot;)/g, (m, a, b) => a + red(b));
  }
  // 数据缺失：空缺占位标红
  if (has('miss')){
    h = h.replace(/（(此处内容为空|空|空值)）/g, m => red(m));
    // XML：属性值为空（value=""）
    h = h.replace(/value=&quot;&quot;/g, m => red(m));
    // JSON：空对象 {} / 空数组 []
    if (f.kd === 'json'){
      h = h.split('\n').map(l => (l.trim() === '{}' ? red(l) : l)).join('\n');
      h = h.replace(/(&quot;messages&quot;:)(\[\])/g, (m, a, b) => a + red(b));
    }
  }
  // 重复数据：连续两行完全相同时，第二行标红
  if (has('dup')){
    const lines = h.split('\n');
    for (let i = 1; i < lines.length; i++){
      if (lines[i].trim() && lines[i] === lines[i-1]) lines[i] = red(lines[i]);
    }
    h = lines.join('\n');
  }
  return h;
}

/* 人工编辑：删除单条重复记录（行内删除按钮） */
function delOneRow(ri){
  const rows = window.__tblRows || [];
  const target = rows[ri];
  if (!target) return;
  // 回写当前单元格编辑内容，避免删除后丢失已改动的值
  document.querySelectorAll('.tbl-cell').forEach(inp => {
    const r = Number(inp.getAttribute('data-r')), c = Number(inp.getAttribute('data-c'));
    if (rows[r]) rows[r].c[c] = inp.value.trim();
  });
  const note = (val('edNote') || '').trim();
  const kept = rows.filter((r, i) => i !== ri);
  // 该重复行删除后，若其配对的首条已无重复，则清除「原始」标记
  const stillDup = kept.some(r => r.ab === 'dup');
  if (!stillDup) kept.forEach(r => { if (r.ab === 'dupFirst') r.ab = null; });
  kept.forEach((r, i) => { r.c[0] = String(i + 1); });  // 序号重排
  const prevN = (window.__tblEdited && window.__tblEdited.delN) || 0;
  window.__tblEdited = { rows: kept, note, delN: prevN + 1 };
  const fid = window.__tblEditFile;
  closeModal();
  toast('已删除该条重复记录','ok');
  if (fid) mEditTable(fid);
}

function saveEditTable(id){
  const f = DB.files.find(x => x.id === id); if (!f) return;
  const rows = window.__tblRows || [];
  document.querySelectorAll('.tbl-cell').forEach(inp => {
    const r = Number(inp.getAttribute('data-r')), c = Number(inp.getAttribute('data-c'));
    if (rows[r]) rows[r].c[c] = inp.value.trim();
  });
  // 仍为空的单元格视为未修正，据此重算异常
  const stillMiss = rows.filter(r => r.ab === 'miss' && !r.c[1]).length;
  const stillFmt = rows.filter(r => r.ab === 'fmt' && /[★↓]/.test(r.c[4] || '')).length;
  const dupPairs = rows.filter(r => r.ab === 'dup').length;
  const left = stillMiss + stillFmt + dupPairs;

  f.editNote = (val('edNote') || '').trim();
  f.fixed = true; f.fixTime = now();
  window.__tblEdited = null;  // 清掉暂存，避免二次编辑时旧行复现
  if (left === 0){ f.pre = 'pass'; f.abns = []; }
  else {
    const keep = [];
    const src = g => (ABN_POOL[f.kd] || []).find(a => a.g === g) || { t:ABN_LABEL[g], loc:'', adv:'' };
    if (stillMiss) keep.push(Object.assign({}, src('miss'), { g:'miss', cnt: stillMiss }));
    if (stillFmt) keep.push(Object.assign({}, src('fmt'), { g:'fmt', cnt: stillFmt }));
    if (dupPairs) keep.push(Object.assign({}, src('dup'), { g:'dup', cnt: dupPairs }));
    f.abns = keep; f.pre = 'abn';
  }
  closeModal(); render(); mViewFile(id);
}

  const s = el.selectionStart, e = el.selectionEnd;

  const n = e - s;
  el.value = el.value.slice(0, s) + el.value.slice(e);
  if (el.setSelectionRange) { el.focus(); el.setSelectionRange(s, s); }
  toast('已删除选中内容（' + n + ' 个字符）','ok');
}
function edDelBlank(){
  const el = $('edTxt'); if (!el) return;

/* ---- 预检报告（word） ---- */
function reportHtml(files, title, srcName){
  const abnFiles = files.filter(f => f.abns && f.abns.length);
  const cntBy = {}; abnFiles.forEach(f => f.abns.forEach(a => cntBy[a.g] = (cntBy[a.g] || 0) + a.cnt));
  const total = Object.values(cntBy).reduce((a,b)=>a+b,0);
  let h = '<div class="doc"><h1>数据预检报告</h1>'
    + '<div class="meta">报告名称：数据预检报告　|　生成时间：' + now() + '　|　生成人：系统管理员</div>'
    + '<h2>一、报告概述</h2><table><tbody>'
    + '<tr><th style="width:130px">报告名称</th><td>数据预检报告</td><th style="width:130px">生成时间</th><td>' + now() + '</td></tr>'
    + '<tr><th>数据来源</th><td>' + esc(srcName || '本地数据') + '</td><th>预检规则</th><td>' + esc(files[0] && files[0].preRule || '系统默认启用规则') + '</td></tr>'
    + '<tr><th>预检文件数</th><td>' + files.length + '</td><th>异常文件数</th><td>' + abnFiles.length + '</td></tr>'
    + '<tr><th>异常条目数</th><td>' + total + '</td><th>预检结论</th><td>' + (abnFiles.length ? '存在异常，需人工编辑' : '全部通过') + '</td></tr>'
    + '</tbody></table>'
    + '<h2>二、异常类型统计</h2><table><thead><tr><th>序号</th><th>异常类型</th><th>异常条目数</th><th>涉及文件数</th><th>占比</th></tr></thead><tbody>'
    + Object.keys(ABN_LABEL).filter(g => cntBy[g]).map((g, i) => '<tr><td>' + (i+1) + '</td><td>' + ABN_LABEL[g] + '</td>'
      + '<td>' + cntBy[g] + '</td><td>' + abnFiles.filter(f => f.abns.some(a => a.g === g)).length + '</td>'
      + '<td>' + (total ? (cntBy[g] * 100 / total).toFixed(1) : 0) + '%</td></tr>').join('')
    + (total ? '' : '<tr><td colspan="5">未发现异常</td></tr>')
    + '</tbody></table>'
    + '<h2>三、异常文件清单</h2><table><thead><tr><th>序号</th><th>文件名称</th><th>文件类型</th><th>数据分类</th><th>异常类型</th><th>异常条目</th></tr></thead><tbody>'
    + (abnFiles.length ? abnFiles.map((f, i) => '<tr><td>' + (i+1) + '</td><td>' + esc(f.name) + '</td><td>' + f.type.toUpperCase() + '</td>'
      + '<td>' + esc(catName(f.cat)) + '</td><td>' + [...new Set(f.abns.map(a => ABN_LABEL[a.g]))].join('、') + '</td>'
      + '<td>' + f.abns.reduce((a,b)=>a+b.cnt,0) + '</td></tr>').join('')
      : '<tr><td colspan="6">无异常文件</td></tr>')
    + '</tbody></table>'
    + '<h2>四、异常位置与处理建议</h2><table><thead><tr><th>序号</th><th>文件名称</th><th>异常类型</th><th>异常检查项</th>'
      + '<th>异常位置</th><th>处理建议</th></tr></thead><tbody>';
  let n = 0;
  abnFiles.forEach(f => f.abns.forEach(a => { n++;
    // 跨文件重复：异常位置写明与哪个文件重复
    const loc = a.t === '跨文件重复' ? '与「' + dupFileName(f) + '」内容完全重复' : a.loc;
    h += '<tr><td>' + n + '</td><td>' + esc(f.name) + '</td><td>' + ABN_LABEL[a.g] + '</td><td>' + esc(a.t) + '</td>'
      + '<td>' + esc(loc) + '</td><td>' + esc(a.adv) + '</td></tr>'; }));
  if (!n) h += '<tr><td colspan=”6”>无异常项</td></tr>';
  h += '</tbody></table><h2>五、处理结论与建议</h2>';
  // 根据异常类型生成差异化建议
  const hasMissing = cntBy['miss'] > 0;
  const hasDup = cntBy['dup'] > 0;
  const hasFmt = cntBy['fmt'] > 0;
  if (total === 0) {
    h += '<p><b>预检结论：</b>全部通过。本次预检 ' + files.length + ' 个数据对象，未发现异常项，可直接进入数据清洗流程。</p>';
  } else {
    h += '<p><b>预检结论：</b>存在异常。本次共预检 ' + files.length + ' 个数据对象，发现异常文件 ' + abnFiles.length + ' 个、异常条目 ' + total + ' 条，需按以下建议处理后方可进入后续流程。</p><ol>';
    if (hasFmt) h += '<li><b>数据格式异常：</b>发现 ' + cntBy['fmt'] + ' 处数据格式异常，建议检查数据格式规范，修正后重新上传；或在数据清洗环节配置格式转换规则统一处理。</li>';
    if (hasMissing) h += '<li><b>数据缺失：</b>发现 ' + cntBy['miss'] + ' 处数据缺失异常，建议核对源数据完整性，补充缺失内容后重新上传；若确认无法补充，可在人工编辑中标注为”数据源缺失，已确认”。</li>';
    if (hasDup) h += '<li><b>重复数据：</b>发现 ' + cntBy['dup'] + ' 处重复数据，建议进入数据清洗模块，使用去重规则统一处理；或在人工编辑中删除重复内容。</li>';
    h += '<li><b>后续流程：</b>对已标记异常的文件，完成人工编辑后预检状态将更新为”预检通过”，方可进入数据清洗流程。</li></ol>';
  }
  h += '</div>';
  return h;
}
/* 单文件预检报告预览。id 省略时按数据预处理模块当前勾选/当前分类的文件出报告 */
function mReport(id, fileOrSrc){
  let files;
  if (fileOrSrc) files = [fileOrSrc]; // 外部传入数据源或文件对象
  else if (id) files = [DB.files.find(f => f.id === id)];
  else { const st = S.pre.local; files = st.sel.length ? st.sel.map(x => DB.files.find(f => f.id === x)) : preDataList(); }

/* 批量生成预检报告：inFiles 由调用方传入待出报告的文件（数据预处理模块使用）。
   单个文件走单文件报告预览，多个文件逐个出报告并打包下载 */
function batchReport(inFiles){
  const files = (inFiles || []).filter(Boolean);
  if (!files.length) return toast('请先选择需要生成报告的文件','err');
  // 单条：直接打开该数据对象的预检报告（支持本地文件 id 或在线/流式数据源对象）
  if (files.length === 1){
    const one = files[0];
    if (one && one.name && !one.pre) return mReport(one.id);      // 本地文件：按 id 取
    return mReport(null, one);                                     // 在线/流式数据源：直接传对象
  }

  toast('正在生成 ' + files.length + ' 个预检报告...', 'info');
  setTimeout(() => {
    const reports = files.map(f => {
      const html = reportHtml([f], '数据预检报告', f.name);
      return { name: baseName(f.name) + '_预检报告.doc', content: html };
    });

    openModal(mask('<div class="modal w700"><div class="m-hd"><h3>📦 批量预检报告</h3>'
      + '<span class="m-x" onclick="closeModal()">✕</span></div>'

      + '<div style="max-height:300px;overflow:auto">' + reports.map((r, i) =>
        '<div style="padding:6px 0;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center">'
        + '<span class="small">' + (i+1) + '. ' + esc(r.name) + '</span>'

function onlineSrcCat(){

/* 某统一分类（含下级）下的数据源清单，按数据名称 / 接入时间过滤 */
function onlineSrcList(){
  const st = S.online, scope = st.cat === 'all' ? null : catScope(st.cat);
  return (DB.onlineCats || []).filter(c => {
    if (scope && !scope.includes(c.cat)) return false;
    if (st.srcKw && c.n.toLowerCase().indexOf(st.srcKw.toLowerCase()) < 0) return false;
    const d = (c.inTime || '').slice(0, 10);
    if (st.srcD1 && d < st.srcD1) return false;
    if (st.srcD2 && d > st.srcD2) return false;
    return true;
  });
}
function onlineRows(){
  const st = S.online; const sc = onlineSrcCat();
  const rows = DB.online[sc] || [];
  return rows.filter(r => {
    if (sc === 'o2'){
      // 解密数据：按 A 通道 / B 通道查询
      if (st.chA !== '' && String(r.chA) !== st.chA) return false;
      if (st.chB !== '' && String(r.chB) !== st.chB) return false;
      return true;
    }
    if (sc === 'o1'){
      // 故障数据：关键词（故障名称/发动机号/飞机号）、状态、发生时间区间
      if (st.kw){
        const k = st.kw.toLowerCase();
        const hay = [r.faultName, r.engNo, r.acNo, r.faultDesc].join(' ').toLowerCase();
        if (hay.indexOf(k) < 0) return false;
      }
      if (st.f1 && r.status !== st.f1) return false;
    } else {
      // 解密数据：关键词搜索
      if (st.kw){
        const k = st.kw.toLowerCase();
        const hay = Object.values(r).join(' ').toLowerCase();
        if (hay.indexOf(k) < 0) return false;
      }
    }
    const d = (r.date || '').slice(0,10);
    if (st.d1 && d < st.d1) return false;
    if (st.d2 && d > st.d2) return false;
    return true;
  }).sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); // 按发生时间降序
}

function onlineCatTree(){
  const st = S.online;
  const renderNode = cat => {
    const children = DB.localCats.filter(c => c.pid === cat.id);
    const hasChildren = children.length > 0;
    const expanded = (st.expandedCats || []).includes(cat.id);
    const icon = cat.level === 1 ? '📁' : (cat.level === 2 ? '🗂️' : '📂');

      + '<div class="flex" style="align-items:center;gap:4px;flex:1;min-width:0" onclick="onlineCat(\'' + cat.id + '\')">'

/* 逐条扫描记录，按 ABN_LABEL 归类为具体异常类型（数据缺失 / 数据格式异常 / 重复数据）
   返回结果中：_types 为异常类型名称数组，_issues 为「类型（字段）」形式的明细，整行为空的记录不计入 */
function scanAbnRows(rows, cols){
  return rows.filter(r => cols.some(c => r[c[0]] !== '' && r[c[0]] != null)).map(r => {
    const items = [];
    cols.forEach(c => {
      const v = r[c[0]];
      if ((v === '' || v == null) && !['note','comm'].includes(c[0])) items.push({ g:'miss', d:c[1] });
      else if (typeof v === 'string' && /[★↓]/.test(v)) items.push({ g:'fmt', d:c[1] });
    });
    if (r.dup) items.push({ g:'dup', d:'与上一条记录完全重复' });
    const gs = [...new Set(items.map(x => x.g))];
    return Object.assign({}, r, { _items: items, _types: gs.map(g => ABN_LABEL[g]),
      _issues: gs.map(g => ABN_LABEL[g] + '（' + items.filter(x => x.g === g).map(x => x.d).join('、') + '）').join('；') });
  }).filter(r => r._items.length);
}
/* 异常记录不足时补充演示异常，保证查看预检结果始终有几条有内容的异常记录 */
function seedAbnRows(rows, cols){
  if (rows.length < 3) return;
  const keys = cols.map(c => c[0]).filter(k => !['note','comm'].includes(k));
  if (!keys.length) return;
  const missK = keys[Math.min(3, keys.length - 1)];
  const fmtK = keys.find(k => typeof rows[2][k] === 'string' && rows[2][k].length > 4) || keys[0];
  rows[1][missK] = '';
  if (!/[★↓]/.test(String(rows[2][fmtK]))) rows[2][fmtK] = String(rows[2][fmtK] || '') + '↓↓★';
  if (!rows.some(r => r.dup))
    rows[rows.length - 1] = Object.assign({}, rows[rows.length - 2], { id: uid('r'), dup:true });
}
/* 异常类型徽标：展示具体类型名称，使用与非结构化数据一致的样式 */
/* 异常类型标签（统一样式：蓝色、黄色、红色下划线） */
function abnTypeTags(abnRows){
  const gs = [...new Set(abnRows.reduce((a, r) => a.concat(r._types.map(t => {
    for (let k in ABN_LABEL) if (ABN_LABEL[k] === t) return k;
    return null;
  }).filter(Boolean)), []))];
  return gs.map(g => {
    let color = '#3498db'; // 蓝色
    if (g === 'miss') color = '#f39c12'; // 黄色
    if (g === 'dup') color = '#e74c3c'; // 红色
    const label = ABN_LABEL[g] || g;
    return '<span style="display:inline-block;padding:4px 12px;margin:0 6px;border-bottom:2px solid ' + color
      + ';color:#333;font-weight:600">【' + label + '】</span>';
  }).join('');
}

/* srcId 为要预检的来源分类（o1/o2）；缺省时取当前查看的数据源。
   记录到 __onlinePreCat 供弹窗内的保存/报告使用 */
function onlinePre(srcId){
  const sc = srcId || onlineSrcCat();
  if (!sc) return toast('请先选择数据来源','err');
  window.__onlinePreCat = sc;
  const rows = DB.online[sc] || [];
  const cols = ONLINE_COLS[sc] || [];
  const abns = ABN_POOL.online.map((a, i) => ({ g:a.g, t:a.t, loc:a.loc, adv:a.adv, cnt: [2,2,1][i] || 1 }));

    + abnRows.map((r, i) => '<tr style="background:#fff8f7"><td>' + (i+1) + '</td>'
      + cols.map(c => { const v = r[c[0]];

          return '<td class="small nowrap ell editable-cell" data-id="' + r.id + '" data-field="' + c[0] + '" style="max-width:150px" title="' + esc(v) + '">'

      + abnCell(r) + '</tr>').join('')
    + '</tbody></table></div></div>'
    + '</div><div class="m-ft" id="ftOnlinePre">' + onlinePreFt() + '</div></div>'));

/* 预检结果窗口底部按钮：未进入人工编辑时不显示保存，避免误以为可直接编辑 */
function onlinePreFt(){
  return S.onlinePreEdit
    ? '<button class="btn" onclick="toggleOnlinePreEdit()">✕ 取消编辑</button>'
      + '<button class="btn pri" onclick="saveOnlinePreEdit()">💾 保存修改</button>'
    : '<button class="btn pri" onclick="toggleOnlinePreEdit()">👤 人工编辑</button>';
}
function toggleOnlinePreEdit(){
  S.onlinePreEdit = !S.onlinePreEdit;
  const cells = document.querySelectorAll('.editable-cell');
  if (S.onlinePreEdit){
    cells.forEach(cell => {
      const id = cell.getAttribute('data-id'), fld = cell.getAttribute('data-field');
      const row = (window.__onlineAbnRows || []).find(r => r.id === id);
      if (!row) return;
      const v = row[fld] || '';
      cell.innerHTML = '<input class="inp" style="width:100%;font-size:12px;padding:2px 4px" value="' + esc(v) + '" data-id="' + id + '" data-field="' + fld + '">';
    });
  } else {
    cells.forEach(cell => {
      const inp = cell.querySelector('input');
      if (!inp) return;
      const v = inp.value;
      const bad = !v.trim();
      cell.innerHTML = bad ? '<span class="tag err">空值</span>' : esc(v);
    });
  }
  const ft = document.getElementById('ftOnlinePre');
  if (ft) ft.innerHTML = onlinePreFt();
}
function saveOnlinePreEdit(){
  if (!S.onlinePreEdit) return toast('请先进入人工编辑模式','err');
  const inputs = document.querySelectorAll('.editable-cell input');
  const updates = {};
  inputs.forEach(inp => {
    const id = inp.getAttribute('data-id'), fld = inp.getAttribute('data-field'), v = inp.value.trim();
    if (!updates[id]) updates[id] = {};
    updates[id][fld] = v;
  });
  const sc = window.__onlinePreCat || onlineSrcCat(); const rows = DB.online[sc] || [];
  Object.keys(updates).forEach(id => {
    const row = rows.find(r => r.id === id);
    if (row) Object.assign(row, updates[id]);
  });
  // 重新预检，清除已修复的异常
  if (DB.onlinePre[sc]) DB.onlinePre[sc].done = false;
  closeModal(); toast('已保存修改，异常记录已更新','ok'); render();
}
function mOnlineRpt(){
  const sc = window.__onlinePreCat || onlineSrcCat();
  const pre = DB.onlinePre[sc];
  if (!pre || !pre.done) return toast('请先执行预检','err');
  const fake = [{ name: catName(sc), type:'online', cat: sc, abns: pre.abns, preRule:'在线引接数据-默认规则' }];
  window.__rpt = reportHtml(fake, '数据预检报告', catName(sc) + '（在线引接，' + pre.total + ' 条记录）');
  openModal(mask('<div class="modal w1000"><div class="m-hd"><h3>📄 数据预检报告</h3>'
    + '<span class="m-x" onclick="closeModal()">✕</span></div>'

}

/* ============ 一（3）、流式实时数据接入（API 对接） ============ */
/* 记录视图下当前查看的数据源 id（s1）；清单视图返回空 */
function streamSrcCat(){
  const st = S.stream;
  return st.view === 'rows' && DB.stream && DB.stream[st.src] ? st.src : '';
}
/* 某统一分类（含下级）下的数据清单，按数据名称 / 接入时间过滤 */
function streamSrcList(){
  const st = S.stream, scope = st.cat === 'all' ? null : catScope(st.cat);
  return (DB.streamCats || []).filter(c => {
    if (scope && !scope.includes(c.cat)) return false;
    if (st.srcKw && c.n.toLowerCase().indexOf(st.srcKw.toLowerCase()) < 0) return false;
    const d = (c.inTime || '').slice(0, 10);
    if (st.srcD1 && d < st.srcD1) return false;
    if (st.srcD2 && d > st.srcD2) return false;
    return true;
  });
}
function streamRows(){
  const st = S.stream; const sc = streamSrcCat();
  const rows = (DB.stream && DB.stream[sc]) || [];
  return rows.filter(r => {
    if (st.ac && r.ac !== st.ac) return false;
    if (st.acNo && !r.acNo.includes(st.acNo)) return false;
    if (st.d1 && r.date < st.d1) return false;
    if (st.d2 && r.date > st.d2) return false;
    return true;
  }).sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''))); // 按发生时间降序
}
function streamCatName(id){ return ((DB.streamCats||[]).find(c => c.id === id) || {}).n || ''; }
/* 流式实时数据接入 · 左侧分类树：与《系统管理 · 数据分类管理》同一套分类（DB.localCats）；
   各分类下的数据源（故障处理数据）在右侧以清单形式展示；无数据的分类同样显示 */
function streamCatTree(){
  const st = S.stream;
  const renderNode = cat => {
    const children = DB.localCats.filter(c => c.pid === cat.id);
    const hasChildren = children.length > 0;
    const expanded = (st.expandedCats || []).includes(cat.id);
    const icon = cat.level === 1 ? '📁' : (cat.level === 2 ? '🗂️' : '📂');
    const indent = (cat.level - 1) * 20;
    let html = '<div class="tree-i' + (st.cat === cat.id ? ' on' : '') + '" style="padding-left:' + (12 + indent) + 'px">'
      + '<div class="flex" style="align-items:center;gap:4px;flex:1;min-width:0" onclick="streamCat(\'' + cat.id + '\')">'
      + (hasChildren
        ? '<span class="tree-toggle" onclick="event.stopPropagation();streamToggleCat(\'' + cat.id + '\')">' + (expanded ? '▼' : '▶') + '</span>'
        : '<span style="width:14px;flex:0 0 14px"></span>')
      + '<span class="ell">' + icon + ' ' + esc(cat.n) + '</span></div>'
      + '<span class="n">' + streamCatCount(cat.id) + '</span></div>';
    if (hasChildren && expanded) children.forEach(c => { html += renderNode(c); });
    return html;
  };
  const all = '<div class="tree-i' + (st.cat === 'all' ? ' on' : '') + '" style="padding-left:12px">'
    + '<div class="flex" style="align-items:center;gap:4px;flex:1;min-width:0" onclick="streamCat(\'all\')">'
    + '<span class="ell">📁 全部数据</span></div>'
    + '<span class="n">' + (DB.streamCats || []).length + '</span></div>';
  return all + DB.localCats.filter(c => c.pid === null).map(renderNode).join('');
}
/* 某统一分类（含下级）下的数据源条目数（即右侧数据清单的记录数，非数据记录总量） */
function streamCatCount(catId){
  const scope = catScope(catId);
  return (DB.streamCats || []).filter(c => scope.includes(c.cat)).length;
}
function streamToggleCat(id){
  const st = S.stream; const i = st.expandedCats.indexOf(id);

function toggleStreamPreEdit(){

function saveStreamPreEdit(){
  if (!S.streamPreEdit) return toast('请先进入人工编辑模式','err');

  const updates = {};
  inputs.forEach(inp => {
    const id = inp.getAttribute('data-id'), fld = inp.getAttribute('data-field'), v = inp.value.trim();
    if (!updates[id]) updates[id] = {};
    updates[id][fld] = v;

  Object.keys(updates).forEach(id => {

/* 检查情况单元格：仅显示异常类型标签（全局统一样式，强制单行显示） */
function abnCellTags(r){
  if (!r._types || !r._types.length) return '<span style="color:#27ae60">正常</span>';
  return r._types.map(t => {
    let color = '#3498db', bgColor = '#e8f5ff'; // 蓝色
    if (t === '数据缺失'){ color = '#f39c12'; bgColor = '#fff8e6'; } // 黄色
    if (t === '重复数据'){ color = '#e74c3c'; bgColor = '#fff0f0'; } // 红色
    return '<span style="display:inline-block;padding:2px 8px;margin-right:4px;background:' + bgColor
      + ';border-bottom:2px solid ' + color + ';color:#333;font-size:12px;font-weight:600;white-space:nowrap">【' + t + '】</span>';
  }).join('');
}
/* 异常汇总条：异常类型：+ 异常类型徽标（减小"异常类型"字体） */
function abnSummaryOnline(abns, abnRows){
  if (!abnRows.length) return '<div class="abn-sum"><span class="muted">未发现异常</span></div>';
  const gs = [...new Set(abnRows.reduce((a, r) => a.concat(r._types.map(t => {
    for (let k in ABN_LABEL) if (ABN_LABEL[k] === t) return k;
    return null;
  }).filter(Boolean)), []))];
  return '<div class="abn-sum" style="font-size:13px"><span class="muted" style="margin-right:8px;font-size:12px">异常类型：</span>'
    + gs.map(g => abnMark(g)).join(' ') + '</div>';
}
