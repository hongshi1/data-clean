function abnCellSimple(r){
  const tags = [];
  if (r.fmt) tags.push('<span style="display:inline-block;padding:2px 8px;border-bottom:2px solid #3498db;color:#333;font-weight:600">【数据格式异常】</span>');
  if (r.miss) tags.push('<span style="display:inline-block;padding:2px 8px;border-bottom:2px solid #f39c12;color:#333;font-weight:600">【数据缺失】</span>');
  if (r.dup) tags.push('<span style="display:inline-block;padding:2px 8px;border-bottom:2px solid #e74c3c;color:#333;font-weight:600">【重复数据】</span>');
  return tags.length ? tags.join(' ') : '<span style="color:#27ae60">正常</span>';
}

/* 保存人工编辑 */
function saveOnlineEdit(srcId){
  const rows = (DB.online && DB.online[srcId]) || [];
  const updates = {};
  document.querySelectorAll('#tblOnlineEdit input.online-cell').forEach(inp => {
    const id = inp.getAttribute('data-id'), fld = inp.getAttribute('data-field');
    if (!id || !fld) return;
    (updates[id] = updates[id] || {})[fld] = inp.value.trim();
  });
  Object.keys(updates).forEach(id => {
    const row = rows.find(r => r.id === id);
    if (row) Object.assign(row, updates[id]);
  });

  const note = (val('onlineEdNote') || '').trim();
  if (!DB.onlinePre) DB.onlinePre = {};
  if (!DB.onlinePre[srcId]) DB.onlinePre[srcId] = {};
  DB.onlinePre[srcId].editNote = note;
  DB.onlinePre[srcId].fixed = true;
  DB.onlinePre[srcId].fixTime = now();

  // 重新扫描异常
  const cols = ONLINE_COLS[srcId] || [];
  let abnRows = scanAbnRows(rows, cols);
  const stillAbn = abnRows.length;
  if (stillAbn === 0){
    DB.onlinePre[srcId].done = true;
    DB.onlinePre[srcId].abns = [];
  } else {
    const abns = [
      { g:'fmt', t:'数据格式异常', loc:'发动机编号', adv:'建议核查原始记录', cnt: abnRows.filter(r => r.fmt).length },
      { g:'miss', t:'数据缺失', loc:'发动机编号', adv:'补全缺失字段', cnt: abnRows.filter(r => r.miss).length },
      { g:'dup', t:'重复数据', loc:'', adv:'删除重复记录', cnt: abnRows.filter(r => r.dup).length }
    ].filter(a => a.cnt > 0);
    DB.onlinePre[srcId].abns = abns;
  }

  closeModal(); render();
  toast('保存成功','ok');
  setTimeout(() => preOnlineOpenSrc(srcId), 300);
}

function preSelAll(on){
  const list = preDataList();
  if (!list.length) return toast('当前无可选数据','err');
  S.pre[S.pre.tab].sel = on ? list.map(x => x.id) : [];
  render();
}
function preSearch(){
  const tab = S.pre.tab, st = S.pre[tab];
  if (tab === 'local') { st.kw = val('preKw'); st.ty = val('preTy'); st.st = val('prePreSt'); }
  else if (tab === 'online') { st.srcKw = val('preOkSrcKw'); st.srcD1 = val('preOkSrcD1'); st.srcD2 = val('preOkSrcD2'); }
  else { st.ac = val('preSkAc'); st.acNo = val('preSkAcNo'); st.d1 = val('preSkd1'); st.d2 = val('preSkd2'); }
  st.page = 1; st.sel = []; render();
}
function preReset(){
  const tab = S.pre.tab, st = S.pre[tab];
  if (tab === 'local') Object.assign(st, { kw:'', ty:'', st:'' });
  else if (tab === 'online') Object.assign(st, { srcKw:'', srcD1:'', srcD2:'', srcPage:1, view:'list', sub:'', kw:'', f1:'', d1:'', d2:'' });
  else Object.assign(st, { ac:'', acNo:'', d1:'', d2:'' });
  st.page = 1; render();
}
/* 当前选项卡 + 当前分类/子分类 + 查询条件下的数据 */
function preDataList(){
  const tab = S.pre.tab, st = S.pre[tab];
  if (tab === 'local') {
    const scope = catScope(st.cat);
    return DB.files.filter(f => {
      if (!scope.includes(f.cat)) return false;
      if (st.kw && f.name.toLowerCase().indexOf(st.kw.toLowerCase()) < 0) return false;
      if (st.ty && f.type.toLowerCase() !== st.ty) return false;
      // 预检状态：待预检 / 预检通过 / 预检异常 / 预检中
      if (st.st && f.pre !== st.st) return false;
      return true;
    }).sort((a, b) => String(b.time).localeCompare(String(a.time)));
  }
  const sub = preCurSub();
  if (!sub) return [];
  if (tab === 'online') {
    const rows = (DB.online && DB.online[sub.id]) || [];
    const isFault = sub.id === 'o1';
    return rows.filter(r => {
      const kwF = isFault ? r.faultName : r.acNo;
      if (st.kw && String(kwF||'').toLowerCase().indexOf(st.kw.toLowerCase()) < 0) return false;
      if (st.f1 && r.status !== st.f1) return false;
      const d = r.date || '';
      if (st.d1 && d && d < st.d1) return false;
      if (st.d2 && d && d > st.d2) return false;
      return true;
    });
  }
  const rows = (DB.stream && DB.stream[sub.id]) || [];
  return rows.filter(r => {
    if (st.ac && r.ac !== st.ac) return false;
    if (st.acNo && String(r.acNo||'').toLowerCase().indexOf(st.acNo.toLowerCase()) < 0) return false;
    const d = r.date || '';
    if (st.d1 && d && d < st.d1) return false;
    if (st.d2 && d && d > st.d2) return false;
    return true;
  });
}
function viewPre(){
  const tab = S.pre.tab, st = S.pre[tab];
  const sub = tab === 'local' ? null : preCurSub();
  const title = tab === 'local' ? catName(st.cat)
    : (st.view === 'rows' && sub ? catName(st.cat) + ' / ' + sub.n : catName(st.cat));

  const catHidden = S.pre.catHidden;
  // 结构化选项卡：两级视图（数据源清单 → 数据记录）
  if (tab === 'online'){
    const right = st.view === 'rows' ? preOnlineRowsView(st, sub) : preOnlineSrcView(st);
    return '<div style="display:flex;gap:16px;align-items:stretch;height:calc(100vh - 120px)">'
      + (catHidden ? '' : '<div style="width:250px;flex:0 0 250px"><div class="card" style="height:100%;display:flex;flex-direction:column">'

      + '<div class="tab" onclick="preTab(\'local\')">非结构化</div>'

      + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;height:100%">'
      + (catHidden ? '<div style="margin-bottom:10px"><span class="lnk" onclick="togglePreCat()">» 展开数据分类</span></div>' : '')
      + right + '</div></div>';

  // 非结构化 / 实时数据：原有单级视图
  const list = preDataList(); const p = paginate(list, st); p.cur = st.page;

  return '<div style="display:flex;gap:16px;align-items:stretch;height:calc(100vh - 120px)">'
    // 左侧「数据分类」：三选项卡共用同一套统一分类树
    + (catHidden ? '' : '<div style="width:250px;flex:0 0 250px"><div class="card" style="height:100%;display:flex;flex-direction:column">'
    + '<div class="card-hd" style="display:flex;justify-content:space-between;align-items:center"><h3>数据分类</h3>'
      + '<span class="lnk" onclick="togglePreCat()" title="折叠">«</span></div>'
    // 三个选项卡等分一行，不换行
    + '<div class="tabs tight" style="padding:0 8px">'
    + '<div class="tab' + (tab==='local'?' on':'') + '" onclick="preTab(\'local\')">非结构化</div>'
    + '<div class="tab' + (tab==='online'?' on':'') + '" onclick="preTab(\'online\')">结构化</div>'
    + '<div class="tab' + (tab==='stream'?' on':'') + '" onclick="preTab(\'stream\')">实时数据</div></div>'
    + '<div class="card-bd" style="padding:8px 0;overflow-y:auto;flex:1">' + preCatTree() + '</div></div></div>')

    // 右侧：按选项卡沿用对应接入模块的组织方式
    + '<div style="flex:1;min-width:0;display:flex;flex-direction:column">'
    + (catHidden ? '<div style="margin-bottom:10px"><span class="lnk" onclick="togglePreCat()">» 展开数据分类</span></div>' : '')
    + (tab === 'online' ? preOnlineSrcView(st)
      : tab === 'stream' ? preStreamSrcView(st)
      : '<div class="card" style="margin-bottom:10px"><div class="card-bd" style="padding:10px">' + preLocalFbar(st) + '</div></div>'
      + '<div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">'
      + '<div class="card-hd"><h3>' + esc(title) + '</h3>'
      + '<div class="btn-grp">'
      + '<button class="btn" onclick="preBatchPre()">批量预检</button>'
      + '<button class="btn" onclick="preBatchDesens()">🔒 批量脱敏</button>'
      + '<button class="btn" onclick="preBatchReport()">📄 批量导出预检报告</button>'
      + '</div></div>'
      + '<div class="card-bd np" style="flex:1;overflow:hidden;display:flex;flex-direction:column">'
      + preLocalTable(p, list, allSelLocal)
      + '</div>' + pager(p, 'prePage', 'preSize', st.size) + '</div>')
    + '</div></div>';
}
/* 来源子分类切换条：结构化/实时数据在同一统一分类下可能挂多个来源，列结构不同故分表展示 */
function preSubBar(st, sub){

  return '<div class="fitem"><label>数据来源</label><select class="sel" style="width:150px" onchange="preSelSub(this.value)">'
    + subs.map(c => '<option value="' + c.id + '"' + (sub && sub.id === c.id ? ' selected' : '') + '>' + esc(c.n) + '</option>').join('')
    + '</select></div>';
}

/* 类型下拉：仅列出当前分类（含下级）实际存在的类型 */
function preLocalTypeOpts(){
  const st = S.pre.local, scope = catScope(st.cat);
  return [...new Set(DB.files.filter(f => {
    if (!scope.includes(f.cat)) return false;
    if (st.kw && f.name.toLowerCase().indexOf(st.kw.toLowerCase()) < 0) return false;
    return true;
  }).map(f => f.type.toLowerCase()))].sort();
}

function preStreamReset(){

function preStreamSrcPage(n){ S.pre.stream.srcPage = n; render(); }
function preStreamSrcSize(n){ S.pre.stream.srcSize = n; S.pre.stream.srcPage = 1; render(); }
/* 实时数据源列表：序号/数据名称/接入时间/更新时间/预检状态/操作 */
function preStreamSrcView(st){
  const scope = catScope(st.cat);
  const srcList = (DB.streamCats || []).filter(c => {
    if (!scope.includes(c.cat)) return false;
    if (st.srcKw && c.n.toLowerCase().indexOf(st.srcKw.toLowerCase()) < 0) return false;
    const d = (c.inTime || '').slice(0, 10);
    if (st.srcD1 && d < st.srcD1) return false;
    if (st.srcD2 && d > st.srcD2) return false;
    // 预检状态筛选
    if (st.srcSt) {
      let pre = (DB.streamPre && DB.streamPre[c.id]) || null;
      if (!pre){
        if (!DB.streamPre) DB.streamPre = {};
        const rows = (DB.stream && DB.stream[c.id]) || [];
        const abns = [
          { g:'fmt', t:'数据格式异常', loc:'发动机编号', adv:'建议核查原始记录', cnt:2 },
          { g:'miss', t:'数据缺失', loc:'发动机编号', adv:'补全缺失字段', cnt:1 },
          { g:'dup', t:'重复数据', loc:'', adv:'删除重复记录', cnt:1 }
        ];
        DB.streamPre[c.id] = pre = { done:true, running:false, abns, time: c.inTime, total: rows.length };
      }
      const stt = pre.running ? 'running' : (pre.done ? ((pre.abns || []).length ? 'abn' : 'pass') : 'wait');
      if (st.srcSt !== stt) return false;
    }
    return true;
  });
  const p = paginate(srcList, { page: st.srcPage || 1, size: st.srcSize || 10 });
  p.cur = st.srcPage || 1;
  st.srcSel = st.srcSel || [];
  const allSel = p.rows.length > 0 && p.rows.every(c => st.srcSel.includes(c.id));
  return '<div class="card" style="margin-bottom:10px"><div class="card-bd" style="padding:10px">'
    + preStreamFbar(st, null) + '</div></div>'
    + '<div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">'
    + '<div class="card-hd"><h3>' + esc(catName(st.cat)) + '</h3><div class="btn-grp">'
      + '<button class="btn" onclick="preStreamBatchPre()">批量预检</button>'
      + '<button class="btn" onclick="preStreamBatchDesens()">🔒 批量脱敏</button>'
      + '<button class="btn" onclick="preStreamBatchReport()">📄 批量导出预检报告</button>'
      + '</div></div>'
    + '<div class="card-bd np" style="flex:1;overflow:hidden;display:flex;flex-direction:column">'
    + '<div class="tbwrap" style="flex:1;overflow:auto"><table class="tb">'
    + '<thead style="position:sticky;top:0;background:#fff;z-index:1"><tr>'
    + '<th style="width:34px"><input type="checkbox"' + (allSel ? ' checked' : '')
      + ' onchange="preStreamSelAll(this.checked)"></th>'
    + '<th style="width:46px">序号</th><th style="min-width:180px">数据名称</th>'
    + '<th class="nowrap">接入时间</th><th class="nowrap">更新时间</th><th class="nowrap">预检状态</th>'
    + '<th class="nowrap" style="width:230px">操作</th></tr></thead><tbody>'
    + (srcList.length ? p.rows.map((c, i) => {
      // 接入后自动预检，强制生成异常数据
      let pre = (DB.streamPre && DB.streamPre[c.id]) || null;
      if (!pre){
        if (!DB.streamPre) DB.streamPre = {};
        const rows = (DB.stream && DB.stream[c.id]) || [];
        const abns = [
          { g:'fmt', t:'数据格式异常', loc:'发动机编号', adv:'建议核查原始记录', cnt:2 },
          { g:'miss', t:'数据缺失', loc:'发动机编号', adv:'补全缺失字段', cnt:1 },
          { g:'dup', t:'重复数据', loc:'', adv:'删除重复记录', cnt:1 }
        ];
        DB.streamPre[c.id] = pre = { done:true, running:false, abns, time: c.inTime, total: rows.length };
      }
      const stt = pre.running ? 'running' : (pre.done ? ((pre.abns || []).length ? 'abn' : 'pass') : 'wait');
      const canView = stt === 'pass' || stt === 'abn';
      const sel = st.srcSel.includes(c.id);
      return '<tr>'
        + '<td><input type="checkbox"' + (sel ? ' checked' : '')
          + ' onchange="preStreamSelItem(\'' + c.id + '\')"></td>'
        + '<td>' + ((p.cur - 1) * (st.srcSize || 10) + i + 1) + '</td>'
        + '<td class="ell" style="max-width:240px" title="' + esc(c.n) + '"><span>📡 ' + esc(c.n) + '</span></td>'
        + '<td class="small nowrap">' + esc(c.inTime || '—') + '</td>'
        + '<td class="small nowrap">' + esc(c.upTime || '—') + '</td>'
        + '<td class="nowrap">' + preSrcTag(stt, (pre.abns || []).reduce((a, b) => a + (b.cnt || 1), 0)) + '</td>'
        + '<td class="ops nowrap">'
        + (stt === 'running'
          ? '<span class="muted">预检</span><span class="muted">查看预检结果</span>'
          : '<span class="lnk" onclick="preStreamRunPre(\'' + c.id + '\')">预检</span>'
            + (canView
              ? '<span class="lnk" onclick="preStreamOpenSrc(\'' + c.id + '\')">查看预检结果</span>'
              : '<span class="muted">查看预检结果</span>'))
        + (stt === 'pass'
          ? '<span class="lnk" onclick="preBatchDesensFor(\'' + c.id + '\')">脱敏</span>'
          : '<span class="muted">脱敏</span>')
        + '</td></tr>';
    }).join('')
    : '<tr><td colspan="7"><div class="empty"><span class="big">📡</span>该分类下暂无实时数据来源</div></td></tr>')
    + '</tbody></table></div>'
    + pager(p, 'preStreamSrcPage', 'preStreamSrcSize', st.srcSize || 10)
    + '</div></div>';
}
function preStreamSelItem(id){
  const st = S.pre.stream;
  if (!st.srcSel) st.srcSel = [];
  const i = st.srcSel.indexOf(id);
  if (i < 0) {
    st.srcSel.push(id);
  } else {
    st.srcSel.splice(i, 1);
  }
  render();
}
function preStreamSelAll(on){
  const st = S.pre.stream;
  const scope = catScope(st.cat);
  const list = (DB.streamCats || []).filter(c => {
    if (!scope.includes(c.cat)) return false;
    if (st.srcKw && c.n.toLowerCase().indexOf(st.srcKw.toLowerCase()) < 0) return false;
    const d = (c.inTime || '').slice(0, 10);
    if (st.srcD1 && d < st.srcD1) return false;
    if (st.srcD2 && d > st.srcD2) return false;
    return true;
  });
  if (!list.length) return toast('当前无可选数据源','err');
  st.srcSel = on ? list.map(c => c.id) : [];
  render();
}
function preStreamRunPre(id){
  const c = (DB.streamCats || []).find(x => x.id === id); if (!c) return;
  DB.streamPre = DB.streamPre || {};
  DB.streamPre[id] = { done:false, running:true, abns:[] };
  render();
  setTimeout(() => {
    const rows = (DB.stream && DB.stream[id]) || [];
    const abns = id === 's1' ? [{ g:'miss', t:'数据缺失', cnt:1 }, { g:'dup', t:'存在重复记录', cnt:1 }] : [];
    DB.streamPre[id] = { done:true, running:false, abns, time: now(), total: rows.length };
    render();
  }, 900);
}
function preStreamBatchPre(){
  const st = S.pre.stream;
  const ids = (st.srcSel && st.srcSel.length) ? st.srcSel.slice()
    : (DB.streamCats || []).filter(c => catScope(st.cat).includes(c.cat)).map(c => c.id);
  if (!ids.length) return toast('当前分类下暂无数据源','err');
  DB.streamPre = DB.streamPre || {};
  ids.forEach(id => { DB.streamPre[id] = { done:false, running:true, abns:[] }; });
  render();
  toast('预检任务已发起','ok');
  setTimeout(() => {
    ids.forEach(id => {
      const rows = (DB.stream && DB.stream[id]) || [];
      const abns = [
        { g:'fmt', t:'数据格式异常', loc:'发动机编号', adv:'建议核查原始记录', cnt:2 },
        { g:'miss', t:'数据缺失', loc:'发动机编号', adv:'补全缺失字段', cnt:1 },
        { g:'dup', t:'重复数据', loc:'', adv:'删除重复记录', cnt:1 }
      ];
      DB.streamPre[id] = { done:true, running:false, abns, time: now(), total: rows.length };
    });
    render();
  }, 1200);
}
function preStreamBatchDesens(){
  const st = S.pre.stream;
  if (!st.srcSel || !st.srcSel.length) return toast('请先勾选要脱敏的数据源','err');
  const picked = st.srcSel.map(id => (DB.streamCats || []).find(c => c.id === id)).filter(Boolean);
  const ready = picked.filter(c => {
    const p = (DB.streamPre || {})[c.id] || {};
    return p.done && !(p.abns || []).length;
  });
  if (!ready.length) return toast('所勾选数据源均未通过预检，请先完成预检','err');
  const skipped = picked.length - ready.length;

/* 保存人工编辑 */
function saveStreamEdit(srcId){
  const rows = (DB.stream && DB.stream[srcId]) || [];
  const updates = {};
  document.querySelectorAll('#tblStreamEdit input.stream-cell').forEach(inp => {
    const id = inp.getAttribute('data-id'), fld = inp.getAttribute('data-field');
    if (!id || !fld) return;
    (updates[id] = updates[id] || {})[fld] = inp.value.trim();
  });
  Object.keys(updates).forEach(id => {
    const row = rows.find(r => r.id === id);
    if (row) Object.assign(row, updates[id]);
  });

  const note = (val('streamEdNote') || '').trim();
  if (!DB.streamPre) DB.streamPre = {};
  if (!DB.streamPre[srcId]) DB.streamPre[srcId] = {};
  DB.streamPre[srcId].editNote = note;
  DB.streamPre[srcId].fixed = true;
  DB.streamPre[srcId].fixTime = now();

  // 重新扫描异常
  const cols = STREAM_COLS[srcId] || [];
  let abnRows = scanAbnRows(rows, cols);
  const stillAbn = abnRows.length;
  if (stillAbn === 0){
    DB.streamPre[srcId].done = true;
    DB.streamPre[srcId].abns = [];
  } else {
    const abns = [
      { g:'fmt', t:'数据格式异常', loc:'发动机编号', adv:'建议核查原始记录', cnt: abnRows.filter(r => r.fmt).length },
      { g:'miss', t:'数据缺失', loc:'发动机编号', adv:'补全缺失字段', cnt: abnRows.filter(r => r.miss).length },
      { g:'dup', t:'重复数据', loc:'', adv:'删除重复记录', cnt: abnRows.filter(r => r.dup).length }
    ].filter(a => a.cnt > 0);
    DB.streamPre[srcId].abns = abns;
  }

  closeModal(); render();
  toast('保存成功','ok');
  setTimeout(() => preStreamOpenSrc(srcId), 300);
}

/* ---- DOC / DOCX / PDF 切片查看 ----
   按文档正文的自然段落切分，优先使用人工编辑后文本（editedText），
   切点按章节/小节标题识别；不限固定数量，按文档结构自然划分 */
function preSlices(f){
  // 优先用编辑后文本，未编辑时取原始 body
  let body;
  if (f.editedText != null){
    body = f.editedText;  // 人工编辑后的纯文本
  } else if (f.type === 'pdf'){
    body = pdfBody(f);
  } else {
    body = docBody(f)
      .replace(/<[^>]+>/g, '\n').replace(/§[A-Z0-9]+:?([^§]*)§/g, '$1');
  }
  body = body.replace(/&nbsp;/g, ' ');
  // 切段：识别章节标题（一、1. 或更宽松的模式：行首数字/中文数字 + 标点 + 短标题）和空行分隔
  const segs = body.split(/\n(?=[一二三四五六七八九十0-9]{1,2}[、.\s]|\d+\.\d*\s)|\n\s*\n/)
    .map(s => s.replace(/\s+/g, ' ').trim()).filter(s => s.length > 20);
  // 取全部切片，不再硬截断为 8 片
  return segs.map((s, i) => ({
    no: i + 1,
    name: baseName(f.name) + '-切片' + (i + 1),
    content: s,
    src: f.name
  }));
}

      + '<td class="small nowrap">' + s.content.length + '</td>'

/* 批量脱敏：按当前选项卡分派到对应实现 */
function preBatchDesens(){
  const tab = S.pre.tab, st = S.pre[tab];
  if (!st.sel.length) return toast('请先勾选要脱敏的数据','err');
  if (tab === 'local') {
    const picked = st.sel.map(id => DB.files.find(f => f.id === id)).filter(Boolean);
    if (!picked.length) return toast('请先勾选要脱敏的文件','err');
    // 仅对预检通过的文件脱敏，其余自动过滤
    const files = picked.filter(f => f.pre === 'pass');
    if (!files.length) return toast('所勾选文件均未通过预检，请先完成预检','err');
    const skipped = picked.length - files.length;
    if (skipped) toast('已过滤 ' + skipped + ' 个未通过预检的文件','warn');
    batchDesens(files);
    return;
  }
  const sub = preCurSub();
  mRowsDesens(sub ? sub.n : catName(st.cat), st.sel.length);
}

/* 结构化 / 实时数据：查看预检报告（Word 格式预览，可导出 .doc）。
   尚未执行过预检时先自动预检一次，保证报告始终有内容 */
function preShowRpt(){
  const tab = S.pre.tab, sub = preCurSub();
  if (!sub) return toast('当前分类下暂无数据来源','err');
  const isOnline = tab === 'online';
  const store = isOnline ? DB.onlinePre : DB.streamPre;
  const rows = (isOnline ? DB.online : DB.stream)[sub.id] || [];
  let pre = store[sub.id];
  if (!pre || !pre.done){
    // 自动补一次预检：仅生成报告所需的异常汇总，不弹预检结果窗
    const abns = ABN_POOL.online.map((a, i) => ({ g:a.g, t:a.t, loc:a.loc, adv:a.adv, cnt: [2,2,1][i] || 1 }));
    pre = store[sub.id] = { done:true, abns, time: now(), total: rows.length };
  }
  const srcLabel = isOnline ? '结构化接入' : '流式实时接入';
  const fake = [{ name: sub.n, type:'online', cat: sub.cat || S.pre[tab].cat,
    abns: pre.abns, preRule:'在线引接数据-默认规则' }];
  window.__rpt = reportHtml(fake, '数据预检报告',
    sub.n + '（' + srcLabel + '，' + pre.total + ' 条记录）');
  openModal(mask('<div class="modal w1000"><div class="m-hd"><h3>📄 数据预检报告</h3>'
    + '<span class="m-x" onclick="closeModal()">✕</span></div>'
    + '<div class="m-bd" style="background:#eef1f6">' + window.__rpt + '</div>'
    + '<div class="m-ft"><button class="btn" onclick="closeModal()">关闭</button>'
    + '<button class="btn pri" onclick="download(\'数据预检报告_' + esc(sub.n) + '.doc\', window.__rpt)">⬇ 下载报告（.doc）</button></div></div>'));
  render();
}
/* 数据清洗：当前一级分类（含下级）下、预检已完成（通过/异常）的文件记录 */
function cleanList(){
  const st = S.clean; const scope = catScope(st.cat);
  return DB.files.filter(f => {
    if (!scope.includes(f.cat)) return false;
    // 仅预检完成（通过或异常）的数据才进入清洗环节
    if (f.pre !== 'pass' && f.pre !== 'abn') return false;
    if (st.kw && f.name.toLowerCase().indexOf(st.kw.toLowerCase()) < 0) return false;
    if (st.ty && String(f.type).toLowerCase() !== st.ty) return false;
    if (st.st && (f.cl || 'wait') !== st.st) return false;
    return true;
  }).sort((a, b) => String(b.time).localeCompare(String(a.time)));
}
function cleanCatCount(cid){
  const scope = catScope(cid);
  return DB.files.filter(f => scope.includes(f.cat) && (f.pre === 'pass' || f.pre === 'abn')).length;
}

/* ---- 文件级清洗：单个 / 批量 ---- */
function cleanFile(id){
  const f = DB.files.find(x => x.id === id); if (!f) return;
  f.cl = 'running'; render();
  setTimeout(() => {
    f.cl = 'done'; f.cleaned = true; f.clTime = now();
    f.clVer = 'V1.1'; f.clRes = mkCleanRes(f);
    render(); toast('「' + baseName(f.name) + '」清洗完成','ok');
  }, 600);
}
function cleanBatch(){
  const sel = S.clean.sel;
  if (!sel.length) return toast('请先勾选需要清洗的数据','err');
  const files = sel.map(id => DB.files.find(f => f.id === id)).filter(Boolean);
  const todo = files.filter(f => (f.cl || 'wait') !== 'running');
  if (!todo.length) return toast('所勾选数据均在清洗中，请稍后再试','err');
  todo.forEach(f => { f.cl = 'running'; });
  render(); toast('清洗任务已发起，共 ' + todo.length + ' 个文件','ok');
  setTimeout(() => {
    todo.forEach(f => { f.cl = 'done'; f.cleaned = true; f.clTime = now(); f.clVer = 'V1.1'; f.clRes = mkCleanRes(f); });
    S.clean.sel = []; render(); toast('已完成 ' + todo.length + ' 个文件清洗','ok');
  }, 900);
}
/* 生成清洗结果：按已启用清洗规则统计各类处理量 */
function mkCleanRes(f){
  const base = f.kd === 'table' ? (f.rows || 120) : (f.slices || 10);
  const miss = 1 + (base % 5), dup = base % 4, abn = 1 + (base % 3), red = base % 6;
  return { total: base, miss, dup, abn, red, removed: dup + abn,
    clean: base - (dup + abn), time: f.clTime || now() };
}
function mCleanFileRes(id){
  const f = DB.files.find(x => x.id === id); if (!f) return;
  if ((f.cl || 'wait') !== 'done') return toast('该文件尚未完成清洗','err');
  const r = f.clRes || mkCleanRes(f);
  const isDoc = ['doc','docx','pdf'].includes(String(f.type).toLowerCase());

  // 文档类：显示切片列表，提供对比按钮
  if (isDoc) {
    const slices = r.slices || Array.from({length: 15}, (_, i) => ({
      id: 's' + (i+1),
      no: i+1,
      before: '原始文本片段 ' + (i+1) + '，包含一些格式问题、重复内容或冗余信息...',
      after: '清洗后的文本片段 ' + (i+1) + '，已规范化处理。'
    }));
    openModal(mask('<div class="modal w1600"><div class="m-hd"><h3>查看清洗结果 · ' + esc(baseName(f.name)) + '</h3>'
      + '<span class="m-x" onclick="closeModal()">✕</span></div><div class="m-bd">'
      + '<div class="flex wrap mb14">'
        + '<span class="tag sq">类型：' + String(f.type).toUpperCase() + '</span>'
        + '<span class="tag">大小：' + f.size + '</span>'
        + '<span class="tag pur">数据分类：' + esc(catName(effCat(f.cat))) + '</span>'
      + '</div>'
      + '<h4 style="margin:16px 0 10px">清洗数据列表</h4>'
      + '<div class="tbwrap" style="max-height:500px"><table class="tb"><thead><tr>'
        + '<th style="width:60px">切片序号</th><th>清洗前内容</th><th>清洗后内容</th><th style="width:120px">操作</th>'
        + '</tr></thead><tbody>'
        + slices.map(s => '<tr><td>' + s.no + '</td>'
          + '<td class="ell small" style="max-width:450px">' + esc(s.before) + '</td>'
          + '<td class="ell small" style="max-width:450px">' + esc(s.after) + '</td>'
          + '<td><span class="lnk" onclick="mCleanSliceCompare(\'' + f.id + '\',\'' + s.id + '\')">清洗前后对比</span></td>'
          + '</tr>').join('')
        + '</tbody></table></div>'
      + '</div><div class="m-ft"><button class="btn" onclick="closeModal()">关闭</button>'
      + '<button class="btn pri" onclick="cleanFileReport(\'' + f.id + '\')">⬇ 导出清洗报告</button></div></div>'));
    return;

function onCatChange(catId){

  const checked = chk.checked;

  const children = DB.localCats.filter(c => c.pid === catId);
  children.forEach(child => {

function onRuleChk(k, g){
  const el = $('rk-' + k), card = $('rc-' + k);
  if (el && card) card.classList.toggle('on', el.checked);
  if (g){
    const all = [...document.querySelectorAll('.rk-' + g)], head = $('ckall-' + g);

function saveCleanTask(){
  const n = val('ctN').trim(); if (!n) return toast('请输入任务名称','err');
  // 检查任务名称是否重复
  if (DB.cleanTasks.some(t => t.n === n)) return toast('任务名称已存在，请使用其他名称','err');
  const cats = [];
  document.querySelectorAll('.cat-chk:checked').forEach(el => {
    const v = el.value.split(':');
    cats.push({ id: v[1], type: v[0] });
  });
  if (!cats.length) return toast('请至少选择一个数据分类','err');
  const rules = [], thr = {};
  CLEAN_TABS.forEach(g => g.items.forEach(it => { const e = $('rk-' + it.k);
    if (e && e.checked){
      rules.push(it.k);
      // 带阈值的规则：读取用户设定值，校验范围 1-99
      if (it.thr){
        const v = Number(val('thr-' + it.k));
        if (!(v > 0 && v < 100)) return toast('「' + it.n + '」阈值须大于 0 且小于 100','err');
        thr[it.k] = v;
      }
    } }));
  if (!rules.length) return toast('请至少选择一项清洗规则','err');
  // 阈值合法性再校验一次（forEach 内 return 无法中断外层）
  const badThr = rules.filter(k => RULE_INFO[k] && RULE_INFO[k].thr
    && !(thr[k] > 0 && thr[k] < 100));
  if (badThr.length) return toast('「' + RULE_NAME[badThr[0]] + '」阈值须大于 0 且小于 100','err');
  const total = 300 + Math.floor(Math.random()*900);
  const t = { id: uid('t'), n, st: 'done', cats, rules, thr,
    note: val('ctNote').trim(), total, removed: Math.floor(total * 0.17), time: now(),
    ver: 'V1.' + (DB.cleanTasks.length + 1), consist: 'wait', cst: null, verAfterCheck: '',
    sliced: cats.some(c => c.type === 'local') };
  DB.cleanTasks.unshift(t); closeModal();
  toast('创建清洗任务成功', 'ok');
}

function hl(s){
  return esc(s).replace(/★|↓↓|【内容缺失】|【姓名】|【IP地址】/g, m => '<span class="mk">' + m + '</span>');
}
/* ---- 清洗前后对比：内容渲染工具 ---- */
/* 空值高亮徽标 */
function emptyBadge(txt){
  return '<span style="background:#fff5e6;color:#f79009;padding:2px 6px;border-radius:3px">' + txt + '</span>';
}
/* 是否为「首行表头 + 制表符分隔」的表格文本 */
function isTsv(s){
  return typeof s === 'string' && s.indexOf('\t') >= 0;
}
/* 制表符文本渲染为表格：每条记录占一行不换行，空单元格高亮为「空值」 */
function tsvTable(s){
  const lines = String(s).split('\n');
  const cell = (v, tag) => '<' + tag + ' style="white-space:nowrap;padding:8px 12px">'
    + (v === '' ? emptyBadge('空值') : esc(v)) + '</' + tag + '>';
  let out = '<table class="tb" style="font-size:12px"><thead><tr>'
    + lines[0].split('\t').map(h => cell(h, 'th')).join('') + '</tr></thead><tbody>';
  for (let j = 1; j < lines.length; j++){
    out += '<tr>' + lines[j].split('\t').map(c => cell(c, 'td')).join('') + '</tr>';
  }
  return out + '</tbody></table>';
}
/* 纯文本按空行切段展示，一条记录及其字段值为一个段落，<空值> 高亮 */
function paraText(s){
  return String(s).split('\n\n').map(line =>
    '<p style="margin-bottom:12px">'
    + hl(line).replace(/&lt;空值&gt;/g, emptyBadge('&lt;空值&gt;'))
    + '</p>').join('');
}
/* JSON 文本：空对象 {}、空数组 []、null 高亮（保留原样，不做填充） */
function hlEmptyJson(s){
  return hl(s).replace(/\{\}|\[\]|\bnull\b/g, m => emptyBadge(m));
}
/* 「清洗后」内容的统一渲染：mDiff 首次渲染与人工编辑保存后复用同一逻辑 */
function afterHtml(r, txt){
  if (r.type === 'json') return hlEmptyJson(txt);
  if (r.type === 'table' && isTsv(r.before)) return paraText(txt);
  return hl(txt);
}
function mDiff(i){
  const r = window.__recs[i], t = window.__task;
  window.__currentEditIndex = i;

  // 构建数据名称显示：名称中已含「-切片N」时不再重复拼接

    dataTitle += ' - 切片' + r.sliceNo;
  }

  // 计算字符数
  const beforeLen = r.before.length;
  const afterLen = r.after.length;

  // 判断数据类型
  let beforeContent = '';
  let afterContent = '';

  if (r.type === 'table' && isTsv(r.before)) {
    // 表格类（解密数据 / 故障数据）：清洗前以表格展示（空值高亮）
    beforeContent = tsvTable(r.before);
  } else if (r.type === 'json') {
    // JSON 类：清洗前为 JSON 文本，空对象 {} / 空数组 [] / null 高亮
    beforeContent = hlEmptyJson(r.before);
  } else {
    beforeContent = hl(r.before);
  }
  // 清洗后：与人工编辑保存后复用同一渲染逻辑
  afterContent = afterHtml(r, r.after);

  openModal(mask('<div class="modal w1150"><div class="m-hd">'

/* 开始校验: 勾选了条目则仅校验选中项, 否则校验当前范围全部 */
function cstStartCheck(){
  if (S.cstMain.running) return;
  const scope = S.cstMain.doc || 'all';
  const all = qaList(scope);
  const list = all.filter(q => S.cstMain.sel[q.idx]);
  const useSel = list.length > 0;
  const target = useSel ? list : all;
  if (!target.length) return toast('当前范围无问答对', 'err');
  S.cstMain.running = true;
  target.forEach(q => { DB.qaCst[q.idx] = { st: 'checking', n: 0 }; });
  render();
  toast('已对' + (useSel ? '选中的 ' + target.length + ' 条' : '「' + (scope === 'all' ? '全部数据源' : 'doc' + scope) + '」' + target.length + ' 条') + '问答对发起' + _cstCfgFlat().rules.length + '项校验…', 'ok');
  const nums = scope === 'all' ? SRS_DEMO.datasets.map(d => d.num) : [scope];
  nums.forEach(n => { if (!DB.srsChecks[n]) DB.srsChecks[n] = simCheck(n); });
  setTimeout(() => {
    let nFind = 0, nFail = 0;
    target.forEach(q => {
      const c = DB.srsChecks[q.num];
      const f = c ? c.categories.reduce((a, b) => a + b.findings, 0) : 0;
      const fail = c && c.summary.fail > 0;
      const per = Math.max(1, Math.round(f / Math.max(all.filter(x => x.num === q.num).length, 1)));
      DB.qaCst[q.idx] = { st: fail ? 'fail' : 'pass', n: per };
      nFind += per; if (fail) nFail++;
    });
    S.cstMain.running = false;
    render();
    toast('校验完成：' + nFail + ' 条问答对发现确证问题，共 ' + nFind + ' 条发现', nFail ? 'err' : 'ok');
  }, 2000);
}

async function mmQuery(){
  const inp = document.getElementById('mmQ');
  const q = inp ? inp.value.trim() : '';
  S.mmCfg.q = q;
  if (!q) return toast('请输入查询内容', 'err');
  S.cstGraph.queried = true;
  S.cstGraph.node = '';
  render();
  toast('正在召回「' + q.slice(0, 16) + '」…', 'ok');
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 2500);
    const actOpts = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json',
        'Authorization': 'Basic ' + btoa('admin:nankai-srs-2026') },
      body: JSON.stringify({ question: q, k: S.mmCfg.k, top_k: S.mmCfg.topK, min_w: S.mmCfg.minW }),
      signal: ctrl.signal };
    /* 同源优先(经反向代理/公网隧道), 失败再试本机8300, 均失败走离线回退 */
    let j = null;
    for (const u of ['/api/activate', 'http://127.0.0.1:8300/api/activate']) {
      try {
        const r = await fetch(u, actOpts);
        const jj = await r.json();
        if (jj && jj.ok) { j = jj; break; }
      } catch (e2) { /* 尝试下一个地址 */ }
    }
    if (j) { applyLiveGraph(j); return; }
  } catch (e) { /* 引擎未启动, 离线回退 */ }
  mmOfflineQuery(q);
}
function applyLiveGraph(j){
  const slim = n => ({ id: n.id, type: n.type, label: (n.label || '').slice(0, 24),
    section: n.section || '',
    preview: ((n.payload && n.payload.text_preview) || '').slice(0, 40),
    caption: ((n.payload && n.payload.caption) || '').slice(0, 20),
    headers: (n.payload && n.payload.headers || []).slice(0, 4),
    img_type: (n.payload && n.payload.img_type) || '',
    seq: (n.payload && n.payload.seq_type) === 'anchor_chain' ? ((n.payload && n.payload.n_steps || '?') + '步') : '异常流',
    rule: (n.id || '').split(':')[1] || '' });
  const groups = {};
  let nContent = 0;
  Object.keys(j.groups || {}).forEach(m => {
    groups[m] = (j.groups[m] || []).slice(0, 12).map(n => Object.assign(slim(n), {
      score: Math.round((n.score || 0) * 100) / 100,
      via: (n.via_label || '').slice(0, 10) }));
    nContent += groups[m].length;
  });
  const g2 = { question: j.question, doc: j.doc,
    center: Object.assign(slim(j.center), {
      alias: ((j.center.payload && j.center.payload.aliases) || [''])[0],
      score: j.center.score || 1 }),
    related: (j.related_entities || []).slice(0, 6).map(x => ({
      name: (x.aliases || [x.id_str || ''])[0], id_str: x.id_str || '',
      rel: x.rel || '', score: Math.round((x.score || 0) * 100) / 100 })),
    groups: groups,
    stats: { n_related: (j.related_entities || []).length, n_content: nContent,
      by_modality: j.stats ? (j.stats.by_modality || {}) : {} } };
  SRS_DEMO.graphs[j.doc] = g2;
  S.cstGraph.doc = j.doc;
  render();
  toast('实时引擎召回完成：' + g2.center.alias + '，相关' + g2.related.length + '，召回' + nContent + '条', 'ok');
}
function mmOfflineQuery(q){
  const hit = Object.keys(SRS_DEMO.graphs).find(num => {
    const g = SRS_DEMO.graphs[num];
    const al = (g.center.alias || g.center.label || '');
    return al && (q.indexOf(al) >= 0 || al.indexOf(q) >= 0);
  });
  if (hit && hit !== S.cstGraph.doc){
    S.cstGraph.doc = hit; render();
    toast('离线匹配：切换到 doc' + hit + ' 的图谱（启动实时引擎可获得任意查询的完整召回）', 'ok');
  } else if (hit){
    toast('已展示该实体的图谱', 'ok');
  } else {
    toast('离线演示未匹配到该实体；启动实时引擎(python server/main.py)后可任意查询', 'err');
  }
}

/* 三分类统计: 语法/语义/逻辑 */
function cst3Stats(dc){
  if (!dc) return [];
  const items = dc.items || [];
  const out = [];
  Object.keys(CST3).forEach(top => {
    const ids = [];
    CST3[top].forEach(sub => { ids.push.apply(ids, sub[1]); });
    const its = items.filter(it => ids.indexOf(it.id) >= 0);
    out.push({
      name: top, total: its.length,
      pass: its.filter(i => i.status === 'pass').length,
      warn: its.filter(i => i.status === 'warn').length,
      fail: its.filter(i => i.status === 'fail').length,
      findings: its.reduce((a, b) => a + (b.n || 0), 0) });
  });
  return out;
}

/* 总报告: 分门别类统计(语法/语义/逻辑, 含细分原因与发现) — 融合原独立页面 */
function mTotalReport(){
  const scope = S.cstMain.doc || 'all';
  const nums = scope === 'all' ? SRS_DEMO.datasets.map(d => d.num) : [scope];
  nums.forEach(n => { if (!DB.srsChecks[n]) DB.srsChecks[n] = simCheck(n); });
  /* 聚合当前范围的校验结果 */
  const agg = { pass: 0, warn: 0, fail: 0, findings: 0 };
  const itemsAll = [];
  nums.forEach(n => {
    const dc = DB.srsChecks[n];
    agg.pass += dc.summary.pass; agg.warn += dc.summary.warn;
    agg.fail += dc.summary.fail; agg.findings += dc.categories.reduce((a, b) => a + b.findings, 0);
    dc.items.forEach(it => itemsAll.push(it));
  });
  const scopeName3 = scope === 'all' ? '全部数据源（16份）'
    : ((SRS_DEMO.datasets.find(d => d.num === scope) || { name: scope }).name.slice(0, 16));
  const byId = {};
  itemsAll.forEach(it => { byId[it.id] = it; });
  const catCards = Object.keys(CST3).map(top => {
    const color = CST3_META[top];
    const subs = CST3[top].map(sub => {
      const [subName, ids] = sub;
      const items = ids.map(id => byId[id]).filter(Boolean);
      if (!items.length) return '';
      const nFind = items.reduce((a, b) => a + (b.n || 0), 0);
      const nFail = items.filter(i => i.status === 'fail').length;
      const nWarn = items.filter(i => i.status === 'warn').length;
      const rows = items.map((it, i) => '<tr><td>' + (i+1) + '</td>'
        + '<td><code style="font-size:10.5px">' + it.id + '</code></td>'
        + '<td>' + esc(it.name) + '</td>'
        + (it.n ? '<td><b style="color:' + (it.status === 'fail' ? 'var(--red)' : 'var(--orange)') + '">' + it.n + '</b></td>'
                : '<td class="muted">0</td>') + '</tr>').join('');
      return '<div style="margin-bottom:10px">'
        + '<div style="font-size:12px;font-weight:650;color:' + color + ';margin:6px 0 4px;display:flex;align-items:center;gap:6px">'
        + '<span style="width:7px;height:7px;border-radius:2px;background:' + color + '"></span>'
        + subName + ' <span class="tag" style="font-size:10px">' + items.length + '项'
        + (nFind ? ' · ' + nFind + '条发现' : '') + (nFail ? ' · ' + nFail + '确证' : '') + (nWarn ? ' · ' + nWarn + '可疑' : '')
        + '</span></div>'
        + '<div class="tbwrap"><table class="tb" style="font-size:11.5px"><thead><tr>'
        + '<th style="width:34px">序号</th><th style="width:80px">校验项</th><th>名称</th>'
        + '<th style="width:64px">发现</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
    }).join('');
    return '<div class="card"><div class="card-hd"><h3 style="color:' + color + '">' + top + '</h3></div>'
      + '<div class="card-bd">' + (subs || '<div class="small muted">无条目</div>') + '</div></div>';
  }).join('');
  const totalHtml = '<div class="stats" style="margin-bottom:14px">'
    + '<div class="stat b"><div class="k">校验项</div><div class="v">52</div></div>'
    + '<div class="stat g"><div class="k">通过</div><div class="v">' + agg.pass + '</div></div>'
    + '<div class="stat o"><div class="k">可疑</div><div class="v">' + agg.warn + '</div></div>'
    + '<div class="stat r"><div class="k">确证问题</div><div class="v">' + agg.fail + '</div></div>'
    + '<div class="stat y"><div class="k">发现总数</div><div class="v">' + agg.findings + '</div></div></div>';
  openModal(mask('<div class="modal w1000" style="max-width:96vw"><div class="m-hd">'
    + '<h3>一致性校验总报告 · ' + esc(scopeName3) + '</h3>'
    + '<span class="m-x" onclick="closeModal()">✕</span></div>'
    + '<div class="m-bd" style="background:#eef1f6;max-height:78vh;overflow-y:auto">'
    + totalHtml + catCards
    + '</div></div>'));
}

/* 无真实结果的数据集: 基于01/02口径生成确定性变体 */
function simCheck(num){
  const base = SRS_DEMO.checks[num <= '08' ? '01' : '02'];
  const seed = parseInt(num, 10) || 1;
  /* 配置树消费: 已保存配置的活跃子集 + findings_cap(级联解析) */
  const flat = _cstCfgFlat();
  const active = flat.rules.length ? new Set(flat.rules.map(r => r.rule_id)) : null;
  const cap = flat.global.findings_cap || 50;
  const items = base.items.map((it, i) => {
    let n = it.n;
    if (n > 0){ n = Math.max(1, Math.round(n * (0.5 + ((seed * 7 + i * 3) % 10) / 12))); }
    const status = it.mode === 'llm' ? 'llm' : (n === 0 ? 'pass' : (it.status === 'fail' ? 'fail' : 'warn'));
    return Object.assign({}, it, { n: n, status: status });
  }).filter(it => !active || active.has(it.id)).map(it => {
    if (it.n > cap){ it.n = cap; it.truncated = true; }
    return it;
  });
  const summary = { total: items.length, pass: 0, warn: 0, fail: 0, llm: 0 };
  items.forEach(it => summary[it.status]++);
  const categories = CST_CATS.map(c => {
    const ci = items.filter(i2 => i2.category === c);
    return { name: c, total: ci.length, pass: ci.filter(i2 => i2.status === 'pass').length,
      warn: ci.filter(i2 => i2.status === 'warn').length, fail: ci.filter(i2 => i2.status === 'fail').length,
      llm: ci.filter(i2 => i2.status === 'llm').length, findings: ci.reduce((a, b) => a + b.n, 0) };
  });
  return { ran_at: '2026-08-30T18:00:00', summary: summary, categories: categories, items: items };
}

  if (mod === 'KNW') return '规则';

function drawMmLinks(){
  const svg = document.querySelector('.mmlinks');
  const wrap = document.querySelector('.mmwrap');
  if (!svg || !wrap) return;
  const g = SRS_DEMO.graph_demo;
  const wr = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.scrollWidth); svg.setAttribute('height', wrap.scrollHeight);
  const R = el => { const r = el.getBoundingClientRect();
    return { x1: r.left - wr.left + r.width, y1: r.top - wr.top + r.height / 2,
             x2: r.left - wr.left, y2: r.top - wr.top + r.height / 2 }; };
  const bez = (a, b, color, w) => { const dx = Math.max(30, (b.x2 - a.x1) * 0.45);
    return '<path d="M ' + a.x1 + ' ' + a.y1 + ' C ' + (a.x1 + dx) + ' ' + a.y1 + ', ' + (b.x2 - dx) + ' ' + b.y2 + ', ' + b.x2 + ' ' + b.y2 + '" fill="none" stroke="' + color + '" stroke-width="' + w + '" opacity="0.75"/>'; };
  let out = '';
  const cEl = document.getElementById('mm-center');
  if (cEl) { const rc = R(cEl);
    document.querySelectorAll('.mment').forEach(el => { out += bez(rc, R(el), '#2563EB', 1.8); });
    MM_MODS.forEach(m => { const ge = document.getElementById('mm-grp-' + m[0]);
      if (ge) out += bez(rc, R(ge), m[2] + '99', 1.2); });
  }
  svg.innerHTML = out;
}

/* ---- 一致性校验 ---- */
/* 一致性校验项：校验模型生成的问答对中问题与答案语义是否匹配、问答逻辑是否准确，
   识别答非所问、答案无法对应问题等异常样本 */
const CST_TPL = [
  { t:'答非所问', d:'问题询问判定阈值，答案回答处置流程，答案未回应问题核心诉求', act:'剔除' },
  { t:'语义不匹配', d:'问题主体与答案主体不一致（问滑油压力，答排气温度）', act:'剔除' },
  { t:'问答逻辑不准确', d:'答案结论与问题前提相矛盾，推理链条不成立', act:'剔除' },
  { t:'答案无法对应问题', d:'答案内容过于宽泛，未包含问题所需的具体参数或条款依据', act:'剔除' },
  { t:'答案表述不规范', d:'答案存在术语不统一、分条编号缺失等表述问题', act:'规范表述后保留' }
];
/* 生成某一级分类的一致性校验结果。
   校验结论以 CAT_CST 预设为基准：预设 fail 的分类产生剔除类异常样本，
   预设 pass 的分类仅存在「规范表述后保留」类样本，异常数为 0。 */
function mkCatCst(catId){
  const arr = DB.datasets.filter(d => effCat(d.cat) === catId);
  const total = arr.length;
  const wantFail = (CAT_CST[catId] || 'pass') === 'fail';
  // 剔除类异常样本总数：不通过时取分类内数据集的约 30%，至少 1 条
  let left = wantFail ? Math.max(1, Math.round(total * 0.3)) : 0;
  const cut = CST_TPL.filter(c => c.act === '剔除');
  const items = CST_TPL.map(c => {
    if (c.act !== '剔除') return { t:c.t, d:c.d, act:c.act, n: total ? 1 + (total % 2) : 0 };
    // 剔除类样本在各异常类型间均分，余量给最后一项
    const idx = cut.indexOf(c), isLast = idx === cut.length - 1;
    const n = isLast ? left : Math.min(left, Math.floor(left / cut.length));
    left -= n;
    return { t:c.t, d:c.d, act:c.act, n };
  });
  const bad = items.filter(x => x.act === '剔除').reduce((a, b) => a + b.n, 0);
  return { st: bad > 0 ? 'fail' : 'pass', total, bad, items, time: now() };
}

function doGenDs(idStr){
  const ids = idStr.split(',');
  const ev = val('gdE') === '1';
  let n = 0;
  ids.forEach((qid, i) => {
    const q = DB.questions.find(x => x.id === qid); if (!q) return;
    q.ans = true;
    const score = ev ? 62 + ((DB.datasets.length * 7 + i * 11) % 38) : null;
    // 如果问题已有数据集，则更新数据集；否则创建新数据集
    const existingDs = DB.datasets.find(d => d.qid === qid);
    if (existingDs) {
      // 更新现有数据集：重新生成答案视为一次修订，版本号递增，保持原有类型
      existingDs.a = ansOf(q);
      existingDs.score = score;
      existingDs.evaled = ev;
      // 保持原有类型不变
      existingDs.time = now();
      existingDs.evalDetail = ev ? { acc: score, comp: score - 3, rel: score + 2, clr: score - 5, safe: 92 } : null;
      existingDs.ver = nextVer(existingDs.ver);
      existingDs.history.push({ ver: existingDs.ver, time: now(), by: '重新生成答案' });
    } else {
      // 创建新数据集：默认指令问答式
      const type = 'inst';
      DB.datasets.unshift({ id: uid('d'), qid, q: q.q, a: ansOf(q), cat: q.cat, src: q.src,
        origin: '智能体', score, ver:'V1.0', fixed:false, evaled: ev, type, time: now(),
        evalDetail: ev ? { acc: score, comp: score - 3, rel: score + 2, clr: score - 5, safe: 92 } : null,
        history: [{ ver:'V1.0', time: now(), by:'系统生成' }] });
    }
    n++;
  });
  S.quest.sel = []; closeModal(); render();
  toast('已生成 ' + n + ' 条答案', 'ok');
}

const scoreCls = s => s == null ? '' : (s >= 85 ? 'h' : (s >= 70 ? 'm' : 'l'));
/* ---- 数据集 5 分制评分：1 极差 / 2 较差 / 3 合格 / 4 良好 / 5 优秀 ---- */
const STAR_LV = { 1:'极差', 2:'较差', 3:'合格', 4:'良好', 5:'优秀' };
/* 百分制评分 → 5 分制 */
function to5(score){
  if (score == null) return null;
  if (score >= 90) return 5;
  if (score >= 80) return 4;
  if (score >= 70) return 3;
  if (score >= 60) return 2;
  return 1;
}
/* 分类一致性校验结果：以一级分类为单位整体校验，仅校验通过的分类才进入质量评估。
   科研生产方案设计数据（c2）校验不通过，故不展示任何评估信息 */
const CAT_CST = { c1:'pass', c2:'fail', c3:'pass', c4:'pass' };
function catCst(catId){ return (DB.catCst[catId] && DB.catCst[catId].st) || CAT_CST[catId] || 'wait'; }
function catCstTag(catId){
  return catCst(catId) === 'fail' ? '<span class="tag err">校验不通过</span>'
    : '<span class="tag ok">校验通过</span>';
}
/* 某分类下的数据集评分（取该分类已评分数据集的均分，换算为 5 分制） */
function catScore(catId){
  const arr = DB.datasets.filter(d => effCat(d.cat) === catId && d.score != null);
  if (!arr.length) return null;
  const avg = arr.reduce((a, d) => a + d.score, 0) / arr.length;
  return { star: to5(avg), avg: avg.toFixed(1), n: arr.length };
}
/* 分类评分徽标：如「5分 优秀」；未评分时显示待评估 */
function catScoreTag(catId){
  const s = catScore(catId);
  if (!s) return '<span class="tag wait">待评估</span>';
  const cls = s.star >= 5 ? 'ok' : (s.star >= 4 ? 'ok' : (s.star >= 3 ? 'wait' : 'err'));
  return '<span class="tag ' + cls + '">' + s.star + '分 ' + STAR_LV[s.star] + '</span>';
}
/* 分类评估状态：全部已评分=评估完成；部分已评分=评估中；无评分=待评估 */
function catEvalState(catId){
  const arr = DB.datasets.filter(d => effCat(d.cat) === catId);
  if (!arr.length) return '<span class="muted">—</span>';
  const scored = arr.filter(d => d.score != null).length;
  const evaling = arr.filter(d => d.score == null && d.evaled).length;
  if (scored === arr.length) return '<span class="tag ok">评估完成</span>';
  if (scored > 0 || evaling > 0) return '<span class="tag info">评估中</span>';
  return '<span class="tag wait">待评估</span>';
}
/* 质量评估以「一级分类」为单位整体进行：
   该分类下的数据集只要还有未评分的（评估尚未完成），整个分类都锁定编辑，
   待分类内全部数据集评分完成后方可编辑。 */
function catEvaling(catId){
  const arr = DB.datasets.filter(d => effCat(d.cat) === catId);
  if (!arr.length) return false;
  const scored = arr.filter(d => d.score != null).length;
  if (scored === arr.length) return false;          // 评估完成 → 可编辑
  return arr.some(d => d.evaled || d.score != null); // 已启动评估且未完成 → 锁定
}

/* ---- 数据集版本号规范 ----
   统一为三段式 V<主>.<次>.<修订>：新生成为 V1.0.0，每次修正（人工/自动）递增修订号。
   dsVer(v)：将任意历史写法（V1.0 / 1.0.2 / 空）归一化为三段式
   nextVer(v)：在归一化基础上递增最后一段修订号 */
function dsVer(v){
  const p = String(v || 'V1.0').replace(/^[Vv]/, '').split('.');
  while (p.length < 2) p.push('0');
  return 'V' + p.slice(0, 2).map(x => Number(x) || 0).join('.');
}
function nextVer(v){
  const p = dsVer(v).replace(/^V/, '').split('.').map(Number);
  p[1] += 1;
  return 'V' + p.join('.');
}
function saveDs(id){
  const d = DB.datasets.find(x => x.id === id);
  const q = val('deQ').trim(), a = val('deA').trim();
  if (!q || !a) return toast('问题与答案均不能为空','err');
  d.q = q; d.a = a; d.type = val('deT'); d.cat = val('deCat'); d.fixed = true;
  // 生成方式仅「系统生成」「人工修正」两种，修正说明单独记录、不拼入生成方式
  d.ver = nextVer(d.ver);
  d.history.push({ ver: d.ver, time: now(), by:'人工修正', note: val('deNote') || '' });
  const qq = DB.questions.find(x => x.id === d.qid); if (qq) qq.q = q;
  closeModal(); toast('修正完成，已生成新数据集版本 ' + d.ver, 'ok');
}

function mStartEval(){

/* 对某一级分类下全部数据集整体发起评估，生成一条评估轮次记录 */
function catEvalRun(catId){
  const arr = DB.datasets.filter(d => effCat(d.cat) === catId);
  if (!arr.length) return toast('该分类下暂无数据集','err');
  if (catCst(catId) !== 'pass') return toast('该分类一致性校验未通过，无法发起质量评估','err');
  const rounds = (DB.evalRounds || []).filter(r => r.cat === catId);
  const no = rounds.length + 1;
  // 分类内全部数据集统一评分
  arr.forEach((d, i) => {
    const s = 68 + ((i * 11 + no * 7) % 30);
    d.score = s; d.evaled = true;
    d.evalDetail = { acc:s, comp:Math.min(99,s+2), rel:Math.max(50,s-3), clr:Math.min(99,s+1), safe:Math.min(99,s+8) };
  });
  const avg = Math.round(arr.reduce((a, d) => a + d.score, 0) / arr.length);
  DB.evalRounds.push({ id: uid('er'), cat: catId, round: no, score: avg, st:'done', time: now() });
  render();
  toast('「' + catName(catId) + '」第 ' + no + ' 轮质量评估完成，评分 ' + to5(avg) + ' 分','ok');
}
/* 批量评估：对全部校验通过且有数据集的分类整体评估 */
function evalAllCats(){
  const list = topCats().filter(c => catCst(c.id) === 'pass'
    && DB.datasets.some(d => effCat(d.cat) === c.id));
  if (!list.length) return toast('暂无可评估的数据分类','err');
  confirmBox('批量质量评估', '将对 <b>' + list.length + '</b> 个校验通过的数据分类整体发起质量评估，是否继续？', () => {
    closeModal();
    list.forEach(c => {
      const arr = DB.datasets.filter(d => effCat(d.cat) === c.id);
      const no = (DB.evalRounds || []).filter(r => r.cat === c.id).length + 1;
      arr.forEach((d, i) => {
        const s = 68 + ((i * 11 + no * 7) % 30);
        d.score = s; d.evaled = true;
        d.evalDetail = { acc:s, comp:Math.min(99,s+2), rel:Math.max(50,s-3), clr:Math.min(99,s+1), safe:Math.min(99,s+8) };
      });
      const avg = Math.round(arr.reduce((a, d) => a + d.score, 0) / arr.length);
      DB.evalRounds.push({ id: uid('er'), cat: c.id, round: no, score: avg, st:'done', time: now() });
    });
    render(); toast('评估任务已发起','ok');
  });
}

function exportData(){
  // 导出范围：all = 全量（当前分类下全部查询结果），sel = 勾选的记录
  const scope = window.__dsExportScope || 'all';
  let arr = scope === 'sel' ? (S.ds.sel || []).map(id => DB.datasets.find(d => d.id === id)).filter(Boolean)
    : dsList();
  const types = Object.keys(DS_TYPE).filter(k => val('exT-' + k));
  const fmt = (document.querySelector('input[name=exf]:checked') || {}).value || 'JSON';
  const recs = [];
  arr.forEach(d => types.forEach(t => {
    // 指令问答式：instruction / input / output；多轮对话式：messages
    let o;
    if (t === 'inst') o = { instruction: d.q, input:'', output: d.a };
    else o = { messages:[{role:'system',content:'你是航空装备领域专业助手。'},{role:'user',content:d.q},{role:'assistant',content:d.a}] };
    Object.assign(o, { category: catName(effCat(d.cat)), source: d.src, version: d.ver });
    recs.push(o);
  }));
  let text = '', name = '微调数据集_' + today().replace(/-/g,'');
  if (fmt === 'JSONL'){ text = recs.map(r => JSON.stringify(r)).join('\n'); name += '.jsonl'; }
  else { text = JSON.stringify(recs, null, 2); name += '.json'; }
  return { text, name, recs, count: arr.length, types, fmt };
}

function saveDb(id){
  const n = val('dbN').trim(), h = val('dbH').trim(), d = val('dbD').trim(), u = val('dbU').trim(), w = val('dbW').trim();
  const t = val('dbT');
  // 必填字段校验
  if (!n) return toast('请填写配置名称','err');
  if (!h) return toast('请填写主机地址','err');
  if (!d) return toast('请填写数据库名','err');
  if (!u) return toast('请填写用户名','err');
  if (!w && !id) return toast('请填写密码','err');
  // 库表中文名映射校验：必填 + 不允许重名
  const maps = collectDbMaps();
  if (!maps.length) return toast('请先获取库表并生成中文名称映射','err');
  const blank = maps.filter(m => !m.cn);
  if (blank.length) return toast('以下库表未映射中文名称：' + blank.map(m=>m.tbl).join('、'),'err');
  const seen = {}, dupNames = [];
  maps.forEach(m => { if (seen[m.cn]) { if (dupNames.indexOf(m.cn) < 0) dupNames.push(m.cn); } else seen[m.cn] = 1; });
  if (dupNames.length) return toast('库表中文名称不允许重名：' + dupNames.join('、'),'err');
  // 与其他配置already占用的分类名去重
  const otherNames = [];
  DB.dbSources.forEach(x => { if (x.id !== id) (x.maps||[]).forEach(m => otherNames.push(m.cn)); });
  const conflict = maps.filter(m => otherNames.indexOf(m.cn) >= 0).map(m => m.cn);
  if (conflict.length) return toast('中文名称与已有配置重名：' + conflict.join('、'),'err');

  const scope = (document.querySelector('input[name=dbs]:checked')||{}).value || 'all';
  const o = { n, type:t, host: h, port: val('dbP'), db: d, user: u, scope,
    tables: scope === 'all' ? '全部库表' : (val('dbTbl').trim() || '全部库表'),
    maps, time: now() };
  if (id) Object.assign(DB.dbSources.find(x => x.id === id), o);
  else DB.dbSources.push(Object.assign({ id: uid('db') }, o));
  syncDbCats();
  window.__dbMaps = null;
  closeModal(); toast(id ? '配置已更新，数据分类已同步' : '数据库连接配置已新增，数据分类已同步','ok');
}
/* 按库表映射同步《结构化数据接入》的数据分类 */
function syncDbCats(){
  const cats = [], data = {};
  DB.dbSources.forEach(d => (d.maps||[]).forEach(m => {
    if (!m.cn) return;
    const id = 'o_' + m.tbl;
    const prev = DB.onlineCats.find(c => c.id === id || c.n === m.cn);
    // cat 归入映射所选的统一数据分类，供接入模块按分类归集；时间用于清单展示
    cats.push({ id, n:m.cn, d:'数据库直连接入（' + d.n + ' · ' + m.tbl + '）',
      src:'数据库直连（' + d.type + '）', cat: m.cat || (prev && prev.cat) || 'c4',
      inTime: (prev && prev.inTime) || now(), upTime: now() });
    // 已有同名分类的数据沿用，否则给出空集
    const old = DB.onlineCats.find(c => c.n === m.cn);
    data[id] = old ? (DB.online[old.id] || []) : [];
  }));
  if (!cats.length) return;
  // 保留原始两类演示数据，追加新映射产生的分类
  const keep = DB.onlineCats.filter(c => c.id === 'o1' || c.id === 'o2');
  const merged = keep.concat(cats.filter(c => !keep.some(k => k.n === c.n)));
  DB.onlineCats = merged;
  merged.forEach(c => { if (!DB.online[c.id]) DB.online[c.id] = data[c.id] || []; });
  merged.forEach(c => { if (!DB.onlinePre[c.id]) DB.onlinePre[c.id] = { done:false, abns:[] }; });
}

function saveDesenRule(id){
  const field = val('desenField').trim();
  const type = val('desenType');
  if (!field) return toast('请输入字段名称','err');
  const rule = { id: id || 'dr' + Date.now(), field, type };
  if (type === 'replace') {
    rule.replaceWith = val('desenReplace').trim();
    if (!rule.replaceWith) return toast('请输入替换内容','err');
  } else if (type === 'mask') {
    rule.maskStart = Number(val('desenMaskStart'));
    rule.maskEnd = Number(val('desenMaskEnd'));
    if (rule.maskStart < 0 || rule.maskEnd <= rule.maskStart) return toast('请正确设置屏蔽位置','err');
  } else if (type === 'encrypt') {
    rule.encryptAll = $('desenEncAll').checked;
    if (!rule.encryptAll) {
      rule.encryptStart = Number(val('desenEncStart'));
      rule.encryptEnd = Number(val('desenEncEnd'));
      if (rule.encryptStart < 0 || rule.encryptEnd <= rule.encryptStart) return toast('请正确设置加密位置','err');
    }
  }
  if (!DB.desenRules) DB.desenRules = [];
  if (id) {
    const idx = DB.desenRules.findIndex(x => x.id === id);
    if (idx >= 0) DB.desenRules[idx] = rule;
  } else {
    DB.desenRules.push(rule);
  }
  closeModal(); toast(id ? '已更新' : '已新增','ok'); render();
}

function _cstCfgValidate(tree){
  if (!tree || !Array.isArray(tree.layers)) return 'config必须为含layers数组的对象';
  if (tree.layers.map(l => l.name).join(',') !== CST_LAYER_NAMES.join(','))
    return '层必须固定为: ' + CST_LAYER_NAMES.join('/');
  const spec = _cstCfgSpec();
  const seen = new Set();
  for (const l of tree.layers){
    for (const it of l.items || []){
      if (!it.id || !it.name) return '条目缺少id或名称';
      if (seen.has(it.id)) return '条目id重复: ' + it.id;
      seen.add(it.id);
      const sp = spec[it.id] || it.paramSpec;
      if (sp && it.params){
        for (const k of Object.keys(it.params)){
          if (!(k in sp)) return '条目[' + it.id + ']: 未声明的参数「' + k + '」';
          const d = sp[k];
          if (d.type === 'list' && !Array.isArray(it.params[k]))
            return '条目[' + it.id + ']: 参数「' + k + '」必须是数组';
          if ((d.type === 'int' || d.type === 'float') && isNaN(Number(it.params[k])))
            return '条目[' + it.id + ']: 参数「' + k + '」必须是' + d.type;
        }
      }
    }
  }

function _cstCfgCollectRows(){

  _cstCfgParamRows = rows.map(row => ({
    k: row.querySelector('.prm-k').value.trim(),

    p: row.querySelector('.prm-p').value.trim()}));
}
function _cstCfgParseDefault(t, s){
  s = String(s == null ? '' : s).trim();
  if (t === 'int') return parseInt(s, 10) || 0;
  if (t === 'float') return parseFloat(s) || 0;
  if (t === 'list') return s ? s.split(/[,，、]/).map(x => x.trim()).filter(Boolean) : [];

function _cstCfgRowsToSpec(){

  }

  const isBuiltin = CST_BUILTIN_SCENES.some(b => b.id === id);
  confirmBox('删除场景', '「' + esc(card ? card.name : id) + '」及其配置将被删除'
    + (isBuiltin ? '（可通过「恢复内置场景」还原）' : '') + '，确认？', function(){
    st.cards = st.cards.filter(c => c.id !== id);

function cstCfgRestoreBuiltins(){
  const st = S.cstCfg;
  let n = 0;
  CST_BUILTIN_SCENES.forEach(b => {
    if (!st.cards.some(c => c.id === b.id)){
      st.cards.push({id: b.id, name: b.name, desc: b.desc,
        available: true, custom: false, n_rules: b.n_rules});
      n++;
    }
    if (!st.savedTrees[b.id]) st.savedTrees[b.id] = _cstCfgDefaultTree(b.id);
  });
  render();
  toast('已恢复 ' + n + ' 个内置场景', 'ok');

        + (!r || r.items.includes(it.k) ? ' checked' : '') + '></td>'
      + '<td class="nowrap"><b>' + esc(it.n) + '</b></td>'
      + '<td class="small muted">' + esc(it.d) + '</td>'
      + '<td><input class="inp" id="qaw-' + it.k + '" style="width:100px" value="'
        + (r ? (r.w[it.k] || 0) : dw) + '"></td></tr>').join('')
    + '</tbody></table></div></div></div>'
    + '<div class="frow"><div class="fg" style="flex:1"><label><span class="req">*</span>合格分数线（0-100）</label>'
      + '<input class="inp" id="qaP" value="' + (r ? r.pass : 75) + '" placeholder="如 75"></div>'
    + '<div class="fg" style="flex:1"><label>&nbsp;</label>'
      + '<label class="chk"><input type="checkbox" id="qaOn"' + (r && r.on ? ' checked' : '') + '> 保存后立即启用该配置</label>'
      + '<div class="hint">启用本配置后原启用配置将自动停用。</div></div></div>'
    + '</div><div class="m-ft"><button class="btn" onclick="closeModal()">取消</button>'
    + '<button class="btn pri" onclick="saveQaMetric(' + (r ? '\'' + r.id + '\'' : '') + ')">保存</button></div></div>'));
}
function saveQaMetric(id){
  const n = val('qaN').trim(); if (!n) return toast('请输入配置名称','err');
  const items = QA_ITEMS.filter(it => val('qai-' + it.k)).map(it => it.k);
  if (!items.length) return toast('请至少启用一个评估指标','err');
  const w = {}; items.forEach(k => w[k] = Number(val('qaw-' + k)) || 0);
  const sum = items.reduce((a, k) => a + w[k], 0);
  if (sum !== 100) return toast('各指标权重之和须为 100%，当前为 ' + sum + '%','err');
  const pass = Number(val('qaP'));
  if (!(pass >= 0 && pass <= 100)) return toast('合格分数线须为 0-100 之间的数值','err');
  const on = !!val('qaOn');
  const o = { n, items, w, pass, d: val('qaD').trim() || '自定义质量评估指标配置', time: now() };
  if (id){ const r = DB.qaMetrics.find(x => x.id === id); Object.assign(r, o); if (on) enableQaMetric(id, true); }
  else { const r = { id: uid('qa'), on:false, sys:false }; Object.assign(r, o); DB.qaMetrics.push(r);
    if (on) enableQaMetric(r.id, true); }
  closeModal(); render(); toast('已保存质量评估指标配置','ok');
}
function enableQaMetric(id, quiet){
  DB.qaMetrics.forEach(r => r.on = (r.id === id));
  if (!quiet){ render(); toast('已启用该质量评估指标配置，原启用配置自动停用','ok'); }
}
function delQaMetric(id){
  const r = DB.qaMetrics.find(x => x.id === id);
  if (r.sys) return toast('默认配置不支持删除','err');
  if (r.on) return toast('启用中的配置不可删除，请先启用其他配置','err');
  confirmBox('删除指标配置', '确认删除「' + esc(r.n) + '」？', () => {
    DB.qaMetrics = DB.qaMetrics.filter(x => x.id !== id); closeModal(); render(); toast('已删除','ok'); });
}

/* ============ 生成清洗报告（doc 格式，与系统其他报告一致：先预览再下载） ============ */
function genCleanReport(taskId){
  const t = DB.cleanTasks.find(x => x.id === taskId);
  if (!t || t.st !== 'done') return toast('任务未完成，无法生成报告','err');

  const recs = cleanRecords(t);
  const totalBefore = recs.reduce((sum, r) => sum + ((r.before || '').length), 0);
  const totalAfter = recs.reduce((sum, r) => sum + ((r.after || '').length), 0);
  const reduction = totalBefore ? ((totalBefore - totalAfter) / totalBefore * 100).toFixed(1) : '0.0';

  // 清洗处理明细：按任务实际启用的清洗规则统计，保证同一任务多次生成结果一致
  const issues = t.rules.map((k, i) => {
    const info = RULE_INFO[k] || { n: k, d: '', grp: '—' };
    const hit = 3 + ((t.total + i * 17) % 28);
    return { grp: info.grp, n: info.n, d: info.d, hit,
      del: Math.floor(hit * 0.35), fix: hit - Math.floor(hit * 0.35) };
  });
  const totalHit = issues.reduce((a, b) => a + b.hit, 0);
  const totalDel = issues.reduce((a, b) => a + b.del, 0);
  const totalFix = issues.reduce((a, b) => a + b.fix, 0);

  // Word-compatible HTML 报告体（inline CSS）
  const html = '<div style="font-family:Microsoft YaHei,Arial;padding:20px;max-width:900px;margin:0 auto">'
    + '<h1 style="color:#1d2939;border-bottom:3px solid #3b6dff;padding-bottom:12px;font-size:24px">📊 数据清洗报告</h1>'
    + '<table style="width:100%;margin:20px 0;border-collapse:collapse"><tr>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;background:#f9fafb"><b>任务名称</b></td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec">' + esc(t.n) + '</td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;background:#f9fafb"><b>清洗版本</b></td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec">' + t.ver + '</td></tr><tr>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;background:#f9fafb"><b>生成时间</b></td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec">' + now() + '</td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;background:#f9fafb"><b>清洗状态</b></td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec">✓ 已完成</td></tr></table>'

    + '<h2 style="color:#344054;margin-top:28px;font-size:18px;border-left:4px solid #3b6dff;padding-left:10px">一、清洗概览</h2>'
    + '<table style="width:100%;border-collapse:collapse;margin:12px 0"><tr>'
    + '<td style="padding:16px;border:1px solid #e4e7ec;text-align:center;background:#f9fafb">'
    + '<div style="color:#667085;font-size:13px">清洗数据总量</div><div style="color:#1d2939;font-size:28px;font-weight:600;margin-top:6px">' + recs.length + '<span style="font-size:14px;color:#98a2b3"> 条</span></div></td>'
    + '<td style="padding:16px;border:1px solid #e4e7ec;text-align:center;background:#f9fafb">'
    + '<div style="color:#667085;font-size:13px">数据压缩率</div><div style="color:#1d2939;font-size:28px;font-weight:600;margin-top:6px">' + reduction + '<span style="font-size:14px;color:#98a2b3"> %</span></div></td></tr><tr>'
    + '<td style="padding:16px;border:1px solid #e4e7ec;text-align:center;background:#f9fafb">'
    + '<div style="color:#667085;font-size:13px">清洗前字符数</div><div style="color:#1d2939;font-size:28px;font-weight:600;margin-top:6px">' + totalBefore.toLocaleString() + '</div></td>'
    + '<td style="padding:16px;border:1px solid #e4e7ec;text-align:center;background:#f9fafb">'
    + '<div style="color:#667085;font-size:13px">清洗后字符数</div><div style="color:#1d2939;font-size:28px;font-weight:600;margin-top:6px">' + totalAfter.toLocaleString() + '</div></td></tr></table>'

    + '<h2 style="color:#344054;margin-top:28px;font-size:18px;border-left:4px solid #3b6dff;padding-left:10px">二、数据质量改进</h2>'
    + '<table style="width:100%;border-collapse:collapse;margin:12px 0"><thead><tr style="background:#f9fafb">'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:left">问题分类</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:left">规则名称</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:80px">检出</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:80px">删除</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:80px">修正</th></tr></thead><tbody>'
    + issues.map(r => '<tr><td style="padding:8px;border:1px solid #e4e7ec">' + esc(r.grp) + '</td>'
      + '<td style="padding:8px;border:1px solid #e4e7ec">' + esc(r.n) + '</td>'
      + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + r.hit + '</td>'
      + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + r.del + '</td>'
      + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + r.fix + '</td></tr>').join('')
    + '<tr style="background:#f0f4ff;font-weight:600"><td colspan="2" style="padding:8px;border:1px solid #e4e7ec">合计</td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + totalHit + '</td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + totalDel + '</td>'
    + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + totalFix + '</td></tr></tbody></table>'

    + '<h2 style="color:#344054;margin-top:28px;font-size:18px;border-left:4px solid #3b6dff;padding-left:10px">三、清洗明细（前20条）</h2>'
    + '<table style="width:100%;border-collapse:collapse;margin:12px 0"><thead><tr style="background:#f9fafb">'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:50px">序号</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:left">数据名称</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:100px">清洗前（字符）</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:100px">清洗后（字符）</th>'
    + '<th style="padding:10px;border:1px solid #e4e7ec;text-align:center;width:90px">压缩率</th></tr></thead><tbody>'
    + recs.slice(0, 20).map((r, i) => {
        const bLen = (r.before || '').length;
        const aLen = (r.after || '').length;
        const rate = bLen ? ((bLen - aLen) / bLen * 100).toFixed(1) : '0.0';
        return '<tr><td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + (i + 1) + '</td>'
          + '<td style="padding:8px;border:1px solid #e4e7ec">' + esc(r.name) + (r.sliceNo ? ' - 切片' + r.sliceNo : '') + '</td>'
          + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + bLen.toLocaleString() + '</td>'
          + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + aLen.toLocaleString() + '</td>'
          + '<td style="padding:8px;border:1px solid #e4e7ec;text-align:center">' + rate + '%</td></tr>';
      }).join('')
    + (recs.length > 20 ? '<tr><td colspan="5" style="padding:8px;border:1px solid #e4e7ec;text-align:center;color:#667085">... 共 ' + recs.length + ' 条，此处展示前 20 条</td></tr>' : '')
    + '</tbody></table>'

    + '<h2 style="color:#344054;margin-top:28px;font-size:18px;border-left:4px solid #3b6dff;padding-left:10px">四、总结</h2>'
    + '<p style="line-height:1.8;color:#344054">本次数据清洗任务已成功完成，共处理 <b>' + recs.length + '</b> 条数据记录。'
    + '通过自动化清洗流程，有效处理了数据质量问题（检出 <b>' + totalHit + '</b> 处，删除 <b>' + totalDel + '</b> 处，修正 <b>' + totalFix + '</b> 处），'
    + '数据总字符数从 <b>' + totalBefore.toLocaleString() + '</b> 字符压缩至 <b>' + totalAfter.toLocaleString() + '</b> 字符，'
    + '压缩率达到 <b>' + reduction + '%</b>，显著提升了数据质量和可用性。</p>'
    + '<p style="line-height:1.8;color:#344054">清洗后的数据版本为 <b>' + t.ver + '</b>，可用于后续的问题生成和微调数据集构建流程。</p>'
    + '<div style="margin-top:40px;padding-top:20px;border-top:1px solid #e4e7ec;color:#667085;font-size:12px;text-align:center">'
    + '本报告由微调数据集构建平台自动生成 · ' + now() + '</div></div>';

  // 使用 Word 格式下载
  download('数据清洗报告_' + t.n + '_' + t.ver + '.doc', html);
}

/* ============ 启动 ============ */
render();

</script>
</body>
</html>
