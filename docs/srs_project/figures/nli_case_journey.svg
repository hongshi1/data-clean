<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
  </defs>
  <style>
    .step{fill:#ede7f6;stroke:#5e35b1;stroke-width:1.5}
    .doc{fill:#ffffff;stroke:#78909c;stroke-width:1}
    .claim{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5}
    .res{fill:#e8f5e9;stroke:#2e7d32;stroke-width:2}
    .t1{font-size:13px;font-weight:bold;fill:#263238}
    .t2{font-size:12px;fill:#37474f}
    .t3{font-size:11px;fill:#546e7a}
    .mono{font-size:11px;fill:#1a237e}
  </style>

  <text x="480" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#263238">一条真实分歧的复核旅程（1_001对·词法误报消化实例）</text>
  <text x="480" y="48" text-anchor="middle" font-size="12" fill="#607d8b">从词法比对的"假警报"到NLI的正确复核——每一步的输入输出</text>

  <!-- Step 1: 分歧发现 -->
  <rect x="30" y="66" width="900" height="128" class="step" rx="10"/>
  <text x="60" y="94" class="t1" fill="#4527a0">① 分歧发现（词法比对）</text>

  <rect x="60" y="106" width="410" height="70" class="doc"/>
  <text x="76" y="128" class="t3">表格侧（能力表, table.csv）</text>
  <text x="76" y="148" class="t2">「半结构化数据源引接 / ZZSJHQZHFW-GN-SJHQ-BJGHSJGJ-BJGHSJYYJ」</text>
  <text x="76" y="166" class="t3">ID前缀恢复层级: 结构化/半结构化/非结构化/流式 各含子功能</text>

  <rect x="490" y="106" width="410" height="70" class="doc"/>
  <text x="506" y="128" class="t3">图侧（Visio锚点, 13节点）</text>
  <text x="506" y="148" class="t2">节点「半结构化数据源引接」（存在！）</text>
  <text x="506" y="166" class="t3">但词法匹配分 0.45 &lt; 阈值0.5（图上文字渲染截断干扰）</text>

  <rect x="60" y="112" width="0" height="0"/>
  <text x="480" y="188" text-anchor="middle" class="t2" fill="#c62828" font-weight="bold">产出分歧：「表格项『半结构化数据源引接』在图中无匹配」（词法假警报）</text>

  <!-- Step 2: 声明构造 -->
  <line x1="480" y1="194" x2="480" y2="220" stroke="#455a64" stroke-width="2" marker-end="url(#a4)"/>
  <text x="500" y="212" class="t3">分歧驱动声明构造（按分歧类型TABLE_ITEM_MISSING路由）</text>

  <rect x="30" y="224" width="900" height="180" class="claim" rx="10"/>
  <text x="60" y="250" class="t1" fill="#0d47a1">② 闭世界声明对构造</text>

  <rect x="60" y="262" width="840" height="60" class="doc"/>
  <text x="76" y="284" class="t3">前提（表格侧声明——从κ_T层级表构造）</text>
  <text x="76" y="306" class="mono">「能力表规定，『半结构化数据源引接』是『半结构化数据归集』的子功能」</text>

  <rect x="60" y="330" width="840" height="64" class="doc"/>
  <text x="76" y="352" class="t3">假设（图侧声明——锚点13节点闭世界枚举）</text>
  <text x="76" y="372" class="mono">「图中显示，本图共包含13个节点，包括：数据获取、流式数据归集、结构化数据归集任务制定、</text>
  <text x="76" y="388" class="mono">…半结构化数据源引接、…，除此之外没有其他节点」</text>
  <text x="620" y="352" class="t3" fill="#1b5e20">↑ 截断节点经离散子序列对齐恢复实体名</text>

  <!-- Step 3: NLI推理 -->
  <line x1="480" y1="404" x2="480" y2="430" stroke="#455a64" stroke-width="2" marker-end="url(#a4)"/>
  <text x="500" y="422" class="t3">本地mDeBERTa双向推理</text>

  <rect x="30" y="434" width="900" height="98" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" rx="10"/>
  <text x="60" y="460" class="t1" fill="#4a148c">③ NLI双向判定</text>
  <rect x="60" y="472" width="410" height="46" class="doc"/>
  <text x="265" y="492" text-anchor="middle" class="t2">正向（前提→假设）: <tspan fill="#2e7d32" font-weight="bold">蕴含</tspan>（图节点清单含该实体）</text>
  <text x="265" y="510" text-anchor="middle" class="t3">矛盾概率 = 0.02</text>
  <rect x="490" y="472" width="410" height="46" class="doc"/>
  <text x="695" y="492" text-anchor="middle" class="t2">逆向（假设→前提）: <tspan fill="#2e7d32" font-weight="bold">中立</tspan></text>
  <text x="695" y="510" text-anchor="middle" class="t3">矛盾概率 = 0.01</text>

  <!-- Step 4: 结果 -->
  <line x1="480" y1="532" x2="480" y2="558" stroke="#455a64" stroke-width="2" marker-end="url(#a4)"/>

  <rect x="130" y="562" width="700" height="64" class="res" rx="10"/>
  <text x="480" y="588" text-anchor="middle" class="t1" fill="#1b5e20">④ 复核结论：非矛盾 → 该分歧为引擎误报（compiler_bug）✓</text>
  <text x="480" y="612" text-anchor="middle" class="t2">与银标裁决一致（该条银标=compiler_bug）· 此类误报NLI共消化100/110条=91.7%，本地GPU共3.7秒</text>
</svg>
