  <rect x="475" y="160" width="170" height="50" rx="6" fill="#fff" stroke="#e08a2b"/>
  <text x="485" y="178" font-size="11" font-weight="600" fill="#9a5a10">Phrase-grounded (MICCAI'25)</text>
  <text x="485" y="193" font-size="10" fill="#666">胸片报告短语级事实检查</text>
  <text x="485" y="205" font-size="10" fill="#888">相关系数0.997</text>
  <rect x="475" y="220" width="170" height="50" rx="6" fill="#fff" stroke="#e08a2b"/>
  <text x="485" y="238" font-size="11" font-weight="600" fill="#9a5a10">ABE-CLIP (2025)</text>
