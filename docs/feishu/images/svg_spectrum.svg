  <text x="265" y="178" font-size="11" font-weight="600" fill="#1f4e9e">DisCoCLIP (2025)</text>
  <text x="265" y="193" font-size="10" fill="#666">CCG句法解析+张量网络</text>
  <text x="265" y="205" font-size="10" fill="#888">属性+9%, 关系+4%</text>
  <rect x="255" y="220" width="170" height="50" rx="6" fill="#fff" stroke="#4a7fd6"/>
  <text x="265" y="238" font-size="11" font-weight="600" fill="#1f4e9e">NeuroSymb-MRG (2026)</text>
  <text x="265" y="253" font-size="10" fill="#666">神经符号溯因推理</text>
  <text x="265" y="265" font-size="10" fill="#888">逻辑推理链验证</text>
  <rect x="255" y="280" width="170" height="50" rx="6" fill="#fff" stroke="#4a7fd6"/>
  <text x="265" y="298" font-size="11" font-weight="600" fill="#1f4e9e">COCO-Tree (EMNP 2025)</text>
  <text x="265" y="313" font-size="10" fill="#666">神经符号概念树</text>
  <text x="265" y="325" font-size="10" fill="#888">提升5-10%</text>
  <rect x="255" y="340" width="170" height="44" rx="6" fill="#fff" stroke="#4a7fd6"/>
  <text x="265" y="358" font-size="11" font-weight="600" fill="#1f4e9e">CAPTION (2020)</text>
  <text x="265" y="373" font-size="10" fill="#666">POS标签+名词验证</text>
  <rect x="255" y="390" width="170" height="80" rx="6" fill="#d4e9ff" stroke="#4a7fd6" stroke-dasharray="4,2"/>
  <text x="265" y="408" font-size="10" font-weight="600" fill="#1f4e9e">擅长检测：</text>
  <text x="265" y="423" font-size="10" fill="#444">✓ C4 实体缺失</text>
  <text x="265" y="438" font-size="10" fill="#444">✓ C6 属性矛盾</text>
