  <text x="925" y="193" font-size="10" fill="#666">TPR 99.9%, FPR 2.75%</text>
  <rect x="915" y="212" width="155" height="44" rx="6" fill="#fff" stroke="#c63a3a"/>
  <text x="925" y="230" font-size="11" font-weight="600" fill="#7a1a1a">FAMDR (AAAI 2026)</text>
