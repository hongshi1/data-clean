  <rect x="35" y="390" width="170" height="80" rx="6" fill="#d4edda" stroke="#2ba85e" stroke-dasharray="4,2"/>
  <text x="45" y="408" font-size="10" font-weight="600" fill="#1a6e3a">擅长检测：</text>
  <text x="45" y="423" font-size="10" fill="#444">✓ C8 否定矛盾</text>
  <text x="45" y="438" font-size="10" fill="#444">✓ C9 内部矛盾</text>
  <text x="45" y="453" font-size="10" fill="#444">✓ C5 实体多余</text>
  <text x="45" y="463" font-size="10" fill="#444">△ C1 完全错配(CLIP)</text>

