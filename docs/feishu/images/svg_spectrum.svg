  <text x="470" y="605" font-size="16" fill="#666">→</text>
  <text x="560" y="605" text-anchor="middle" font-size="12" fill="#e08a2b" font-weight="600">③细粒度 定位诊断</text>
  <text x="690" y="605" font-size="16" fill="#666">→</text>
  <text x="780" y="605" text-anchor="middle" font-size="12" fill="#d4a017" font-weight="600">④语义级 语义验证</text>
