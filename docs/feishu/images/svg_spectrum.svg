  <rect x="915" y="264" width="155" height="44" rx="6" fill="#fff" stroke="#c63a3a"/>
  <text x="925" y="282" font-size="11" font-weight="600" fill="#7a1a1a">CheXagent (2024)</text>
  <text x="925" y="297" font-size="10" fill="#666">省36%时间</text>
  <rect x="915" y="316" width="155" height="44" rx="6" fill="#fff" stroke="#c63a3a"/>
  <text x="925" y="334" font-size="11" font-weight="600" fill="#7a1a1a">CLIP/CheXzero</text>
  <text x="925" y="349" font-size="10" fill="#666">零样本接近监督</text>
  <rect x="915" y="370" width="155" height="80" rx="6" fill="#fce4e4" stroke="#c63a3a" stroke-dasharray="4,2"/>
  <text x="925" y="388" font-size="10" font-weight="600" fill="#7a1a1a">擅长检测：</text>
  <text x="925" y="403" font-size="10" fill="#444">△ 所有类型（泛化）</text>
  <text x="925" y="418" font-size="10" fill="#444">✗ 不解释为什么</text>

  <!-- 底部：Pipeline箭头 -->
  <rect x="20" y="560" width="1060" height="60" rx="10" fill="#f0f0f0" stroke="#999"/>
  <text x="550" y="585" text-anchor="middle" font-size="14" font-weight="700" fill="#333">推荐五层混合Pipeline：每层处理前一层未决样本</text>
  <text x="120" y="605" text-anchor="middle" font-size="12" fill="#2ba85e" font-weight="600">①规则级 快速过滤80%</text>
