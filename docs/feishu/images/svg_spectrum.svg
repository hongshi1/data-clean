  <text x="340" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">② 语法级</text>
  <text x="340" y="130" text-anchor="middle" font-size="11" fill="#1f4e9e">分析句子结构，拆解"属性-对象-关系"</text>
  <text x="340" y="146" text-anchor="middle" font-size="10" fill="#4a6d9e">精确结构对应 · 可解释推理链</text>
