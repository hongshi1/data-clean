<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" font-family="PingFang SC,Microsoft YaHei,sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1ff"/><stop offset="1" stop-color="#bbdefb"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4e6"/><stop offset="1" stop-color="#ffe2c2"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3cd"/><stop offset="1" stop-color="#ffeaa7"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8d7da"/><stop offset="1" stop-color="#f5c2c7"/></linearGradient>
  </defs>
  <rect width="1100" height="900" fill="#fafbfc"/>

  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#222">图文不一致性检测：五层技术谱系全景图</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#888">从左到右：抽象度递减 ↓ · 精确度递增 ↑ · 速度递增 ↑ · 可解释性递增 ↑</text>

  <!-- 五层主框 -->
  <!-- Layer 1: 规则级 -->
  <rect x="20" y="75" width="200" height="780" rx="14" fill="url(#g1)" stroke="#2ba85e" stroke-width="2"/>
  <rect x="30" y="85" width="180" height="32" rx="6" fill="#2ba85e"/>
  <text x="120" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">① 规则级</text>
  <text x="120" y="130" text-anchor="middle" font-size="11" fill="#1a6e3a">人工定义"什么算冲突"</text>
  <text x="120" y="146" text-anchor="middle" font-size="10" fill="#4a8a5a">最快 · 最透明 · 无需GPU</text>
  <!-- 方法卡片 -->
  <rect x="35" y="160" width="170" height="50" rx="6" fill="#fff" stroke="#2ba85e"/>
  <text x="45" y="178" font-size="11" font-weight="600" fill="#1a6e3a">三态冲突矩阵</text>
  <text x="45" y="193" font-size="10" fill="#666">AI概率×文本四态→5类冲突</text>
  <text x="45" y="205" font-size="10" fill="#888">62冲突/20样本</text>
  <rect x="35" y="220" width="170" height="50" rx="6" fill="#fff" stroke="#2ba85e"/>
  <text x="45" y="238" font-size="11" font-weight="600" fill="#1a6e3a">CheXpert ngrex规则</text>
  <text x="45" y="253" font-size="10" fill="#666">依存句法+60条图规则</text>
  <text x="45" y="265" font-size="10" fill="#888">κ>0.6</text>
  <rect x="35" y="280" width="170" height="44" rx="6" fill="#fff" stroke="#2ba85e"/>
  <text x="45" y="298" font-size="11" font-weight="600" fill="#1a6e3a">知识库规则(L1/L2/L3)</text>
  <text x="45" y="313" font-size="10" fill="#666">阈值规则引擎</text>
  <rect x="35" y="334" width="170" height="44" rx="6" fill="#fff" stroke="#2ba85e"/>
  <text x="45" y="352" font-size="11" font-weight="600" fill="#1a6e3a">LLM+代码Guard</text>
  <text x="45" y="367" font-size="10" fill="#666">语义判定+数值核验</text>
