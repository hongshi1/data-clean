  <text x="990" y="605" text-anchor="middle" font-size="12" fill="#c63a3a" font-weight="600">⑤模型级 兜底</text>

  <!-- 底部：9类冲突对应最佳层 -->
  <rect x="20" y="640" width="1060" height="220" rx="10" fill="#fff" stroke="#ddd"/>
  <text x="40" y="665" font-size="14" font-weight="700" fill="#333">9类冲突 × 最佳检测层 映射表</text>
  <text x="40" y="690" font-size="11" fill="#2ba85e" font-weight="600">C1完全错配→①规则级(CLIP粗筛)</text>
  <text x="280" y="690" font-size="11" fill="#2ba85e" font-weight="600">C2配对混淆→①规则级(时戳校验)</text>
  <text x="520" y="690" font-size="11" fill="#c63a3a" font-weight="600">C3标签错误→⑤模型级(DeFT)</text>
  <text x="760" y="690" font-size="11" fill="#4a7fd6" font-weight="600">C4实体缺失→②语法级</text>
  <text x="40" y="715" font-size="11" fill="#2ba85e" font-weight="600">C5实体多余→①规则级(冲突矩阵)</text>
  <text x="280" y="715" font-size="11" fill="#e08a2b" font-weight="600">C6属性矛盾→③细粒度(ABE-CLIP)</text>
  <text x="520" y="715" font-size="11" fill="#4a7fd6" font-weight="600">C7关系矛盾→②语法级+③细粒度</text>
  <text x="760" y="715" font-size="11" fill="#2ba85e" font-weight="600">C8否定矛盾→①规则级+④语义级</text>
  <text x="40" y="740" font-size="11" fill="#2ba85e" font-weight="600">C9内部矛盾→①规则级+②语法级</text>

  <text x="40" y="775" font-size="13" font-weight="700" fill="#333">关键基准</text>
  <text x="40" y="797" font-size="11" fill="#555">CrossCheck-Bench(AAAI 2026): 15k矛盾QA, 7种原子能力, 直接评估矛盾检测</text>
  <text x="40" y="815" font-size="11" fill="#555">HalluCXR(2026): 856张MIMIC-CXR, 8类幻觉分类, 61.9-82.3%输出含幻觉</text>
  <text x="40" y="833" font-size="11" fill="#555">SNLI-VE(2019): 56万图文对, 视觉蕴含基准</text>
  <text x="40" y="851" font-size="11" fill="#555">FOIL-COCO(2017): 单词级冲突检测基准 · ARO(2023): 属性/关系/顺序基准 · SugarCrepe(2023): 组合性基准</text>
