  <rect x="475" y="340" width="170" height="50" rx="6" fill="#fff" stroke="#e08a2b"/>
  <text x="485" y="358" font-size="11" font-weight="600" fill="#9a5a10">SpatialReward (2026)</text>
  <text x="485" y="373" font-size="10" fill="#666">可验证空间关系奖励</text>
  <rect x="475" y="400" width="170" height="44" rx="6" fill="#fff" stroke="#e08a2b"/>
  <text x="485" y="418" font-size="11" font-weight="600" fill="#9a5a10">Counterfactual (2026)</text>
  <text x="485" y="433" font-size="10" fill="#666">反事实实体扰动</text>
  <rect x="475" y="455" width="170" height="80" rx="6" fill="#ffe8d0" stroke="#e08a2b" stroke-dasharray="4,2"/>
