  <text x="705" y="298" font-size="11" font-weight="600" fill="#7a5a00">CoEV (MICCAI 2026)</text>
  <text x="705" y="313" font-size="10" fill="#666">双向验证+四象限诊断图</text>
  <text x="705" y="325" font-size="10" fill="#888">PR-AUC+3.0%</text>
  <rect x="695" y="340" width="170" height="50" rx="6" fill="#fff" stroke="#d4a017"/>
  <text x="705" y="358" font-size="11" font-weight="600" fill="#7a5a00">UniVRSE (2025)</text>
  <text x="705" y="373" font-size="10" fill="#666">视觉条件化语义熵+ALFA</text>
  <rect x="695" y="400" width="170" height="44" rx="6" fill="#fff" stroke="#d4a017"/>
  <text x="705" y="418" font-size="11" font-weight="600" fill="#7a5a00">CHARTVE (ACL 2024)</text>
  <text x="705" y="433" font-size="10" fill="#666">VE检测事实错误，超GPT-4V</text>
  <rect x="695" y="455" width="170" height="80" rx="6" fill="#fff8e0" stroke="#d4a017" stroke-dasharray="4,2"/>
  <text x="705" y="473" font-size="10" font-weight="600" fill="#7a5a00">擅长检测：</text>
  <text x="705" y="488" font-size="10" fill="#444">✓ C8 否定矛盾</text>
  <text x="705" y="503" font-size="10" fill="#444">✓ 语义矛盾（整体）</text>
  <text x="705" y="518" font-size="10" fill="#444">△ C4 实体缺失</text>

