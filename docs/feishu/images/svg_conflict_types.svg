<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="960" height="540" fill="#fafbfc"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#222">AI看片说"有" vs 报告说"没有" → 冲突</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#888">五种冲突类型，按严重度从高到低排列</text>

  <!-- 冲突1 -->
  <rect x="40" y="70" width="880" height="60" rx="8" fill="#f8d7da" stroke="#c63a3a" stroke-width="2"/>
  <rect x="50" y="78" width="80" height="44" rx="6" fill="#c63a3a"/>
  <text x="90" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">高</text>
  <text x="90" y="115" text-anchor="middle" font-size="10" fill="#fff">严重</text>
  <text x="145" y="95" font-size="14" font-weight="700" fill="#7a1a1a">① AI看到病灶，但报告明确说"没有"</text>
  <text x="145" y="115" font-size="12" fill="#555">例：AI说胸腔积液概率0.809（很确信），报告写"No effusion"（无积液）→ 疑似漏诊，最严重</text>

  <!-- 冲突2 -->
  <rect x="40" y="140" width="880" height="55" rx="8" fill="#ffe0b2" stroke="#e08a2b" stroke-width="2"/>
  <rect x="50" y="148" width="80" height="40" rx="6" fill="#e08a2b"/>
  <text x="90" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">中</text>
  <text x="90" y="182" text-anchor="middle" font-size="10" fill="#fff">严重</text>
  <text x="145" y="165" font-size="14" font-weight="700" fill="#9a5a10">② AI看到病灶，但报告没提这个病，结论还说"正常"</text>
  <text x="145" y="183" font-size="12" fill="#555">例：AI说水肿概率0.725，报告全文没提edema，结论写"Lungs are clear" → 漏写，占冲突总量68%</text>

  <!-- 冲突3 -->
  <rect x="40" y="205" width="880" height="55" rx="8" fill="#ffe0b2" stroke="#e08a2b" stroke-width="2"/>
  <rect x="50" y="213" width="80" height="40" rx="6" fill="#e08a2b"/>
  <text x="90" y="233" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">中</text>
  <text x="90" y="247" text-anchor="middle" font-size="10" fill="#fff">严重</text>
  <text x="145" y="230" font-size="14" font-weight="700" fill="#9a5a10">③ 报告说"有"某个病，但AI在片子上没看到</text>
  <text x="145" y="248" font-size="12" fill="#555">例：报告写"pleural effusion present"，但AI概率0.033（很低）→ 可能报告写错，或AI有盲区</text>

  <!-- 冲突4 -->
  <rect x="40" y="270" width="880" height="55" rx="8" fill="#ffe0b2" stroke="#e08a2b" stroke-width="2"/>
  <rect x="50" y="278" width="80" height="40" rx="6" fill="#e08a2b"/>
  <text x="90" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">中</text>
  <text x="90" y="312" text-anchor="middle" font-size="10" fill="#fff">严重</text>
  <text x="145" y="295" font-size="14" font-weight="700" fill="#9a5a10">④ 报告正文写了有病，但结论又说"正常"</text>
  <text x="145" y="313" font-size="12" fill="#555">例：报告正文提了"atelectasis"（肺不张），结论却写"No acute abnormalities" → 报告自相矛盾</text>

  <!-- 冲突5 -->
  <rect x="40" y="335" width="880" height="55" rx="8" fill="#fff3cd" stroke="#d4a017" stroke-width="2"/>
  <rect x="50" y="343" width="80" height="40" rx="6" fill="#d4a017"/>
  <text x="90" y="363" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">低</text>
  <text x="90" y="377" text-anchor="middle" font-size="10" fill="#fff">严重</text>
  <text x="145" y="360" font-size="14" font-weight="700" fill="#7a5a00">⑤ AI看到病灶，但报告写得含糊（"可能""不排除"）</text>
  <text x="145" y="378" font-size="12" fill="#555">例：AI说实变概率0.510，报告写"may represent consolidation" → 需人工复核，不一定是错</text>

  <!-- 严重度规则 -->
  <rect x="40" y="405" width="880" height="120" rx="8" fill="#f0f0f0" stroke="#999"/>
  <text x="60" y="430" font-size="14" font-weight="700" fill="#333">严重度怎么定？——看AI有多"确信"</text>
  <text x="60" y="452" font-size="12" fill="#555">AI输出的概率越接近1（越偏离0.5），说明AI越确信片子上有病灶，冲突越可信、越严重：</text>
  <text x="60" y="473" font-size="12" fill="#c63a3a" font-weight="600">  概率 ≥ 0.7 → 高严重度（AI很确信，报告却说没有 → 高度疑似漏诊）</text>
  <text x="60" y="493" font-size="12" fill="#e08a2b" font-weight="600">  概率 ≥ 0.55 → 中严重度</text>
  <text x="60" y="513" font-size="12" fill="#d4a017" font-weight="600">  概率 < 0.55 → 低严重度（AI自己也不太确定，冲突可能只是假阳性）</text>
</svg>
